name: Sync Citadel on issue close

# GitHub to Citadel only; scripts/citadel_sync.py says why (#1933, epic #1932).
# The issue trigger catches closes as they happen. The nightly run catches any
# that were missed and rewrites the report issue with what it will not change.
#
# Requires repo secret CITADEL_URL. It is a secret so the address stays out of
# this public repository and its run logs.
on:
  issues:
    types: [closed]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

env:
  REPORT_ISSUE: 1936

jobs:
  on-close:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Close the issue's Citadel tasks
        env:
          CITADEL_URL: ${{ secrets.CITADEL_URL }}
          ISSUE: ${{ github.event.issue.number }}
          STATE_REASON: ${{ github.event.issue.state_reason }}
        run: python scripts/citadel_sync.py close --issue "$ISSUE" --state-reason "$STATE_REASON"

  reconcile:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Close missed tasks and write the report
        env:
          CITADEL_URL: ${{ secrets.CITADEL_URL }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/citadel_sync.py reconcile --report "$RUNNER_TEMP/report.md" --repo "$GITHUB_REPOSITORY"
      # always(): a refused run has written the report, and that is when it matters.
      - name: Update the report issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "$RUNNER_TEMP/report.md" ]; then
            gh issue edit "$REPORT_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/report.md"
          fi
