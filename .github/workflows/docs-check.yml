name: User documentation

on:
  pull_request:
  push:
    branches: [firmware-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Validator positive and negative tests
        run: python scripts/test_check_user_docs.py
      - name: Documentation-impact Git diff regression tests
        run: python scripts/test_docs_impact.py
      - name: Require documentation-impact decisions for firmware changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DOCS_DIFF_MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'push' }}
        run: >-
          python scripts/check_docs_impact.py
          --base "$DOCS_BASE_SHA" --head "$DOCS_HEAD_SHA" --mode "$DOCS_DIFF_MODE"
      - name: Check public manual and source evidence
        run: python scripts/check_user_docs.py --catalog docs/user/features.yml --content-root docs/user
      - name: Build standalone user manual
        run: python -m mkdocs build --strict --config-file mkdocs.user.yml
      - name: Verify rendered publication boundary
        run: python scripts/test_build_user_docs.py
      - uses: actions/upload-artifact@v6
        with:
          name: firmware-user-manual
          path: site-user/
          if-no-files-found: error

# Independent of ci.yml and its docs-only classifier. No publishing, secrets,
# dispatch, or firmware matrix/required-check configuration changes here.
