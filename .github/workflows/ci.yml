name: CI

# Offband firmware build verification. Builds a curated representative env
# set on every push to the canonical branch + PRs. NOT the full 407-env matrix
# (that is a publish concern); this proves the Offband differentiators
# (observer, repeater-telemetry) and SafeBoot (ESP32 + nRF52) compile.
#
# This repo's platformio.ini requires PIO_SECRETS_FILE (LoRa#209). Real secrets
# never live in CI; we generate a dummy stub so config interpolation succeeds.
# The dummy values become baked-in build-flag string constants -- they compile
# fine and are never flashed (build-only CI).

on:
  push:
    branches: [firmware-base]
  pull_request:
  workflow_dispatch:

jobs:
  # #1707: classify the change so a pure-docs edit does not pay for 80 build
  # legs. This job ONLY reports; it decides nothing on its own. `build` reads
  # this output to skip, and `ci-green` RECOMPUTES the same answer from the diff
  # rather than trusting it -- see the comment on ci-green for why.
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the diff needs both endpoints, not just the tip

      - name: Classify the changed paths
        id: classify
        uses: ./.github/actions/classify-changes

  # #199: build-config invariant check. Seconds, and it covers EVERY env rather
  # than the curated build matrix below -- which is the point. The NimBLE defect
  # recurred four times board-by-board because the affected envs were neither in
  # CI nor able to fail a release (release.yml is fail-fast: false, so a broken
  # env just silently produced no binary). A per-env build matrix would never
  # have caught it without building all 114; this asserts the rule instead.
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate dummy secrets stub (config interpolation only)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Every ESP32 env compiling SerialBLEInterface.cpp declares NimBLE
        run: python scripts/check_esp32_ble_deps.py

      # #649. Distinct question from the check above: that one asks whether an
      # env is internally coherent (can it LINK); this one asks whether the
      # config matches what the env NAME says it is. An env can pass the first
      # and fail this one -- a *_ble env with no BLE_PIN_CODE links cleanly and
      # ships with no BLE.
      - name: Env capability-claim self-test
        run: python scripts/test_env_capability_claims.py

      # #1619 (epic #1618, Feature #1599). MAX_FRAME_SIZE is 176: a protocol constant and
      # the frame BUFFER size. It is NOT what a link delivers -- a BLE notification
      # carries the negotiated ATT MTU minus 3, and the stack SILENTLY CLIPS a larger
      # frame. No error, no short return from writeFrame(), no failing test. So a builder
      # that sizes its payload against 176 is correct on serial and TCP and wrong on BLE,
      # which is exactly why it survives review: that is #450, and #711 was its
      # regression, found in the field two weeks later.
      #
      # This cannot be a symbol rule in check_symbol_presence.py (#1602) and that script's
      # docstring says so: maxFramePayload is a non-virtual inline member, present in some
      # envs and inlined away in others, both correct. So the invariant is asserted in the
      # SOURCE -- frame sizing goes through maxFramePayload(header_bytes).
      #
      # The rule turns on who OWNS the buffer, not on a text pattern. A transport
      # legitimately bounds its own buffer with the constant (asking maxFramePayload() to
      # validate its own buffer would be circular) and deliverableFrame() takes the
      # constant AS that bound by design; application frame builders must not. Both
      # categories are exempted by name, never by a loose pattern.
      #
      # The self-test runs FIRST and is not a formality: it carries the negative cases
      # proving what the checker catches -- including the false-positive traps that would
      # get it switched off, since some thirty comments in this tree name the constant and
      # KISS_MAX_FRAME_SIZE is a different protocol's 512-byte buffer -- plus a coverage
      # floor, because an "OK" from a checker that classified nothing looks identical to
      # one that classified everything.
      #
      # Both steps BLOCK. The checker's output names its known-unconverted baseline
      # (#1621) rather than hiding it, and fails if a baseline entry is converted without
      # shrinking the table, so the exemption list cannot rot into a silent coverage gap.
      - name: Frame-cap guard self-test
        run: python scripts/test_check_frame_cap.py

      - name: Frame sizing goes through maxFramePayload(), not MAX_FRAME_SIZE arithmetic
        run: python scripts/check_frame_cap.py

      # #1601 (Feature #1599). The board matrix is larger than anyone can bench-test,
      # and base updates arrive carrying pin changes for boards nobody here owns. A pin
      # that collides with another on the same bus builds cleanly and does not work --
      # no compile error, no test failure. This asserts a property over all 92 variants
      # instead, reading BOTH declaration styles (nRF52 #define headers and ESP32 -D
      # build flags), so adopting such a change is checkable without the board.
      #
      # The self-test runs FIRST and is not a formality: it carries the negative cases
      # proving what the checker catches, plus a coverage floor, because an "OK" from a
      # checker that compared nothing looks identical to one that compared everything.
      - name: Variant pin-collision guard self-test
        run: python scripts/test_check_variant_pin_collisions.py

      - name: No two pins of one peripheral share a GPIO, on any variant
        run: python scripts/check_variant_pin_collisions.py

      # #1602: the other half of the "builds clean, doesn't work" class. Deleting the
      # call that arms the watchdog, or landing a #define that selects a no-op crash-log
      # path, compiles fine and leaves the capability out of the image. The assertion
      # itself has to run where the artifacts are, so it lives in the build job below,
      # per matrix leg. What runs HERE is its self-test, which needs no build: the
      # negative cases (a base-class no-op must not satisfy a derived-class rule; the
      # mangled-name length prefix must keep substring matching exact) plus the coverage
      # floor that every env in the build matrix still classifies to a platform family.
      # That floor is why this is in config-lint and not only in build -- adding an env
      # the guard cannot classify fails here, immediately, instead of producing a leg
      # that checks nothing.
      - name: Built-artifact symbol-presence guard self-test
        run: python scripts/test_check_symbol_presence.py

      # #749/#758: the asset generators. The native-tests job discovers and runs the
      # C++ suites on its own, but nothing discovers scripts/test_*.py -- they only
      # run if named here. A generator bug is silent (the splash renders in the wrong
      # colours, or the text in the wrong shape, on one board), so this is cheap
      # insurance.
      #
      # Pillow is needed to rasterise. Both generators import it defensively and the
      # pure-arithmetic tests pass without it, but installing it here means the image
      # paths are actually exercised rather than skipped -- which is the point.
      - name: Install asset-generator deps
        run: python -m pip install --quiet pillow

      - name: Splash asset generator self-test
        run: python scripts/test_gen_offband_logo.py

      # The real-font cases skip unless JBM_TTF points at the TTF, which is NOT
      # committed (only the generated table is). The packing, quantisation and
      # coverage-range assertions run regardless, and those are the ones that catch a
      # silently wrong glyph table.
      - name: Font generator self-test
        run: python scripts/test_gen_jbm_font.py

      # #1172: the QCC badge guards. The pin-map guard fails if a badge output, Serial1,
      # a default bus or the diag log mirror lands on the wrong GPIO -- the ProMicro
      # Serial1 default would drive the badge's buzzer and LED. The splash-art test fails
      # if the committed header drifts from its generator.
      - name: QCC badge pin-map guard
        run: python scripts/test_qcc_variant_pins.py

      # #1676: the R8 TFT GUI env's pins, from Heltec's Expansion Board V2.03 schematic.
      # GPIO21 resets the panel and touch together, touch shares the sensors' I2C bus,
      # and GPIO46 is an active-high KEY shared with the TX LED. Each is a one-line edit
      # from an image that builds and then blanks, loses touch, or ignores the key.
      - name: R8 TFT GUI env pins
        run: python scripts/test_r8_tft_gui_env.py

      # #1434: the T-Deck GUI env. Display, SD and radio share one SPI bus, so the
      # radio must reach it through ESP-IDF (EspSharedSpiHal on SPI2), never an Arduino
      # SPIClass that would take the pins from the display and card. Pins from LilyGo's
      # schematic (#1724).
      - name: T-Deck GUI env pins and shared bus
        run: python scripts/test_tdeck_gui_env.py

      # #1704: the SD archive's call sites. The archive's rules are host-tested; this
      # checks the firmware uses them: every stored message whose delivery or echo
      # count changes also reaches the card, and the loop drives the card at all.
      - name: GUI SD archive wiring
        run: python scripts/test_gui_sd_wiring.py

      # #1741: every channel the radio holds is in Chats, messages or not. The store
      # makes a channel's thread on first use, so these two call sites are all that
      # stand between a fresh radio and an empty Chats with Public configured.
      - name: GUI channel threads
        run: python scripts/test_gui_channel_threads.py

      # #1625: which preflashed channels ship quiet. A silent channel and a channel that
      # made no choice are one byte apart, and swapping them is invisible until a badge is
      # quiet in the wrong room -- or noisy in the one a tester asked to be quiet.
      - name: QCC preflash channel tunes
        run: python scripts/test_qcc_preflash_tunes.py

      # #1638: the badge env values that had no coverage at all -- LED_BLUE freeing P0.15
      # from the Arduino core, the two heartbeat cadences, the naming prefix, and the
      # trigger staying badge-scoped. Each is a one-line edit away from silently reverting
      # with the whole matrix still green.
      #
      # It also ties test_heartbeat_cadence's 12 cases to reality. That suite hardcodes
      # 90/890/4890 as its own constants, so until this check existed it would pass
      # unchanged after those values were deleted from the build.
      - name: QCC badge env invariants
        run: python scripts/test_qcc_badge_env.py

      # #1639: the four .cpp call sites where the RULE is tested and the USE of the rule
      # is not -- which is the specific way a green suite coexists with a broken badge.
      # 49 trigger cases, 15 buzzer-priority cases, 8 store cases and 8 keynav cases all
      # keep passing while the trigger is truncated, stops firing for long sender names,
      # renders channels bare, or strands a keyboard-less badge in Settings.
      #
      # TRIPWIRES, not behavioural coverage: they assert text is present, so a refactor
      # preserving the text while changing behaviour passes. The file header says so.
      - name: QCC badge call-site guards
        run: python scripts/test_qcc_call_sites.py

      # #1641: the assessment logic of the rig boot smoke test.
      #
      # The smoke test's hardware RUN cannot be in CI -- it needs the sniffer rig and a
      # badge, and it gates a flash rather than a PR. Its ASSERTIONS can be, and this is
      # them: a synthetic capture in, a verdict out. Without this, the one piece of the
      # epic that actually runs firmware would itself be the only piece with no coverage,
      # and a boot smoke test whose pass condition is untested can report OK for the
      # wrong reason.
      #
      # Includes a hang at every one of the declared boot stages, not one example.
      - name: Rig boot smoke-test assertions
        run: python scripts/test_rig_boot_smoke.py

      # #1667: every low-battery cutoff goes through the one debounced rule.
      #
      # This defect was written THREE times independently, once per UI family, because
      # nothing checked. ui-gui copied ui-new's raw-sample form deliberately and
      # documented the copy. #1667 fixed two families and said "both"; there were three,
      # and the third arrived in a base merge after the grep that found the other two.
      #
      # A build does not catch it: the GUI variant built clean in a 4/4 gate run while
      # still carrying it. The decision powers hardware off and fails silently, so it
      # gets a guard that also asserts the FAMILY COUNT -- a fourth family makes this
      # fail and someone has to look.
      - name: Low-battery cutoff call sites
        run: python scripts/test_low_batt_cutoff_call_sites.py

      - name: QCC splash-art generator self-test
        run: python scripts/test_gen_qcc_splash.py

      # #1199: the WROOM sniffer sketch is a copy of the Feather one, because Arduino
      # builds a sketch from its own folder only. This fails if the two drift apart
      # outside their marked VARIANT blocks.
      - name: Sniffer WROOM-copy drift guard
        run: python scripts/test_sniffer_wroom_copy.py

      # #1199: capture.py on a CP2102/CH340 rig. --no-dtr must keep GPIO0 high, and
      # --reset must reboot the rig from flash once, never again on a reconnect.
      - name: Sniffer capture bridge-flag tests
        run: python scripts/test_capture_bridge_flags.py

      # #1514: _cap_serial.py writes the LOG before it prints, and its print cannot
      # raise. A node name carrying an emoji ended a live bench capture: print() hit a
      # cp1252 console, raised out of emit(), and the line never reached the UTF-8 file.
      # This fails if that order is reversed or the guard removed.
      - name: Bench capture survives an unprintable line
        run: python scripts/test_cap_serial_emit.py

      # #1211: SafeBoot's battery lines go through MeshLog, so a bench rig reading
      # the raw UART log mirror sees them, and the low-battery path lets the
      # mirror finish its line before the board sleeps.
      - name: SafeBoot log-channel guard
        run: python scripts/test_safeboot_log_channels.py

      # #1083 / #1159 / #1160 (epic #446). For fifteen months the ESP32 repeater
      # and companion never armed their task watchdog: startWatchdog()/feedWatchdog()
      # sat inside `#if defined(NRF52_PLATFORM)`. It compiled, it linked, and a
      # watchdog that is never armed looks exactly like one that never had to fire
      # -- until a field node hung and stayed hung. These are BLOCKING, not
      # advisory: the tree is clean so they land green, and the regression they
      # guard is an unattended node that never comes back. `test_wdt_timeout`
      # (googletest) is picked up by the native-tests job on its own.
      - name: Watchdog guard self-test
        run: python scripts/test_wdt_guard.py

      - name: Watchdog armed and fed on every platform, in every role
        run: python scripts/check_wdt_guard.py

      - name: "'wdt hang' is diag-only and console-only"
        run: python scripts/test_wdt_hang_verb.py

      - name: Self-hang (WDT_TEST_HANG_AFTER_MS) is flag-only and adjacent to the feed in every role
        run: python scripts/test_wdt_self_hang.py

      - name: Watchdog CI wiring self-test
        run: python scripts/test_ci_wdt_steps.py

      # #1265: the caplog receiver's rotation policy names an owner that exists
      # on the host, and logrotate accepts it before anything is installed. A
      # hardcoded `syslog` failed a host's nightly rotation for weeks (#1264).
      - name: Caplog receiver rotation-policy tests
        run: python scripts/test_offband_caplog_receiver_setup.py

      # #1294. release.yml stripped `-beta*` off the tag before looking up a
      # CHANGELOG heading, so every beta published the base version's section:
      # beta6's page opened with "### Fixed (beta2)" while `## [1.5.0-beta6]`
      # sat unread in the file. Nothing failed -- a release page with the wrong
      # notes looks like a release page. This runs release.yml's own extraction
      # against fixtures, so the notes a tag publishes cannot silently go stale
      # again. BLOCKING: the tree is clean, and the failure mode is invisible.
      - name: Release notes come from the tagged version's section
        run: python scripts/test_release_notes_section.py

      # #1707: the docs-only allowlist, and the property it rests on -- that no
      # build input CONSUMES an allowlisted path. This runs in config-lint
      # because config-lint never skips, so the rule that decides what may skip
      # is itself always checked.
      - name: Docs-only classifier and its allowlist safety property
        run: python scripts/test_classify_changes.py

      # #775 (epic #774). Guards the defect class behind #764/#765: an `else if`
      # that matches a CLI key and writes nothing, or a key claimed twice in one
      # chain so the later arm is unreachable. `get radio` returned an empty reply
      # for ten months that way -- it compiles, no compiler calls it dead, and the
      # serial console hides it because that caller zeroes its buffer and skips
      # empty replies. Only the radio transport showed it, as stack bytes.
      #
      # ADVISORY, deliberately. The fixes (#778/#779) have NOT landed yet, so this
      # step is expected to REPORT FINDINGS here -- that log is the evidence the
      # guard catches the real defect, and it cannot be produced once the tree is
      # fixed. A blocking check cannot land red. Promotion to required is a
      # separate owner decision, tracked as #776.
      - name: CLI dispatch guard self-test (advisory)
        continue-on-error: true
        run: python scripts/test_cli_dispatch.py

      - name: No empty or shadowed arms in the CLI dispatch chains (advisory)
        continue-on-error: true
        run: python scripts/check_cli_dispatch.py --json-out "$RUNNER_TEMP/cli-dispatch.json"

      - name: Upload CLI dispatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-dispatch
          path: ${{ runner.temp }}/cli-dispatch.json

      # #1048 (epic #1045). A log forwarder may depend on a WiFi link, but it must
      # never bring one up, tear one down, or move its deadline. The first caplog
      # forward did both, overriding the link the operator had set. The self-test
      # also runs the guard over the tree. Advisory, like the dispatch guard above:
      # whether it blocks merges is decided separately.
      - name: Caplog forward never controls the WiFi link (advisory)
        continue-on-error: true
        run: python scripts/test_caplog_link_guard.py

      # ADVISORY until #648 (the capability inventory) validates what this asserts.
      # ci-green is a hard merge gate for every PR in the repo (#477), so a check
      # built on unvalidated assumptions must not block other people's work. The
      # JSON report is still uploaded; promote to blocking when #648 lands.
      - name: Env names agree with their resolved config (advisory)
        continue-on-error: true
        run: python scripts/check_env_capability_claims.py --json-out "$RUNNER_TEMP/capability-claims.json"

      - name: Upload capability-claim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-claims
          path: ${{ runner.temp }}/capability-claims.json
          if-no-files-found: warn
  # #712: the googletest suites existed but NOTHING ran them in CI, so every invariant they
  # encode was unenforced on PRs. That is how #711 (a regression of #450) reached the field:
  # the frame-size ceiling had no mechanical guard, only a comment.
  #
  # Envs are DISCOVERED, not listed. There are two native test envs today ([env:native] and
  # [env:native_kiss_modem], the latter excluded from the former via test_ignore), and a
  # hardcoded `pio test -e native` silently skipped the second one -- the same "looks
  # covered, isn't" failure this job exists to end. Any future env with `platform = native`
  # is picked up automatically.
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Required even though nothing here is flashed: PlatformIO parses the WHOLE
      # platformio.ini (including the ${node_secrets...} interpolations used by the
      # device envs) before it can resolve [env:native], so without this every native
      # suite ERRORs with "No section: 'node_secrets'". Mirrors config-lint and build.
      - name: Generate dummy secrets stub (test-only; never flashed)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Discover native test environments
        id: envs
        run: |
          set -euo pipefail
          envs=$(python - <<'PY'
          import configparser
          cfg = configparser.ConfigParser(strict=False)
          cfg.read('platformio.ini')
          names = [s.split(':', 1)[1] for s in cfg.sections()
                   if s.startswith('env:')
                   and cfg.get(s, 'platform', fallback='').strip() == 'native']
          print(' '.join(sorted(names)))
          PY
          )
          echo "Discovered native test envs: ${envs:-<none>}"
          # Fail loudly rather than passing green having run nothing. A test job that
          # silently executes zero tests is worse than no job at all: it reports success.
          if [ -z "$envs" ]; then
            echo "::error::No native test environments found in platformio.ini" >&2
            exit 1
          fi
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

      - name: Run native unit tests
        run: |
          set -euo pipefail
          for e in ${{ steps.envs.outputs.envs }}; do
            echo "::group::pio test -e $e"
            pio test -e "$e"
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    # #1707: the only job worth skipping. `config-lint` and `native-tests` stay
    # unconditional -- they are cheap, and config-lint is where the guards for
    # the docs paths themselves live (the release-notes section test).
    #
    # A job-level `if:` is safe here specifically because `ci-green` is the ONLY
    # required context on firmware-base [verified: branch object,
    # required_status_checks.contexts == ["ci-green"], enforcement_level
    # "everyone"]. These 80 legs are not individually required, so they can
    # simply never start rather than start and short-circuit.
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_companion_observer_wifi
          - Xiao_S3_WIO_companion_observer_wifi
          - heltec_v4_companion_observer_wifi
          - heltec_v4_tft_companion_observer_wifi
          - heltec_v4_repeater_telemetry
          - heltec_v4_companion_radio_ble
          - RAK_4631_repeater
          - Heltec_t114_companion_radio_ble   # nRF52 companion coverage (BLE; complements RAK_4631 repeater)
          # RAK3401 (WisMesh 1W) -- a widely-used device; its RAK_BOARD GPS path is
          # rak3401-specific and was previously built nowhere in CI (#211 shipped a
          # companion that couldn't TX). Cover both fix-touched companion envs (the
          # RAK3401_NO_GPS no-GPS path) + the repeater (live-GPS branch of the gate).
          - RAK_3401_companion_radio_ble
          - RAK_3401_companion_radio_usb
          - RAK_3401_repeater
          # #199: one env per remedy class, both previously unbuildable and both
          # in the SHIPPED release matrix -- releases were publishing without
          # their binaries. The usb env is the non-BLE case (drops
          # SerialBLEInterface.cpp); Xiao_C6 is the BLE case (declares the dep)
          # and also covers the C6 platform package, which resolves NimBLE
          # separately from the esp32/esp32s3 line.
          - Heltec_v2_companion_radio_usb
          - Xiao_C6_companion_radio_ble_
          - meshsmith_photon_esp32c6_e22p_30dbm_companion_radio_ble   # MeshSmith Photon-1W (ESP32-C6 + E22 1W) coverage -- #193
          - meshsmith_photon_esp32c6_e22p_30dbm_repeater   # Photon-1W repeater (its primary "ridge repeater" role) -- #193
          - meshsmith_photon_nrf52_e22p_30dbm_repeater   # Photon-1W nRF52 repeater coverage -- #194
          # #477: room_server role was previously built NOWHERE in CI -- caplog-era
          # cross-role changes could compile-break it invisibly. One env per MCU
          # family/flavor in active use.
          - Heltec_v3_room_server
          - heltec_v4_room_server
          - RAK_3401_room_server
          - RAK_4631_room_server
          - Xiao_S3_room_server
          # #477: tracker variants ship in every release but were built nowhere
          # in CI -- variant-specific code (GPS/eink/button paths) was blind.
          # Owner has bench devices for both as of 2026-07-31.
          - t1000e_companion_radio_ble
          - WioTrackerL1_companion_radio_ble
          - SenseCap_Solar_repeater   # fleet-deployed fixed solar nodes (owner, 2026-07-31)
          # #479: Heltec T096 (nRF52) -- in active use; repeater-improvement work
          # incoming, so its primary role + BLE companion must build in CI.
          # (No observer env exists: observer is ESP32/WiFi-only.)
          - Heltec_t096_repeater
          - Heltec_t096_companion_radio_ble
          # #482: owner-directed role-coverage expansion (2026-07-31). T096 WiFi
          # observer was requested but cannot exist (nRF52, no WiFi); C6 lacks
          # room_server/usb/wifi-companion envs; S3 non-WIO lacks wifi/observer.
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - heltec_v4_tft_companion_radio_ble
          - heltec_v4_tft_companion_radio_wifi
          # #1440: on-device GUI companion (Feature #1313 plan of record, Epic A).
          - heltec_v4_tft_companion_radio_ble_gui
          - heltec_v4_tft_companion_radio_ble_gui_diag
          # #1676: the same GUI on the V4 R8 with the Expansion Kit V2 (Epic I).
          - heltec_v4_r8_tft_companion_radio_ble_gui
          - heltec_v4_r8_tft_companion_radio_ble_gui_diag
          # #1434: the same GUI on the LilyGo T-Deck (Epic J), radio on the shared SPI2.
          - LilyGo_TDeck_companion_radio_ble_gui
          - LilyGo_TDeck_companion_radio_ble_gui_diag
          # #733: Heltec Vision Master E290 (ESP32-S3 + SX1262, 2.9" e-ink) --
          # first e-ink board; community-tester enablement off the upstream-1.17
          # variant. Owner scope (2026-08-13): companion ble+usb only, repeater
          # deferred. Both smoke-built green before this matrix add (#683 lesson).
          - Heltec_E290_companion_ble
          - Heltec_E290_companion_usb
          - heltec_v4_companion_radio_wifi
          - RAK_4631_companion_radio_usb
          - RAK_4631_companion_radio_ble
          - Xiao_S3_repeater
          - Xiao_S3_companion_radio_ble
          - Xiao_S3_companion_radio_usb
          - Xiao_S3_WIO_repeater
          - Xiao_S3_WIO_room_server
          - Xiao_S3_WIO_companion_radio_ble
          - Xiao_S3_WIO_companion_radio_usb
          - Xiao_S3_WIO_companion_radio_wifi
          - Xiao_C6_repeater_
          # #854 (epic #879): Heltec RadioCore RC52 (nRF52840 + HT-RA62A/SX1262).
          # (No observer env exists: observer is ESP32/WiFi-only, and nRF52840 has
          # no WiFi -- same reason Heltec_t096 has none above.)
          #
          # UPDATED 2026-08-28 (#1016). The previous note here said RC52 was
