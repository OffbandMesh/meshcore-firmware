name: CI

# Offband firmware build verification. Builds a curated representative env
# set on every push to the canonical branch + PRs. NOT the full 407-env matrix
# (that is a publish concern); this proves the Offband differentiators
# (observer, repeater-telemetry) and SafeBoot (ESP32 + nRF52) compile.
#
# This repo's platformio.ini requires PIO_SECRETS_FILE (LoRa#209). Real secrets
# never live in CI; we generate a dummy stub so config interpolation succeeds.
# The dummy values become baked-in build-flag string constants -- they compile
# fine and are never flashed (build-only CI).

on:
  push:
    branches: [firmware-base]
  pull_request:
  workflow_dispatch:

jobs:
  # #199: build-config invariant check. Seconds, and it covers EVERY env rather
  # than the curated build matrix below -- which is the point. The NimBLE defect
  # recurred four times board-by-board because the affected envs were neither in
  # CI nor able to fail a release (release.yml is fail-fast: false, so a broken
  # env just silently produced no binary). A per-env build matrix would never
  # have caught it without building all 114; this asserts the rule instead.
  config-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate dummy secrets stub (config interpolation only)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Every ESP32 env compiling SerialBLEInterface.cpp declares NimBLE
        run: python scripts/check_esp32_ble_deps.py

      # #649. Distinct question from the check above: that one asks whether an
      # env is internally coherent (can it LINK); this one asks whether the
      # config matches what the env NAME says it is. An env can pass the first
      # and fail this one -- a *_ble env with no BLE_PIN_CODE links cleanly and
      # ships with no BLE.
      - name: Env capability-claim self-test
        run: python scripts/test_env_capability_claims.py

      # #749/#758: the asset generators. The native-tests job discovers and runs the
      # C++ suites on its own, but nothing discovers scripts/test_*.py -- they only
      # run if named here. A generator bug is silent (the splash renders in the wrong
      # colours, or the text in the wrong shape, on one board), so this is cheap
      # insurance.
      #
      # Pillow is needed to rasterise. Both generators import it defensively and the
      # pure-arithmetic tests pass without it, but installing it here means the image
      # paths are actually exercised rather than skipped -- which is the point.
      - name: Install asset-generator deps
        run: python -m pip install --quiet pillow

      - name: Splash asset generator self-test
        run: python scripts/test_gen_offband_logo.py

      # The real-font cases skip unless JBM_TTF points at the TTF, which is NOT
      # committed (only the generated table is). The packing, quantisation and
      # coverage-range assertions run regardless, and those are the ones that catch a
      # silently wrong glyph table.
      - name: Font generator self-test
        run: python scripts/test_gen_jbm_font.py

      # #775 (epic #774). Guards the defect class behind #764/#765: an `else if`
      # that matches a CLI key and writes nothing, or a key claimed twice in one
      # chain so the later arm is unreachable. `get radio` returned an empty reply
      # for ten months that way -- it compiles, no compiler calls it dead, and the
      # serial console hides it because that caller zeroes its buffer and skips
      # empty replies. Only the radio transport showed it, as stack bytes.
      #
      # ADVISORY, deliberately. The fixes (#778/#779) have NOT landed yet, so this
      # step is expected to REPORT FINDINGS here -- that log is the evidence the
      # guard catches the real defect, and it cannot be produced once the tree is
      # fixed. A blocking check cannot land red. Promotion to required is a
      # separate owner decision, tracked as #776.
      - name: CLI dispatch guard self-test (advisory)
        continue-on-error: true
        run: python scripts/test_cli_dispatch.py

      - name: No empty or shadowed arms in the CLI dispatch chains (advisory)
        continue-on-error: true
        run: python scripts/check_cli_dispatch.py --json-out "$RUNNER_TEMP/cli-dispatch.json"

      - name: Upload CLI dispatch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-dispatch
          path: ${{ runner.temp }}/cli-dispatch.json

      # ADVISORY until #648 (the capability inventory) validates what this asserts.
      # ci-green is a hard merge gate for every PR in the repo (#477), so a check
      # built on unvalidated assumptions must not block other people's work. The
      # JSON report is still uploaded; promote to blocking when #648 lands.
      - name: Env names agree with their resolved config (advisory)
        continue-on-error: true
        run: python scripts/check_env_capability_claims.py --json-out "$RUNNER_TEMP/capability-claims.json"

      - name: Upload capability-claim report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-claims
          path: ${{ runner.temp }}/capability-claims.json
          if-no-files-found: warn
  # #712: the googletest suites existed but NOTHING ran them in CI, so every invariant they
  # encode was unenforced on PRs. That is how #711 (a regression of #450) reached the field:
  # the frame-size ceiling had no mechanical guard, only a comment.
  #
  # Envs are DISCOVERED, not listed. There are two native test envs today ([env:native] and
  # [env:native_kiss_modem], the latter excluded from the former via test_ignore), and a
  # hardcoded `pio test -e native` silently skipped the second one -- the same "looks
  # covered, isn't" failure this job exists to end. Any future env with `platform = native`
  # is picked up automatically.
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Required even though nothing here is flashed: PlatformIO parses the WHOLE
      # platformio.ini (including the ${node_secrets...} interpolations used by the
      # device envs) before it can resolve [env:native], so without this every native
      # suite ERRORs with "No section: 'node_secrets'". Mirrors config-lint and build.
      - name: Generate dummy secrets stub (test-only; never flashed)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Discover native test environments
        id: envs
        run: |
          set -euo pipefail
          envs=$(python - <<'PY'
          import configparser
          cfg = configparser.ConfigParser(strict=False)
          cfg.read('platformio.ini')
          names = [s.split(':', 1)[1] for s in cfg.sections()
                   if s.startswith('env:')
                   and cfg.get(s, 'platform', fallback='').strip() == 'native']
          print(' '.join(sorted(names)))
          PY
          )
          echo "Discovered native test envs: ${envs:-<none>}"
          # Fail loudly rather than passing green having run nothing. A test job that
          # silently executes zero tests is worse than no job at all: it reports success.
          if [ -z "$envs" ]; then
            echo "::error::No native test environments found in platformio.ini" >&2
            exit 1
          fi
          echo "envs=$envs" >> "$GITHUB_OUTPUT"

      - name: Run native unit tests
        run: |
          set -euo pipefail
          for e in ${{ steps.envs.outputs.envs }}; do
            echo "::group::pio test -e $e"
            pio test -e "$e"
            echo "::endgroup::"
          done

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - Heltec_v3_companion_observer_wifi
          - Xiao_S3_WIO_companion_observer_wifi
          - heltec_v4_companion_observer_wifi
          - heltec_v4_tft_companion_observer_wifi
          - heltec_v4_repeater_telemetry
          - heltec_v4_companion_radio_ble
          - RAK_4631_repeater
          - Heltec_t114_companion_radio_ble   # nRF52 companion coverage (BLE; complements RAK_4631 repeater)
          # RAK3401 (WisMesh 1W) -- a widely-used device; its RAK_BOARD GPS path is
          # rak3401-specific and was previously built nowhere in CI (#211 shipped a
          # companion that couldn't TX). Cover both fix-touched companion envs (the
          # RAK3401_NO_GPS no-GPS path) + the repeater (live-GPS branch of the gate).
          - RAK_3401_companion_radio_ble
          - RAK_3401_companion_radio_usb
          - RAK_3401_repeater
          # #199: one env per remedy class, both previously unbuildable and both
          # in the SHIPPED release matrix -- releases were publishing without
          # their binaries. The usb env is the non-BLE case (drops
          # SerialBLEInterface.cpp); Xiao_C6 is the BLE case (declares the dep)
          # and also covers the C6 platform package, which resolves NimBLE
          # separately from the esp32/esp32s3 line.
          - Heltec_v2_companion_radio_usb
          - Xiao_C6_companion_radio_ble_
          - meshsmith_photon_esp32c6_e22p_30dbm_companion_radio_ble   # MeshSmith Photon-1W (ESP32-C6 + E22 1W) coverage -- #193
          - meshsmith_photon_esp32c6_e22p_30dbm_repeater   # Photon-1W repeater (its primary "ridge repeater" role) -- #193
          - meshsmith_photon_nrf52_e22p_30dbm_repeater   # Photon-1W nRF52 repeater coverage -- #194
          # #477: room_server role was previously built NOWHERE in CI -- caplog-era
          # cross-role changes could compile-break it invisibly. One env per MCU
          # family/flavor in active use.
          - Heltec_v3_room_server
          - heltec_v4_room_server
          - RAK_3401_room_server
          - RAK_4631_room_server
          - Xiao_S3_room_server
          # #477: tracker variants ship in every release but were built nowhere
          # in CI -- variant-specific code (GPS/eink/button paths) was blind.
          # Owner has bench devices for both as of 2026-07-31.
          - t1000e_companion_radio_ble
          - WioTrackerL1_companion_radio_ble
          - SenseCap_Solar_repeater   # fleet-deployed fixed solar nodes (owner, 2026-07-31)
          # #479: Heltec T096 (nRF52) -- in active use; repeater-improvement work
          # incoming, so its primary role + BLE companion must build in CI.
          # (No observer env exists: observer is ESP32/WiFi-only.)
          - Heltec_t096_repeater
          - Heltec_t096_companion_radio_ble
          # #482: owner-directed role-coverage expansion (2026-07-31). T096 WiFi
          # observer was requested but cannot exist (nRF52, no WiFi); C6 lacks
          # room_server/usb/wifi-companion envs; S3 non-WIO lacks wifi/observer.
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - heltec_v4_tft_companion_radio_ble
          - heltec_v4_tft_companion_radio_wifi
          # #733: Heltec Vision Master E290 (ESP32-S3 + SX1262, 2.9" e-ink) --
          # first e-ink board; community-tester enablement off the upstream-1.17
          # variant. Owner scope (2026-08-13): companion ble+usb only, repeater
          # deferred. Both smoke-built green before this matrix add (#683 lesson).
          - Heltec_E290_companion_ble
          - Heltec_E290_companion_usb
          - heltec_v4_companion_radio_wifi
          - RAK_4631_companion_radio_usb
          - RAK_4631_companion_radio_ble
          - Xiao_S3_repeater
          - Xiao_S3_companion_radio_ble
          - Xiao_S3_companion_radio_usb
          - Xiao_S3_WIO_repeater
          - Xiao_S3_WIO_room_server
          - Xiao_S3_WIO_companion_radio_ble
          - Xiao_S3_WIO_companion_radio_usb
          - Xiao_S3_WIO_companion_radio_wifi
          - Xiao_C6_repeater_
          # #854 (epic #879): Heltec RadioCore RC52 (nRF52840 + HT-RA62A/SX1262).
          # Owner-directed 2026-08-21: RC52 goes into CI as it is built out, so the
          # build is validated, but deliberately NOT into .github/release-envs.txt
          # until #880 (display) lands and it has had further testing. CI-only here.
          # (No observer env exists: observer is ESP32/WiFi-only, and nRF52840 has
          # no WiFi -- same reason Heltec_t096 has none above.)
          # Envs carry the RC32 _without_display_ convention: this board has no
          # display support yet (#880), so every shipping env today is headless.
          # OWNER DIRECTIVE 2026-08-22 (#889): until a near-release beta, every env
          # BUILT is a full diagnostic build -- forced caplog + boot beacon + UART
          # mirror. CI therefore builds the _diag envs, not their plain parents.
          # The parents still exist so the release-time diag/non-diag pairs are
          # already there, correctly named, when we get to beta.
          - heltec_rc52_without_display_repeater_diag
          - heltec_rc52_without_display_companion_radio_ble_diag
          - heltec_rc52_without_display_companion_radio_usb_diag
          - heltec_rc52_without_display_room_server_diag
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains/packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/**/*.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate dummy secrets stub (build-only; never flashed)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      # Dev-channel artifact (epic #14 / T2, #16). Built with the placeholder
      # secrets stub above -- these are dev/test builds, NOT releases. Configure
      # WiFi/MQTT at runtime, or rebuild with real secrets.
      - name: Upload firmware artifact (dev channel)
        uses: actions/upload-artifact@v6
        with:
          name: offband-dev-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
            .pio/build/${{ matrix.env }}/firmware.hex
            .pio/build/${{ matrix.env }}/firmware.zip
            .pio/build/${{ matrix.env }}/firmware.uf2
          if-no-files-found: warn
          retention-days: 90

  # #477: single required-status aggregation point. Branch protection on
  # firmware-base requires ONLY this check -- so matrix edits can never
  # silently un-require an env, and `gh pr merge --auto` genuinely waits for
  # the full curated matrix. `needs.build.result` is `success` only when EVERY
  # matrix leg succeeded (fail-fast is off, so all legs always report).
  # `if: always()` makes this job run -- and FAIL -- even when a dependency
  # failed; without it a red build would leave ci-green skipped, and a skipped
  # required check blocks the PR with no explanation instead of a red X.
  ci-green:
    runs-on: ubuntu-latest
    needs: [config-lint, native-tests, build]
    if: always()
    steps:
      - name: All required CI jobs green
        run: |
          echo "config-lint: ${{ needs.config-lint.result }}"
          echo "native-tests: ${{ needs.native-tests.result }}"
          echo "build (all matrix legs): ${{ needs.build.result }}"
          test "${{ needs.config-lint.result }}" = "success"
          test "${{ needs.native-tests.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
