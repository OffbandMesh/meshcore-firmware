          - QCC_Badge_companion_radio_ble
          - QCC_Badge_companion_radio_ble_diag
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache PlatformIO toolchains/packages
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'variants/**/*.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Generate dummy secrets stub (build-only; never flashed)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      # Dev-channel artifact (epic #14 / T2, #16). Built with the placeholder
      # secrets stub above -- these are dev/test builds, NOT releases. Configure
      # WiFi/MQTT at runtime, or rebuild with real secrets.
      - name: Upload firmware artifact (dev channel)
        uses: actions/upload-artifact@v6
        with:
          name: offband-dev-${{ matrix.env }}
          path: |
            .pio/build/${{ matrix.env }}/firmware.bin
            .pio/build/${{ matrix.env }}/firmware.elf
            .pio/build/${{ matrix.env }}/firmware.hex
            .pio/build/${{ matrix.env }}/firmware.zip
            .pio/build/${{ matrix.env }}/firmware.uf2
          if-no-files-found: warn
          retention-days: 90

      # #1602: a green build does not mean the Offband capabilities are IN the image.
      # This reads .symtab out of the ELF just built and asserts that the crash log,
      # the watchdog, the ESP32 boot-rollback safety and the packet-hash capability are
      # linked -- per env, so a change that unlinks one fails on the leg where it
      # happened rather than being found in the field. Rules name the owning class
      # (ESP32Board, not the mesh::MainBoard no-op default) and, where a capability has
      # a no-op twin behind an #ifdef that emits the same mangled name, a symbol only
      # the live path compiles. Not advisory: this is the regression class #1599 exists
      # to close, and the matrix is larger than anyone can bench-test.
      #
      # Runs AFTER the upload on purpose: when this fails, the artifact it failed on is
      # already attached to the run, so the ELF can be read instead of reproduced.
      - name: Offband capabilities are linked into ${{ matrix.env }}
        run: python scripts/check_symbol_presence.py --env ${{ matrix.env }} --verbose

  # #477: single required-status aggregation point. Branch protection on
  # firmware-base requires ONLY this check -- so matrix edits can never
  # silently un-require an env, and `gh pr merge --auto` genuinely waits for
  # the full curated matrix. `needs.build.result` is `success` only when EVERY
  # matrix leg succeeded (fail-fast is off, so all legs always report).
  # `if: always()` makes this job run -- and FAIL -- even when a dependency
  # failed; without it a red build would leave ci-green skipped, and a skipped
  # required check blocks the PR with no explanation instead of a red X.
  ci-green:
    runs-on: ubuntu-latest
    needs: [classify, config-lint, native-tests, build]
    if: always()
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # this job recomputes the diff; it needs both endpoints

      # #1707: the gate does NOT trust `classify`. It derives docs_only itself
      # and accepts a skipped `build` only on its own evidence.
      #
      # OffbandMesh/meshcore-client#904: a forced classifier output reached their
      # default branch and every job trusted it. Seven heavy checks reported
      # green having built nothing, for ~19 hours, and real code merged with no
      # CI behind it. The lesson is not "do not forget a flag" -- it is that a
      # gate which reads one upstream value is only as honest as that value, and
      # a disarmed gate looks exactly like a working one.
      - name: Recompute the change classification, independently of classify
        id: recheck
        uses: ./.github/actions/classify-changes

      - name: All required CI jobs green
        run: |
          echo "classify said      : ${{ needs.classify.outputs.docs_only }}"
          echo "this gate recomputed: ${{ steps.recheck.outputs.docs_only }}"
          echo "config-lint        : ${{ needs.config-lint.result }}"
          echo "native-tests       : ${{ needs.native-tests.result }}"
          echo "build              : ${{ needs.build.result }}"

          # These two never skip, so their rule is unchanged.
          test "${{ needs.config-lint.result }}" = "success"
          test "${{ needs.native-tests.result }}" = "success"

          # `build` may be success, or skipped -- but skipped is acceptable ONLY
          # when THIS job's own recompute says the change was docs-only. Any
          # other skip (a cancelled run, a failed dependency, a forced upstream
          # output) still fails the gate, exactly as before this change.
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "build ran and passed"
          elif [ "${{ needs.build.result }}" = "skipped" ] \
            && [ "${{ steps.recheck.outputs.docs_only }}" = "true" ]; then
            echo "build skipped, and this gate independently confirms the change is docs-only"
          else
            echo "::error::build is '${{ needs.build.result }}' and this gate's own" \
                 "classification is docs_only=${{ steps.recheck.outputs.docs_only }}." \
                 "A skipped build is only accepted on a docs-only change." >&2
            exit 1
          fi
