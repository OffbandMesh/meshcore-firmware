name: Release

# Builds the curated community board set (.github/release-envs.txt) and publishes
# a GitHub Release. Triggers on offband-v* (and legacy crosswire-v*) tags (stable + -rc pre-releases) and
# workflow_dispatch (build-only test run; no Release published on dispatch).
# Public binaries carry placeholder secrets, configured at runtime.
# Design of record: docs/architecture/2026-06-06-ci-release-pipeline.md (epic #14 / T3 / #17).

on:
  push:
    tags:
      - 'offband-v*'
      - 'crosswire-v*'   # legacy fork tags (pre-rebrand; kept for historical re-pushes)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a build-only test run (e.g. v0.0.0-dev). No Release is published on dispatch.'
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.read.outputs.envs }}
    steps:
      - uses: actions/checkout@v5
      - id: read
        name: Read curated env list
        run: |
          envs=$(grep -vE '^[[:space:]]*#' .github/release-envs.txt \
                 | grep -vE '^[[:space:]]*$' \
                 | jq -R . | jq -cs .)
          echo "envs=$envs" >> "$GITHUB_OUTPUT"
          echo "Selected $(echo "$envs" | jq 'length') env(s) for release."

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.list.outputs.envs) }}
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-build-environment

      - name: Resolve firmware version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ref="${GITHUB_REF_NAME#offband-}"; ref="${ref#crosswire-}"
            echo "version=${ref}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dummy secrets stub (public build; configured at runtime)
        run: |
          printf '[node_secrets]\nadmin_password = ci-dummy\n[wifi_secrets]\nssid = ci-dummy\npassword = ci-dummy\n[mqtt_secrets]\nhost = mqtt.example.com\nport = 1883\nuser = ci-dummy\npassword = ci-dummy\n[ota_secrets]\ntrigger_secret = ci-dummy\n[cmdrelay]\nurl = http://cmdrelay.example.com/cmd\n' > "$RUNNER_TEMP/ci-secrets.ini"
          echo "PIO_SECRETS_FILE=$RUNNER_TEMP/ci-secrets.ini" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.env }}
        env:
          FIRMWARE_VERSION: ${{ steps.ver.outputs.version }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.env }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.env }}
          path: out/*
          if-no-files-found: warn
          retention-days: 14

  release:
    needs: [list, build]
    # Publish only on tag pushes (not on dispatch test runs). always() so a partial
    # build failure still publishes the envs that succeeded (publish-partial-and-flag).
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Collect firmware files
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          echo "Collected $(find out -type f | wc -l) firmware file(s)."

      - name: Purge stale assets from a prior run of this tag (#706)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A failed run followed by a tag re-point leaves the release carrying
          # assets from the OLD commit alongside the new set (#706: v1.4.0
          # briefly shipped 168 stale d88ad9b binaries next to the real ones).
          # Make publishing idempotent: any asset on the existing release whose
          # filename is not in out/ is stale -- delete it. A clean first run has
          # no release yet and this is a no-op; a re-run with rebuilt artifacts
          # converges the release to exactly the current set.
          # Guard: an all-failed build collects NOTHING into out/. Pure
          # idempotency would then strip a previously-good release of every
          # working asset -- worse than stale. Publish-partial-and-flag wins:
          # keep the old set and let the run's red matrix tell the story.
          if [ -z "$(find out -type f -print -quit 2>/dev/null)" ]; then
            echo "out/ is empty (build produced nothing) -- refusing to purge a prior release."
            exit 0
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' > existing_assets.txt 2>/dev/null; then
            echo "No existing release for $GITHUB_REF_NAME -- nothing to purge."
            exit 0
          fi
          purged=0
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            if [ ! -f "out/$a" ]; then
              if gh release delete-asset "$GITHUB_REF_NAME" "$a" --repo "$GITHUB_REPOSITORY" --yes; then
                purged=$((purged+1))
              else
                echo "WARN: failed to delete stale asset: $a"
              fi
            fi
          done < existing_assets.txt
          echo "Purged $purged stale asset(s)."

      - name: Extract CHANGELOG section for release body
        run: |
          ver="${GITHUB_REF_NAME#offband-}"; ver="${ver#crosswire-}"   # e.g. v1.1.0-rc1
          num="${ver#v}"                         # e.g. 1.1.0-rc1
          num="${num%-rc*}"; num="${num%-beta*}" # rc/beta share the base version's CHANGELOG section: 1.2.0-beta1 -> 1.2.0
          awk -v v="$num" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/ { grab=0 }
            grab { print }
          ' CHANGELOG.md > body.md || true
          if [ ! -s body.md ]; then
            echo "(No CHANGELOG entry for ${ver}.)" > body.md
          fi
          # Append the static "which file do I download?" flashing guide to every release
          cat .github/release-footer.md >> body.md 2>/dev/null || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Offband ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') }}
          body_path: body.md
          generate_release_notes: true
          files: out/*
          fail_on_unmatched_files: false
