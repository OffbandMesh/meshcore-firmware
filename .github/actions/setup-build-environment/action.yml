name: Setup Build Environment
runs:
  using: "composite"
  steps:

    - name: Init Cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install PlatformIO
      shell: bash
      run: |
        pip install --upgrade platformio

    # Extract version from git tag. Supports both upstream's single-hyphen
    # format ("room-server-v1.2.3" -> "v1.2.3") AND multi-hyphen formats
    # with pre-release suffixes ("safeboot-simple-repeater-v1.2.3-rc1" ->
    # "v1.2.3-rc1"). The sed regex captures the v<digits>... suffix from
    # anywhere in the tag name.
    - name: Extract Version from Git Tag
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # Triggered by a tag push. NOTE: upstream uses "${GIT_TAG_NAME##*-}"
          # here, which takes the text after the LAST hyphen. That is wrong for
          # Offband tags, which carry pre-release suffixes and multi-hyphen
          # prefixes -- "offband-v1.3.0-rc1" would yield "rc1", and
          # "safeboot-simple-repeater-v1.2.3-rc1" likewise. The sed below
          # captures the v<digits>... suffix from anywhere in the tag instead,
          # giving "v1.3.0-rc1". build-safeboot-firmwares.yml depends on the
          # same regex -- keep the two in step.
          GIT_TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION_STRING=$(echo "$GIT_TAG_NAME" | sed -E 's/.*-(v[0-9].*)$/\1/')
        else
          # triggered by a workflow dispatch (e.g: refs/heads/main) -- upstream
          # addition, kept: the new firmware-builder.yml is dispatch-triggered.
          # strip "refs/heads/" prefix and replace any remaining "/" with "-" to protect file paths
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION_STRING=$(echo "$BRANCH_NAME" | tr '/' '-')
        fi
        echo "GIT_TAG_VERSION=${VERSION_STRING}" >> $GITHUB_ENV
