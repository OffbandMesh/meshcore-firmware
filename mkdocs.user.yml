site_name: Offband Firmware Manual
site_url: https://docs.offband.org/firmware/
site_description: Configure and troubleshoot Offband firmware features.
repo_name: OffbandMesh/meshcore-firmware
repo_url: https://github.com/OffbandMesh/meshcore-firmware/
edit_uri: edit/firmware-base/docs/user/
docs_dir: docs/user
site_dir: site-user
strict: true
exclude_docs: |
  features.yml
theme:
  name: material
  font: false
  palette:
    scheme: slate
    primary: green
    accent: green
  features:
    - content.action.edit
    - content.code.copy
    - navigation.indexes
    - search.highlight
    - search.suggest
plugins:
  - search
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
