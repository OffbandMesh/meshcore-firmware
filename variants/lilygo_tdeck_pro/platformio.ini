; LilyGo T-Deck Pro V1.1, e-paper (Feature #2005). Pins from LilyGo's V1.1
; schematic and examples/factory2/utilities.h, branch HD-V2-250915 (#2015).
; The panel, the SX1262 and the micro-SD share one SPI bus (SCK 36, MOSI 33,
; MISO 47); target.cpp puts the radio on the panel driver's SPIClass.
[LilyGo_TDeck_Pro_hw]
extends = esp32_base
board = t-deck   ; ESP32-S3, 16 MB flash, OPI PSRAM, default_16MB.csv: the factory layout
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_tdeck_pro
  -D LILYGO_TDECK_PRO
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_USER_BTN=0          ; BOOT
  -D PIN_BOARD_SDA=13
  -D PIN_BOARD_SCL=14
  ; SX1262 in an HPB16B3 module. TCXO and RF switch are inside the module;
  ; LilyGo's V1.1 firmware sets TCXO 2.4 V, DIO2 as the RF switch, 140 mA.
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D P_LORA_EN=46            ; the radio's regulator enable
  -D P_LORA_NSS=3
  -D P_LORA_RESET=4
  -D P_LORA_DIO_1=5
  -D P_LORA_BUSY=6
  -D P_LORA_SCLK=36
  -D P_LORA_MISO=47
  -D P_LORA_MOSI=33
  -D PIN_SD_CS=48
  -D PIN_GPS_EN=39
  -D PIN_MODEM_EN=41
  -D PIN_KEYBOARD_LED=42
  ; GDEQ031T10, 240x320 portrait. The UI draws on a 128x128 canvas, scaled
  ; to fill the panel.
  -D DISPLAY_CLASS=GxEPDDisplay
  -D EINK_DISPLAY_MODEL=GxEPD2_310_GDEQ031T10
  -D EINK_SCALE_X=1.875f
  -D EINK_SCALE_Y=2.5f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=10
  -D DISPLAY_ROTATION=0
  -D PIN_DISPLAY_SCLK=36
  -D PIN_DISPLAY_MISO=47
  -D PIN_DISPLAY_MOSI=33
  -D PIN_DISPLAY_CS=34
  -D PIN_DISPLAY_DC=35
  -D PIN_DISPLAY_BUSY=37
  -D PIN_DISPLAY_RST=16      ; V1.1 only; V1.0 leaves the panel's RST unwired
  -D PIN_DISPLAY_FRONTLIGHT=45
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/lilygo_tdeck_pro>
lib_deps =
  ${esp32_base.lib_deps}
  zinggjm/GxEPD2 @ 1.6.2
  bakercp/CRC32 @ ^2.0.0

; The fleet diag surface (bring-up directive 2026-08-22): every T-Deck Pro env
; is a _diag env until the board is beta.
[tdeck_pro_diag]
build_flags =
  ; Raw UART0 writes from the earliest static ctor: a boot that dies before
  ; USB comes up still leaves a trace on GPIO43 (the side connector, P6).
  -D OFFBAND_BOOT_BEACON
  ; The live log mirrored to UART0 as well as USB.
  -D OFFBAND_LOG_MIRROR_UART
  ; Caplog pinned on, so the log carries the debug lines from boot.
  -D OFFBAND_FORCE_CAPLOG
  ; The panel's init and every refresh timed in the log (GxEPDDisplay).
  -D OFFBAND_EINK_TIMING

[env:LilyGo_TDeck_Pro_companion_radio_ble_diag]
extends = LilyGo_TDeck_Pro_hw
build_flags =
  ${LilyGo_TDeck_Pro_hw.build_flags}
  ${tdeck_pro_diag.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TDeck_Pro_hw.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_ble.lib_deps}
  ${LilyGo_TDeck_Pro_hw.lib_deps}
  densaugeo/base64 @ ~1.4.0
