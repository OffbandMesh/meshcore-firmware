; ---------------------------------------------------------------------------
; Crosswire WiFi+MQTT Observer env (Plan 1, companion-only)
; ---------------------------------------------------------------------------
; See variants/heltec_v3/platformio.ini for the rationale block on why we
; extend _ble (BLE peripheral) rather than _wifi (WiFi-transport companion)
; and why monitor_rts/dtr=0.

[env:xiao_esp32s3_companion_observer_wifi]
extends = env:Xiao_S3_WIO_companion_radio_ble
monitor_rts = 0
monitor_dtr = 0
; Plan 3 Task 10 (Strycher/LoRa#272): bump MAX_GROUP_CHANNELS 40 -> 41
; via a second -D (parent _ble defines =40). PlatformIO reorders -U to
; the end, so an explicit undef would leave the macro unset. See V3
; platformio.ini for the full rationale.
;
; Plan 3 v2 (Strycher/LoRa#276 mitigation): enable 8MB OPI PSRAM on
; XIAO S3 as a malloc heap region. Without this, the entire Plan 3 web
; layer competes with BLE+WiFi for ~100KB of internal DRAM and loses
; (cert gen failed at ~5KB largest contig). With PSRAM enabled,
; EXT_RAM_BSS_ATTR statics + arduino-esp32's PSRAM-aware default
; allocator route large allocations to PSRAM, freeing internal DRAM
; for DMA-only paths (mbedtls esp-sha/esp-aes, WiFi/BLE driver bufs).
; Heltec V3/V4 don't have external PSRAM (ESP32-S3FN8 = flash-only)
; so this block is XIAO-specific.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags =
  ${env:Xiao_S3_WIO_companion_radio_ble.build_flags}
  -DMAX_GROUP_CHANNELS=41
  -Wno-builtin-macro-redefined
  -D CROSSWIRE_OBSERVER
  -D CROSSWIRE_OBSERVER_BLE_COMPANION
  -D WITH_MQTT_UPLINK
  -D BOARD_HAS_PSRAM
  ; Plan 3 v2 stack-overflow fix (Strycher/LoRa#279, #280): bump
  ; arduino loopTask stack from default 8192 to 16384. The default
  ; was insufficient for mbedtls EC P-256 cert gen + ASN.1/PEM
  ; encoding + NVS hash-list traversal layered on top of accumulated
  ; setup() stack usage. Overflow manifested as a family of crashes:
  ; LoadStoreError EXCVADDR=0x40000000 (in NVS find), "Unhandled
  ; debug exception" (mbedtls assert), and finally the explicit
  ; "***ERROR*** A stack overflow in task loopTask" once FreeRTOS
  ; canary detection triggered. All ONE root cause; this single
  ; flag fixes all three symptom classes. 16KB is generous; could
  ; tighten after stack_hw observations stabilize.
  -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
build_src_filter =
  ${env:Xiao_S3_WIO_companion_radio_ble.build_src_filter}
  +<helpers/wifi_observer/*.cpp>
