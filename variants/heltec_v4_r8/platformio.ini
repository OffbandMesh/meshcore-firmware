[Heltec_v4_r8]
extends = esp32_base
board = heltec_v4_r8
; #1342: native-USB ESP32-S3. Opening the port with default DTR/RTS handling
; resets the chip, so a monitor attach would capture a boot it caused itself.
; Board-wide, as on RC32: it is a property of this board's USB, not of a role.
; Governs `pio device monitor` only, not how a client drives DTR/RTS.
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v4_r8
  -D HELTEC_V4_R8
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D P_LORA_TX_LED=46
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=40
  -D PIN_VEXT_EN_ACTIVE=LOW
  -D ADC_MULTIPLIER=5.0715f
  -D PIN_VBAT_READ=1
  -D LORA_TX_POWER=10
  -D MAX_LORA_TX_POWER=22
  -D SX126X_REGISTER_PATCH=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_EN=42
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4_r8>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[heltec_v4_r8_oled]
extends = Heltec_v4_r8
build_flags =
  ${Heltec_v4_r8.build_flags}
  -D HELTEC_V4_R8_OLED
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_src_filter = ${Heltec_v4_r8.build_src_filter}
