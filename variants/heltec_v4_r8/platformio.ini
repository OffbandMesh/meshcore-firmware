; ----------------------------------------------------------------------------
; R8 WiFi+MQTT observer (#1343). Same shape as heltec_v4_companion_observer_wifi:
; extends the BLE companion, adds the observer pipeline and caplog forward
; (#1061, standard on every observer), and drops the companion capacity to the
; observer minima (#701) so the static .bss goes to the heap the WiFi/TLS stack
; needs. That trade caps the companion half at 5 contacts and 4 user channels;
; see the heltec_v4 observer block for the full rationale.
;
; NimBLE is declared explicitly, as on the heltec_v4 BLE companion this mirrors;
; the R8 BLE env pulls the NimBLE library (#645) but not these defines.
; ----------------------------------------------------------------------------
[env:heltec_v4_r8_companion_observer_wifi]
extends = env:heltec_v4_r8_companion_radio_ble
build_flags =
  ${env:heltec_v4_r8_companion_radio_ble.build_flags}
  ; #1487: the full companion channel list plus _sys, and 50 contacts, owner-set
  ; for a measured trial on the R8 (8 MB PSRAM). Replaces the heltec_v4 observer
  ; minima (5 channels, 5 contacts), which were carried over unmeasured.
  -DMAX_GROUP_CHANNELS=41
  -Wno-builtin-macro-redefined
  -D OFFBAND_OBSERVER
  -D OFFBAND_OBSERVER_BLE_COMPANION
  -D OFFBAND_CAPLOG_FORWARD=1
  -D WITH_MQTT_UPLINK
  -D MAX_CONTACTS=50
  -D MAX_ANON_CONTACTS=3
  -D OFFBAND_MAX_BROKERS=6
  -D OFFLINE_QUEUE_SIZE=16
  -D CONFIG_BT_NIMBLE_ENABLED=1
  -D CONFIG_BT_BLUEDROID_ENABLED=0
build_src_filter =
  ${env:heltec_v4_r8_companion_radio_ble.build_src_filter}
  +<helpers/wifi_observer/*.cpp>
  +<helpers/config/*.cpp>
  +<helpers/diagnostics/*.cpp>

[env:heltec_v4_r8_companion_observer_wifi_diag]
extends = env:heltec_v4_r8_companion_observer_wifi
build_flags =
  ${env:heltec_v4_r8_companion_observer_wifi.build_flags}
  ${heltec_v4_r8_diag.build_flags}

