  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=44
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=47
  -D PIN_TFT_DC=48
  -D PIN_TFT_SCL=16
  -D PIN_TFT_SDA=15
  -D PIN_TFT_MISO=45
  -D PIN_BUZZER=4
  -D PIN_TOUCH_RST=21
