; ----------------------------------------------------------------------------
; R8 diagnostic builds (#1342). Diag-builds directive: every bring-up env is a
; full diag build, and each released role ships a `_diag` twin.
;
; [heltec_v4_r8_diag] carries the family's standing diag surface -- the same set
; as RC32's [rc32_diag] and RC52's [rc52_diag]:
;   - boot beacon: raw UART0 writes from the earliest static ctor;
;   - UART0 log mirror: the live log on GPIO43 (U0TXD, header J2 pin 6 on the
;     V4 pin map), readable with a UART sniffer without opening USB, so reading
;     it does not reset the board;
;   - caplog forced on, without which the mirror carries almost nothing.
; Serial on this board is USB-CDC (ARDUINO_USB_CDC_ON_BOOT=1 in
; boards/heltec_v4_r8.json), so UART0 is free and the USB companion's framed
; protocol line never shares a wire with the mirror.
;
; OFFBAND_POWER_TELEMETRY is set per env, not in the block: it is implemented
; only in examples/companion_radio/main.cpp and would compile to nothing on the
; repeater and room server.
;
; ORDERING, as on RC32: the UART0 writer is a bounded synchronous busy-wait
; (~87 us per byte at 115200) and must not carry a debug-level firehose. The BLE
; companion's BLE_DEBUG_LOGGING=1 goes to Serial.printf today and misses the
; mirror; routing BLE lines through mesh_log_line (#1070) needs the per-sink
; level ceiling (#1069) first.
; ----------------------------------------------------------------------------
[heltec_v4_r8_diag]
build_flags =
  -D OFFBAND_BOOT_BEACON
  -D OFFBAND_LOG_MIRROR_UART
  -D OFFBAND_FORCE_CAPLOG

[env:heltec_v4_r8_companion_radio_ble_diag]
extends = env:heltec_v4_r8_companion_radio_ble
build_flags =
  ${env:heltec_v4_r8_companion_radio_ble.build_flags}
  ${heltec_v4_r8_diag.build_flags}
  -D OFFBAND_POWER_TELEMETRY

[env:heltec_v4_r8_companion_radio_usb_diag]
extends = env:heltec_v4_r8_companion_radio_usb
build_flags =
  ${env:heltec_v4_r8_companion_radio_usb.build_flags}
