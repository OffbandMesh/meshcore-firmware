[Xiao_nrf52]
extends = nrf52_base
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/xiao_nrf52
  -UENV_INCLUDE_GPS
  -D NRF52_PLATFORM
  -D NRF52_POWER_MANAGEMENT
  -D XIAO_NRF52
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=11
  -D P_LORA_DIO_1=D1
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D P_LORA_NSS=D4
  -D SX126X_RXEN=D5
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_WIRE_SCL=D6
  -D PIN_WIRE_SDA=D7
  -D PIN_USER_BTN=PIN_BUTTON1
  -D DISPLAY_CLASS=NullDisplayDriver
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  ; Xiao NRF52840 uses PIN_VBAT (not PIN_VBAT_READ) and requires
  ; VBAT_ENABLE driven LOW to enable the on-board battery divider
  ; before reading. ADC_MULTIPLIER=3.0F + AREF_VOLTAGE=3.0 in variant.h
  ; are simple-ratio compatible, so they cascade through F13's adapter
  ; layer without needing explicit override.
  -D SAFEBOOT_PIN_VBAT_READ=PIN_VBAT         ; alias to variant.h's PIN_VBAT (=32)
  -D SAFEBOOT_VBAT_ENABLE_PIN=VBAT_ENABLE    ; toggle GPIO 14 around the ADC read
  -D SAFEBOOT_VBAT_ENABLE_ACTIVE=LOW         ; per variant.h: "Output LOW to enable reading of the BAT voltage"
  ; LPCOMP wake for solar auto-recovery (F15 / Strycher/LoRa#148).
  ; AIN7 = P0.31 = PIN_VBAT. Matches existing variant.h PWRMGT_LPCOMP_AIN=7.
  ; Threshold 3/8 VDD is SafeBoot's default; matches variant.h PWRMGT_LPCOMP_REFSEL=2.
  -D BATTERY_LPCOMP_INPUT=NRF_LPCOMP_INPUT_7
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/xiao_nrf52>
  +<helpers/ui/NullDisplayDriver.cpp>
debug_tool = jlink
upload_protocol = nrfutil
lib_deps = ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_nrf52_companion_radio_ble]
extends = Xiao_nrf52
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D QSPIFLASH=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf52_companion_radio_usb]
extends = Xiao_nrf52
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags =
  ${Xiao_nrf52.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D QSPIFLASH=1
  -D ENABLE_USB_INTERFACE
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Xiao_nrf52_repeater]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_repeater/*.cpp>

[env:Xiao_nrf52_room_server]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
  -D ADVERT_NAME='"Xiao_nrf52 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/simple_room_server/*.cpp>

[env:Xiao_nrf52_kiss_modem]
extends = Xiao_nrf52
build_flags =
  ${Xiao_nrf52.build_flags}
build_src_filter = ${Xiao_nrf52.build_src_filter}
  +<../examples/kiss_modem/*.cpp>
lib_deps =
  ${Xiao_nrf52.lib_deps}
