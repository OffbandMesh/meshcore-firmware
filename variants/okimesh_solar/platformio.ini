; OKIMesh Solar / Queen City Con node (#1626): ProMicro nRF52840 + Ai-Thinker Ra-01SH
; (SX1262), GPS header, CN3163 solar charging. No OLED, keyboard or buzzer. Radio wiring is
; variants/promicro's; the GPS and battery wiring is the QCC badge's, traced from the layout.
[OKIMesh_Solar]
extends = nrf52_base
board = promicro_nrf52840
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I variants/okimesh_solar
  -D OKIMESH_SOLAR
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5          ; PIN_OKI_GPS_POWER, P0.24 -> Q1 (HIGH = GPS powered)
  -D PIN_STATUS_LED=22     ; P0.15, the module's LED (heartbeat)
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  ; --- one low-voltage policy: SafeBoot runs first, then the running cutoff ---
  -D SAFEBOOT_PIN_VBAT_READ=17         ; P0.31; SafeBoot can't see PromicroBoard.h
  -D SAFEBOOT_ADC_MULTIPLIER=1.68f     ; divider RATIO; must equal qcc::kDividerRatio
  -D SAFEBOOT_ADC_SAMPLE_US=40         ; ~405k source impedance
  ; #1688: a refused node powers off and wakes when the charging cell crosses a line. P0.31
  ; is AIN7, and the divider already drives it. The line is a fraction of VDD on the divided
  ; cell: 1.68 * 11/16 * 3.3 V = 3811 mV, about 3784 mV at the VDD measured on a badge. It
  ; sits above WAKE_MV so a wake proceeds, and above every voltage SafeBoot refuses at.
  -D BATTERY_LPCOMP_INPUT=NRF_LPCOMP_INPUT_7
  -D BATTERY_LPCOMP_THRESHOLD=NRF_LPCOMP_REF_SUPPLY_11_16
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600
  ; Owner, 2026-11-02: one line, 3100 mV, for the running cutoff and the refuse-to-boot line.
  ; Kit owners fit their own cells, often without protection, so this is what stands between
  ; a long cloudy stretch and a cell run flat. There is no display here, so the handoff in
  ; src/helpers/LowBattHandoff.h acts on it in both roles: a board that holds under the line
  ; restarts into SafeBoot's sleep and comes back when the sun brings the cell up.
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3100
  -D AUTO_SHUTDOWN_MILLIVOLTS=3100
  -D OFFBAND_LOW_BATT_HANDOFF=1
  -D BATT_MIN_MILLIVOLTS=3100
  -D BATT_MAX_MILLIVOLTS=4150
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<../variants/okimesh_solar>
  +<../variants/promicro/PromicroBoard.cpp>
lib_deps = ${nrf52_base.lib_deps}
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6

[env:OKIMesh_Solar_repeater]
extends = OKIMesh_Solar
build_flags = ${OKIMesh_Solar.build_flags}
  -D ADVERT_NAME='"OKIMesh Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${OKIMesh_Solar.build_src_filter}
  +<../examples/simple_repeater>
lib_deps = ${OKIMesh_Solar.lib_deps}
  adafruit/RTClib @ ^2.1.3

[env:OKIMesh_Solar_companion_radio_ble]
extends = OKIMesh_Solar
build_flags = ${OKIMesh_Solar.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${OKIMesh_Solar.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps = ${OKIMesh_Solar.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0

; Diagnostic twins, until beta (owner directive). The log mirror transmits on the GPIO38 pad
; (P1.06), the same pad the badge's rig uses. Logs also go over the ProMicro's USB.
[okimesh_solar_diag]
build_flags =
  -D OFFBAND_FORCE_CAPLOG
  -D OFFBAND_BOOT_BEACON
  -D OFFBAND_LOG_MIRROR_UART=1
  -D OFFBAND_LOG_MIRROR_TX_PIN=PIN_OKI_SPARE_GPIO38
  -D OFFBAND_LOG_MIRROR_BAUD=115200
  ; The VDD reading that sets the real LPCOMP wake line. 3.3 V is its nominal value.
  -D SAFEBOOT_LOG_VDD

[env:OKIMesh_Solar_repeater_diag]
extends = env:OKIMesh_Solar_repeater
build_flags =
  ${env:OKIMesh_Solar_repeater.build_flags}
  ${okimesh_solar_diag.build_flags}

[env:OKIMesh_Solar_companion_radio_ble_diag]
extends = env:OKIMesh_Solar_companion_radio_ble
build_flags =
  ${env:OKIMesh_Solar_companion_radio_ble.build_flags}
  ${okimesh_solar_diag.build_flags}
