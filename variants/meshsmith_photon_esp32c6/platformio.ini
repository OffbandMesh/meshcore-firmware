[meshsmith_photon_esp32c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = min_spiffs.csv ; get around 4mb flash limit
build_flags =
  ${esp32c6_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/meshsmith_photon_esp32c6
  -UENV_INCLUDE_VL53L0X
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D P_LORA_TX_LED=15
  -D DISPLAY_CLASS=NullDisplayDriver
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=0
  -D P_LORA_RESET=1
  -D P_LORA_BUSY=2
  -D P_LORA_NSS=21
  -D P_LORA_SCLK=19
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=18
  -D SX126X_RXEN=RADIOLIB_NC
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SDA=22
  -D PIN_BOARD_SCL=23
  -D PIN_GPS_TX=17
  -D PIN_GPS_RX=16
  -D GPS_SERIAL=Serial1
  -D GPS_BAUD_RATE=9600
  -D GPS_SERIAL_SUSPEND_WHEN_STOPPED=1
  -D MESHSMITH_PHOTON_ATGM336H_GPS=1
  -D ENV_SKIP_I2C_SENSOR_SCAN=1
  -D PHOTON_HAS_BATT_CHARGE_RATE=1
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<../variants/meshsmith_photon_esp32c6>
lib_deps =
  ${esp32c6_base.lib_deps}
  ${sensor_base.lib_deps}


[meshsmith_photon_esp32c6_e22p_30dbm]
extends = meshsmith_photon_esp32c6
; limit txpower to 20dBm on E22-900M30S. Anything higher will
; cause distortion in the PA output. 20dBm in -> 30dBm out
build_flags =
  ${meshsmith_photon_esp32c6.build_flags}
  -D MANUFACTURER_STRING='"Meshsmith Photon ESP32-C6-E22P-30dBm (XIAO ESP32-C6)"'
  -D LORA_TX_POWER=20
build_src_filter = ${meshsmith_photon_esp32c6.build_src_filter}


;;; abstracted firmware roles

[meshsmith_photon_esp32c6_companion_radio_ble]
extends = meshsmith_photon_esp32c6
build_flags =
  ${meshsmith_photon_esp32c6.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -I examples/companion_radio/ui-new
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshsmith_photon_esp32c6.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshsmith_photon_esp32c6.lib_deps}
  densaugeo/base64 @ ~1.4.0
  h2zero/NimBLE-Arduino @ ^2.0.0   ; #193: BLE env needs NimBLE (matches our heltec/xiao_s3_wio companion_radio_ble envs)

[meshsmith_photon_esp32c6_companion_radio_usb]
extends = meshsmith_photon_esp32c6
build_flags =
  ${meshsmith_photon_esp32c6.build_flags}
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -I examples/companion_radio/ui-new
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshsmith_photon_esp32c6.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${meshsmith_photon_esp32c6.lib_deps}
  densaugeo/base64 @ ~1.4.0

[meshsmith_photon_esp32c6_repeater]
extends = meshsmith_photon_esp32c6
build_flags =
  ${meshsmith_photon_esp32c6.build_flags}
  -D ADVERT_NAME='"Meshsmith Photon Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESHSMITH_PHOTON_GPS_TIME=0
;  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
build_src_filter = ${meshsmith_photon_esp32c6.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
lib_deps =
  ${meshsmith_photon_esp32c6.lib_deps}

[meshsmith_photon_esp32c6_room_server]
extends = meshsmith_photon_esp32c6
build_flags =
  ${meshsmith_photon_esp32c6.build_flags}
  -D ADVERT_NAME='"Meshsmith Photon Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${meshsmith_photon_esp32c6.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
lib_deps =
  ${meshsmith_photon_esp32c6.lib_deps}


;Meshsmith
[env:meshsmith_photon_esp32c6_e22p_30dbm_companion_radio_ble]
extends =
   meshsmith_photon_esp32c6_e22p_30dbm
   meshsmith_photon_esp32c6_companion_radio_ble
build_flags =
   ${meshsmith_photon_esp32c6_companion_radio_ble.build_flags}
   ${meshsmith_photon_esp32c6_e22p_30dbm.build_flags}
build_src_filter =
   ${meshsmith_photon_esp32c6_companion_radio_ble.build_src_filter}
   ${meshsmith_photon_esp32c6_e22p_30dbm.build_src_filter}

