[Heltec_lora32_v3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v3
  -D HELTEC_LORA_V3
  -D ESP32_CPU_FREQ=80
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=RADIOLIB_NC
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D P_LORA_TX_LED=35
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=47
  -D PIN_GPS_TX=48
  -D PIN_GPS_EN=26
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  ; PIN_VBAT_READ + ADC_MULTIPLIER inherited from variants/heltec_v3/HeltecV3Board.h (5.42, same as V4).
  ; PIN_ADC_CTRL polarity differs between V3 revisions <=3.2 and >3.2; opt into
  ; SafeBoot's auto-detect so one firmware works on both. See F14 / Strycher/LoRa#147
  ; and HeltecV3Board.h:35-36 for the original auto-detect logic this mirrors.
  -D SAFEBOOT_AUTODETECT_PIN_ADC_CTRL=1
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this (hysteresis high)
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this (hysteresis low, ~AMS1117 dropout)
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v3>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Heltec_v3_repeater]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

