; ---------------------------------------------------------------------------
; Offband WiFi+MQTT Observer env (Plan 1, companion-only)
; ---------------------------------------------------------------------------
; Extends Heltec_v3_companion_radio_ble (BLE peripheral companion variant)
; and layers the wifi_observer subsystem on top. WiFi is owned by our
; WifiBootstrap state machine (NOT by main.cpp's WIFI_SSID path -- we
; deliberately do NOT inherit _wifi which would set WIFI_SSID and race
; against WifiBootstrap for WiFi ownership). Result: BLE peripheral
; advertising AND WiFi observer publishing simultaneously, per spec.
;
; monitor_rts/monitor_dtr = 0 prevents `pio device monitor` from
; toggling DTR/RTS on port open. On CP2102-bridged V3 SKUs, DTR/RTS
; are physically wired to BOOT/RESET of the ESP32 -- without this,
; every monitor open cycles the chip. No-op on native-USB ESP32-S3
; boards. Does NOT affect esptool upload (upload uses its own DTR/RTS
; sequencing).
;
; Plans 2-4 add configurable brokers, web UI, OLED, OTA.
; Repeater-variant observer envs land in a future plan.

[env:Heltec_v3_companion_observer_wifi]
extends = env:Heltec_v3_companion_radio_ble
monitor_rts = 0
monitor_dtr = 0
; MAX_GROUP_CHANNELS reserves the LAST slot for the locked system CLI
; channel. Phase-1 strip (Strycher/Crosswire#42): 41 -> 11 (user slots
; 0-9 + system slot 10; was 0-39 + slot 40 pre-strip), plus the inherited
; companion defaults are overridden down to observer minima to free
; static .bss: MAX_CONTACTS 350->50, OFFLINE_QUEUE_SIZE 256->16.
; The MAX_GROUP_CHANNELS redefinition lands via a second -D rather than
; -U-then-redefine -- PlatformIO reorders -U to the end of the flag list
; which would re-undefine after both -Ds applied, leaving the macro
; completely undefined. -Wno-builtin-macro-redefined silences the gcc warning.
build_flags =
  ${env:Heltec_v3_companion_radio_ble.build_flags}
  -DMAX_GROUP_CHANNELS=11
  -Wno-builtin-macro-redefined
  -D OFFBAND_OBSERVER
  -D OFFBAND_OBSERVER_BLE_COMPANION
  -D WITH_MQTT_UPLINK
  -D MAX_CONTACTS=50
  -D OFFLINE_QUEUE_SIZE=16
build_src_filter =
  ${env:Heltec_v3_companion_radio_ble.build_src_filter}
  +<helpers/wifi_observer/*.cpp>
