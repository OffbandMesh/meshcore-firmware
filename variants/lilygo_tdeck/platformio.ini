; The board itself: radio, pins, GPS, SafeBoot. [LilyGo_TDeck] below adds the
; old status-screen display; the companion GUI env (Epic J #1434) builds on this
; section directly, so the two display classes never meet on one command line.
[LilyGo_TDeck_hw]
extends = esp32_base
board = t-deck
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/lilygo_tdeck
  -D LILYGO_TDECK
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_USER_BTN=0  ; Trackball button
  -D PIN_PERF_POWERON=10 ; Peripheral power pin
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8f
  -D P_LORA_DIO_1=45 ; LORA IRQ pin
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=0
  -D ENV_INCLUDE_BME280=0
  -D ENV_INCLUDE_BMP280=0
  -D ENV_INCLUDE_SHTC3=0
  -D ENV_INCLUDE_SHT4X=0
  -D ENV_INCLUDE_LPS22HB=0
  -D ENV_INCLUDE_INA3221=0
  -D ENV_INCLUDE_INA219=0
  -D ENV_INCLUDE_INA226=0
  -D ENV_INCLUDE_INA260=0
  -D ENV_INCLUDE_MLX90614=0
  -D ENV_INCLUDE_VL53L0X=0
  -D ENV_INCLUDE_BME680=0
  -D ENV_INCLUDE_BMP085=0
  -D P_LORA_NSS=9    ; LORA SS pin
  -D P_LORA_RESET=17 ; LORA RST pin
  -D P_LORA_BUSY=13  ; LORA Busy pin
  -D P_LORA_SCLK=40  ; LORA SCLK pin
  -D P_LORA_MISO=38  ; LORA MISO pin
  -D P_LORA_MOSI=41  ; LORA MOSI pin
  -D PIN_TFT_RST=-1
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=42
  -D PIN_TFT_CS=12
  -D PIN_TFT_DC=11
  -D PIN_TFT_SCL=40
  -D PIN_TFT_SDA=41
  -D PIN_GPS_RX=43
  -D PIN_GPS_TX=44
  -D GPS_BAUD_RATE=38400
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  ; Variant ADC_MULTIPLIER is composite (2.0f * 3.3f * 1000); SafeBoot needs simple ratio
  -D SAFEBOOT_ADC_MULTIPLIER=2.0             ; derived simple divider ratio (was composite 6600 with AREF=3.3)
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_tdeck>
  +<helpers/sensors/*.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[LilyGo_TDeck]
extends = LilyGo_TDeck_hw
build_flags =
  ${LilyGo_TDeck_hw.build_flags}
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
build_src_filter = ${LilyGo_TDeck_hw.build_src_filter}
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${LilyGo_TDeck_hw.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:LilyGo_TDeck_companion_radio_usb]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  ${esp32_no_ble.build_src_filter}
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_companion_radio_ble]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_ble.lib_deps}
  ${LilyGo_TDeck.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:LilyGo_TDeck_repeater]
extends = LilyGo_TDeck
build_flags =
  ${LilyGo_TDeck.build_flags}
  -D ADVERT_NAME='"TDeck Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/simple_repeater>
  +<helpers/ui/ST7789LCDDisplay.cpp>
lib_deps =
  ${LilyGo_TDeck.lib_deps}
  ${esp32_ota.lib_deps}

[env:LilyGo_TDeck_kiss_modem]
extends = LilyGo_TDeck
build_src_filter = ${LilyGo_TDeck.build_src_filter}
  +<../examples/kiss_modem/>

; Companion GUI on the T-Deck (Epic J #1434). Pins from LilyGo's schematic
; (#1724). The display (CS 12), micro-SD (CS 39) and SX1262 (CS 9) are three
; devices on SPI2 under ESP-IDF's bus lock (owner, 2026-10-21, option A): the
; GUI's panel driver and the card use ESP-IDF, and the radio reaches the bus
; through EspSharedSpiHal (target.cpp), never Arduino's SPIClass. Panel and
; touch reset only at power-on (RC networks, no GPIO). The panel is landscape,
; so a fresh radio starts at rotation 90 (class B).
[env:LilyGo_TDeck_companion_radio_ble_gui]
extends = LilyGo_TDeck_hw
build_flags =
  ${LilyGo_TDeck_hw.build_flags}
  -D PIN_TFT_MISO=38
  -D PIN_SD_CS=39
  -D GUI_DEFAULT_ROTATION=90
  ; The board I2C bus (18/8): RTC, keyboard and GT911 touch all on it.
  -D PIN_BOARD_SDA=18
  -D PIN_BOARD_SCL=8
  ; GT911 touch (J3 #1726): polled on the board bus; reset is RC-only.
  ; It reports 320x240 against the 240x320 portrait panel, so the axes swap
  ; (Meshtastic's T-Deck config gives the same range). Any mirror is a bench
  ; finding on a tester's unit (#1730).
  -D TOUCH_GT911=1
  -D PIN_TOUCH_SDA=18
  -D PIN_TOUCH_SCL=8
  -D PIN_TOUCH_RST=-1
  -D GUI_TOUCH_SWAP_XY=1
  ; Keyboard (J4 #1727): an ESP32-C3 at 0x55 on the board bus, polled.
  ; Trackball: four pulsing direction lines (schematic G01-G04); its press is
  ; USR (GPIO0). How many pulses make a step is a bench finding (#1730).
  -D TDECK_KEYBOARD=1
  -D PIN_TRACKBALL_UP=3
  -D PIN_TRACKBALL_DOWN=15
  -D PIN_TRACKBALL_LEFT=1
  -D PIN_TRACKBALL_RIGHT=2
  -I examples/companion_radio/ui-gui
  -I src/helpers/gui
  -D LV_CONF_INCLUDE_SIMPLE
  -D DISPLAY_CLASS=GuiPanel
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN shown on the GUI
  -D OFFLINE_QUEUE_SIZE=256
  -D OFFBAND_GUI=1
build_src_filter = ${LilyGo_TDeck_hw.build_src_filter}
  +<helpers/gui/*.cpp>
  +<helpers/gui/hw/*.cpp>
  +<helpers/gui/fonts/*.c>
  +<helpers/gui/*.c>          ; generated images (the logo, G6)
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-gui/*.cpp>
lib_deps =
  ${esp32_ble.lib_deps}
  ${LilyGo_TDeck_hw.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lvgl/lvgl @ 8.3.11

; Diag twin: what a tester flashes for the bench (J7).
[env:LilyGo_TDeck_companion_radio_ble_gui_diag]
extends = env:LilyGo_TDeck_companion_radio_ble_gui
build_flags =
  ${env:LilyGo_TDeck_companion_radio_ble_gui.build_flags}
  -D OFFBAND_BOOT_BEACON
  -D OFFBAND_LOG_MIRROR_UART
  -D CAPLOG_ON_BOOT
  -D OFFBAND_MEM_TELEMETRY
  -D OFFBAND_GUI_PERF
