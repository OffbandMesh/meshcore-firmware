[t1000-e]
extends = nrf52_base
board = tracker-t1000-e
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags = ${nrf52_base.build_flags}
  -I src/helpers/nrf52
  -I lib/nrf52/s140_nrf52_7.3.0_API/include
  -I lib/nrf52/s140_nrf52_7.3.0_API/include/nrf52
  -I variants/t1000-e
  -I src/helpers/ui
  -D T1000_E
  -D PIN_USER_BTN=6
  -D USER_BTN_PRESSED=HIGH
  -D PIN_STATUS_LED=24
  -D RADIO_CLASS=CustomLR1110
  -D USE_LR1110
  -D WRAPPER_CLASS=CustomLR1110Wrapper
  -D LORA_TX_POWER=22
  -D RF_SWITCH_TABLE
  -D RX_BOOSTED_GAIN=true
  -D P_LORA_BUSY=7 ; P0.7
  -D P_LORA_SCLK=11 ; P0.11
  -D P_LORA_NSS=12 ; P0.12
  -D P_LORA_DIO_1=33 ; P1.1
  -D P_LORA_MISO=40 ; P1.8
  -D P_LORA_MOSI=41 ; P1.9
  -D P_LORA_RESET=42 ; P1.10
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.6
  -D ENV_INCLUDE_GPS=1
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  ; T1000-E uses BATTERY_PIN (not PIN_VBAT_READ). ADC_MULTIPLIER=2.0F and
  ; AREF_VOLTAGE=3.0 in variant.h are simple-ratio compatible, so they
  ; cascade through F13's adapter layer without explicit override.
  ; NOTE: SafeBoot runs before board.begin(); if board init sets
  ; analogReference to a non-default value, F6e bench validation may
  ; surface an absolute-Vbat error that needs VBAT_AR_INTERNAL added here.
  -D SAFEBOOT_PIN_VBAT_READ=BATTERY_PIN      ; alias to variant.h's BATTERY_PIN (=2)
  ; #1966: the battery divider is powered from PIN_3V3_EN (P1.6), as T1000eBoard's own read
  ; does it. Unpowered, SafeBoot read 1-7 mV and powered off a charged board.
  -D SAFEBOOT_VBAT_ENABLE_PIN=PIN_3V3_EN
  -D SAFEBOOT_VBAT_ENABLE_ACTIVE=HIGH
  -D SAFEBOOT_VBAT_ENABLE_SETTLE_MS=10       ; the board's read waits 10 ms
  ; LPCOMP wake (F15 / Strycher/LoRa#148): DEFERRED for t1000-e pending
  ; schematic research or bench measurement to identify the AIN channel
  ; wired to BATTERY_PIN's voltage divider. Without BATTERY_LPCOMP_INPUT,
  ; SafeBoot falls back to SYSTEM_OFF + button-wake-only (PIN_USER_BTN).
  ; Solar auto-recovery is therefore unavailable on t1000-e until this
  ; is filled in. F6e bench validation should surface the AIN mapping;
  ; once known, add: -D BATTERY_LPCOMP_INPUT=NRF_LPCOMP_INPUT_X
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/nrf52/T1000eBoard.cpp>
  +<../variants/t1000-e>
debug_tool = jlink
upload_protocol = nrfutil

[env:t1000e_repeater]
extends = t1000-e
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D ADVERT_NAME='"t1000-e Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/simple_repeater>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:t1000e_room_server]
extends = t1000-e
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D ADVERT_NAME='"t1000-e Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D RF_SWITCH_TABLE
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/simple_room_server>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6

[env:t1000e_companion_radio_usb]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
  -D OFFBAND_UI_ORIG_TUNE_ENGINE  ; #1957: client-chosen tunes; defaults sound the same
  -D OFFBAND_SENT_TONE_ON_CLIENT_SEND  ; #1958: a client send confirms with a tone
  -D DEFAULT_TONE_SENT=offband::kTuneTick  ; the badge's send tone; the client can change it
  -D OFFBAND_GPS_POWER_SAVE=1     ; #1959: T1000SensorManager has the accessors now
  -D OFFBAND_HEARTBEAT_MSG_ON_MS=490  ; #1960: a longer blip while a message waits; clear of a boundary
  -D BUTTON_IRQ_CAPTURE    ; #527 - interrupt edge capture for multi-press detection
  -D ENABLE_USB_INTERFACE  ; upstream e7f2c717: USB companion envs REQUIRE this or they build with no USB interface
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:t1000e_companion_radio_ble]
extends = t1000-e
board_build.ldscript = boards/nrf52840_s140_v7_extrafs.ld
board_upload.maximum_size = 708608
build_flags = ${t1000-e.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D BLE_TX_POWER=0
;  -D BLE_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=NullDisplayDriver
  -D PIN_BUZZER=25
  -D PIN_BUZZER_EN=37      ; P1/5 - required for T1000-E
  -D OFFBAND_UI_ORIG_TUNE_ENGINE  ; #1957: client-chosen tunes; defaults sound the same
  -D OFFBAND_SENT_TONE_ON_CLIENT_SEND  ; #1958: a client send confirms with a tone
  -D DEFAULT_TONE_SENT=offband::kTuneTick  ; the badge's send tone; the client can change it
  -D OFFBAND_GPS_POWER_SAVE=1     ; #1959: T1000SensorManager has the accessors now
  -D OFFBAND_HEARTBEAT_MSG_ON_MS=490  ; #1960: a longer blip while a message waits; clear of a boundary
  -D BUTTON_IRQ_CAPTURE    ; #527 - interrupt edge capture for multi-press detection
  -D ADVERT_NAME='"@@MAC"'
build_src_filter = ${t1000-e.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/NullDisplayDriver.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${t1000-e.lib_deps}
  densaugeo/base64 @ ~1.4.0
  stevemarple/MicroNMEA @ ^2.0.6
  end2endzone/NonBlockingRTTTL@^1.3.0

; #1966: diagnostic twin. The stall watch reports where the main loop is stuck, before the
; 30 s watchdog resets the board, as [stall] lines on USB. Not a shipping image.
[env:t1000e_companion_radio_ble_diag]
extends = env:t1000e_companion_radio_ble
build_flags = ${env:t1000e_companion_radio_ble.build_flags}
  -D OFFBAND_STALL_WATCH
  ; SafeBoot runs before a host can open USB. This waits up to 5 s for one, then logs
  ; the reset reason, so a capture shows why a boot was refused.
  -D SAFEBOOT_WAIT_FOR_USB_MS=5000

; #1966: proves the stall watch on this board. The loop spins forever at 60 s uptime, so
; [stall] lines must appear at 75, 80 and 85 s and the watchdog resets at about 90 s.
; Bench only: it reboots every 90 s.
[env:t1000e_companion_radio_ble_hangtest]
extends = env:t1000e_companion_radio_ble_diag
build_flags = ${env:t1000e_companion_radio_ble_diag.build_flags}
  -D WDT_TEST_HANG_AFTER_MS=60000

[env:t1000e_kiss_modem]
extends = t1000-e
build_src_filter = ${t1000-e.build_src_filter}
  +<../examples/kiss_modem/>
lib_deps = ${t1000-e.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
