; Heltec RadioCore RCC6 -- ESP32-C6 + RA62A-HF (SX1262), 16 MB flash.
;
; PIN PROVENANCE: read from the schematic's own printed net-to-GPIO table
; (docs/radiocore/vendor/RCC6/RCC6-L62_V1.0-schematic.pdf, beside symbol U5), not
; from spatial row-pairing. Cross-checked against n30nex/NeonPocketMC-RCC6 (MIT),
; which matches on all seven LoRa pins. See #806, and #804 for why the earlier
; "no reference variant exists" note in the bring-up handoff was wrong.
;
; FLASH SIZE: unlike this repo's other C6 variants (xiao_c6, lilygo_tlora_c6,
; m5stack_unit_c6l -- all 4 MB parts on min_spiffs.csv), the RCC6 carries a
; W25Q128JVPIQ, 16 MB. Stock esp32-c6-devkitm-1 is kept as the board and the size
; is overridden explicitly, following the pattern xiao_c6 already uses for its
; 8 MB envs, rather than adding a board JSON.

[heltec_rcc6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.flash_mode = dio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
  ${esp32c6_base.build_flags}
  -I variants/heltec_rcc6
  -D HELTEC_RCC6=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
; --- LoRa (RA62A-HF / SX1262) -------------------------------------------------
  -D P_LORA_SCLK=21
  -D P_LORA_MISO=20
  -D P_LORA_MOSI=22
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=19
  -D P_LORA_BUSY=10
  -D P_LORA_RESET=8
  -D SX126X_RXEN=RADIOLIB_NC
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
; --- Button -------------------------------------------------------------------
; GPIO9 is also the C6 download-mode strapping pin. That is by design (hold USER,
; tap RST = download mode) but it means USER is a strap: see HeltecRCC6Board.h.
  -D PIN_USER_BTN=9
; --- Battery (enable-gated divider) -------------------------------------------
; ADC_Ctrl=GPIO5 gates the divider feeding ADC_IN=GPIO6. Polarity is from THIS
; board's schematic -- never inherit it from a sibling variant (#602).
  -D PIN_ADC_CTRL=5
  -D ADC_CTRL_ENABLED=HIGH
  -D PIN_VBAT_READ=6
  -D ADC_MULTIPLIER=4.95f
; --- Vext_3V3 rail ------------------------------------------------------------
; U3 (TLV75733PDBVR), EN driven by GPIO11 through a 100K pulldown -> defaults OFF.
; What it supplies is not yet confirmed (#805). Asserted at begin() as the safe
; direction; revisit when #805 resolves.
  -D PIN_VEXT_EN=11
  -D PIN_VEXT_EN_ACTIVE=HIGH
; --- I2C: none ----------------------------------------------------------------
; No I2C devices on this board. Left disabled deliberately -- a blind C6 bus scan
; hangs at 0x0d and never returns (#294), so setup() would never reach loop().
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D ENV_SKIP_I2C_SENSOR_SCAN=1
  -D DISABLE_WIFI_OTA=1
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/heltec_rcc6>
lib_deps =
  ${esp32c6_base.lib_deps}

; -----------------------------------------------------------------------------
; Display variant. T108 / NV3001B on software SPI. TFT pins occupy GPIO
; 0,1,2,3,4,15,18 -- every one of which is also exposed on the P1 carrier header,
; so anything wired to P1 pins 6-10 contends with the panel.
; -----------------------------------------------------------------------------
[heltec_rcc6_with_display]
extends = heltec_rcc6
build_flags =
  ${heltec_rcc6.build_flags}
  -D HELTEC_RCC6_WITH_DISPLAY=1
  ; ---------------------------------------------------------------------------
  ; SAME PANEL AS THE RC32. T108 / NV3001B on the same RadioCore frame -- only the
  ; MCU differs. Everything here is INHERITED from variants/heltec_rc32, which is
  ; where this display was actually characterised on hardware. Only two things
  ; legitimately differ, and both are justified in place below: the carrier GPIOs
  ; and the SPI host. Do not re-derive the rest -- if a display setting needs to
  ; change, it almost certainly needs to change on BOTH boards, and the fact that
  ; these are two copies is itself the defect (see the note at the end).
  ; ---------------------------------------------------------------------------
  -D DISPLAY_CLASS=NV3001BDisplay
  ; Vendor-mandated: Heltec drive this panel with bit-banged SPI on the RCC6 and
  ; explicitly disable both hardware paths (RadioCore_Library src/boards/heltec_rcc6.h:
  ; USE_ESP32_SPI 0, USE_HARDWARE_SPI 0, USE_SOFTWARE_SPI 1). The panel MOSI is
  ; GPIO15, the one header pin with no FSPI function, and no TFT pin maps to
  ; FSPID -- hardware SPI has no valid mapping here. rc32 is unaffected: this
  ; define defaults to 0 and that board keeps hardware SPI on HSPI.
  -D NV3001B_USE_SOFTWARE_SPI=1
  ; Inherited from RC32: bus speed characterised on this panel.
  ; Inherited from RC32: 8 MHz, running on this same panel on hardware today.
  ; The RCC6 TFT Guide's table says 4 MHz, but that value carries NO source --
  ; it is simply what radiocore-c6-tft-test.ino passes to SPI.begin(). The
  ; guide's wiring section cites Meshtastic PR #11041; its SPI-clock cell cites
  ; nothing. Hardware evidence outranks an unsourced table, so this stays at
  ; RC32's proven value until something on THIS board says otherwise.
  -D SPI_FREQUENCY=8000000
  ; Inherited from RC32 (#749): pulls in the RGB565 splash asset. WITHOUT this,
  ; DisplayDriver::drawRGB565 is a no-op -- so the panel can be perfectly wired,
  ; perfectly clocked, and still show nothing.
  -D OFFBAND_COLOUR_SPLASH
  ; SPI HOST: left at NV3001BDisplay.h's HSPI default, DELIBERATELY, exactly as
  ; heltec_rc32 does. Do not "fix" this without hardware evidence.
  ;
  ; A previous attempt here set FSPI, reasoning that HSPI=2 was out of range on
  ; C6 because soc_caps.h gives SOC_SPI_PERIPH_NUM=2. That was WRONG on both
  ; counts: esp32-hal-spi.c puts the C6 in the generic #else branch where
  ; SPI_COUNT=4, so spiStartBus() accepts index 2; and index 2 maps to
  ; DR_REG_SPI2_BASE -- GPSPI2, the general-purpose host -- whereas FSPI=1 maps
  ; to DR_REG_SPI1_BASE, the FLASH controller. The "fix" aimed the panel at the
  ; flash bus.
  ;
  ; The RC32 comment is the standing guidance and applies here too: "Keep TFT off
  ; the LoRa host; Arduino_GFX reconfigures the selected SPI bus."
  -D PIN_TFT_SCL=4
  -D PIN_TFT_SDA=15
  -D PIN_TFT_CS=18
  -D PIN_TFT_DC=3
  -D PIN_TFT_RST=0
  -D PIN_TFT_EN=2
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=1
  -D PIN_TFT_BL_ACTIVE=HIGH
  ; DISPLAY_ROTATION=0 -- LANDSCAPE, inherited from RC32 where the owner
  ; confirmed it on hardware (#704). The UI is laid out landscape; the 128x220
  ; glass being portrait is the GLASS, not the required orientation.
  ;
  ; The RCC6 TFT Guide asks for MADCTL 0x00 (which would be rotation 2 in
  ; NV3001BDisplay's enum, NOT 0 -- the enums differ between libraries). That is
  ; the ORIENTATION OF THE TEST SKETCH, not a product decision, and switching
  ; this board to portrait is the owner's call, not a variant's. Do not change
  ; it without asking.
  -D DISPLAY_ROTATION=0
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
lib_deps =
  ${heltec_rcc6.lib_deps}

; -----------------------------------------------------------------------------
; Roles. Repeater first -- simplest role, no display, smallest surface, which is
; what bring-up needs before anything else is trusted.
; -----------------------------------------------------------------------------
[env:heltec_rcc6_repeater]
extends = heltec_rcc6
build_src_filter = ${heltec_rcc6.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${heltec_rcc6.build_flags}
  -D ADVERT_NAME='"RCC6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8

; Same role WITH the T108 panel driven. Kept as a separate env rather than
; enabling the display on the base one: bring-up wants the smallest surface that
; can prove boot + radio, and the display adds seven GPIOs -- two of them C6
; strapping pins (GPIO4, GPIO15) -- to the set that can affect booting.
[env:heltec_rcc6_repeater_display]
extends = heltec_rcc6_with_display
build_src_filter = ${heltec_rcc6_with_display.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${heltec_rcc6_with_display.build_flags}
  -D ADVERT_NAME='"RCC6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8

; -----------------------------------------------------------------------------
; DIAG env -- display build with the log mirrored onto raw UART0 (#763).
;
; WHY. This build sets ARDUINO_USB_CDC_ON_BOOT=1, so `Serial` IS the USB CDC.
; Every application log line -- including anything about display init -- goes to
; USB and nowhere else. When USB is the thing that has died (rcc6-bench-1 sits in
; "Device Descriptor Request Failed" after the display image boots), the log dies
; with it and the external sniffer on U0TXD sees nothing but ROM output.
;
; OFFBAND_MESHLOG_UART0 writes MeshLog lines straight into the UART0 TX FIFO --
; no driver, no FreeRTOS, no USB stack -- so the board stays observable exactly
; when the normal channel is gone. That is the whole point of #763.
;
; OFFBAND_BOOT_BEACON is included but is the UNVERIFIED part on this board: the
; raw writer is guarded `!defined(ESP32) -> #error` and the C6 satisfies ESP32,
; and it reads UART_TXFIFO_CNT_S from the target's own soc/uart_reg.h -- but it
; has never run on RISC-V. The FIFO spin is bounded precisely so an unclocked or
; differently-mapped UART degrades to silent writes instead of wedging the board
; it is supposed to be observing (SAFELANE 11.8). Worst case here is no beacon
; output, not a hang. If APP:CTOR appears after a reset, the bootloader and IDF
; startup both completed and the fault is in our ctors/setup().
;
; NOT for shipping. Diagnostic only.
; -----------------------------------------------------------------------------
[env:heltec_rcc6_repeater_display_diag]
extends = heltec_rcc6_with_display
build_src_filter = ${heltec_rcc6_with_display.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${heltec_rcc6_with_display.build_flags}
  -D ADVERT_NAME='"RCC6 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=8
  ${rcc6_diag.build_flags}
  ; NOTE: OFFBAND_BOOT_BEACON is deliberately NOT set here. It compiles, but
  ; simple_repeater never defines OFFBAND_BEACON_DEFINE_CTOR nor includes
  ; BootBeacon.h, so there are no call sites and it would emit nothing -- a flag
  ; that looks like instrumentation while doing nothing is worse than no flag.
  ; Only examples/companion_radio wires the beacon up (main.cpp), which is why
  ; heltec_rc32's diag env gets APP:CTOR and this one would not.

; -----------------------------------------------------------------------------
; USB-serial companion. Modelled on env:heltec_rc32_companion_radio_usb -- same
; role, same example, same lib set; only the board base differs.
;
; Note for #818: examples/companion_radio/main.cpp defines
; OFFBAND_BEACON_DEFINE_CTOR, so this example DOES emit the raw-UART0 boot beacon
; (APP:CTOR from constructor(101), ahead of every other static ctor).
; simple_repeater does not, which is why the repeater builds cannot see that far
; back into the boot. Pair this with the _diag flags to watch a boot on the
; external sniffer when USB is absent.
; -----------------------------------------------------------------------------
[env:heltec_rcc6_companion_radio_usb]
extends = heltec_rcc6_with_display
build_flags =
  ${heltec_rcc6_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
build_src_filter = ${heltec_rcc6_with_display.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  ; ESPNOWRadio does not compile on C6: the esp_now recv callback signature
  ; differs and esp_efuse_mac_get_default is not declared in this core. Every
  ; other C6 variant in the tree excludes it the same way (xiao_c6,
  ; lilygo_tlora_c6, m5stack_unit_c6l) -- the greedy esp32 wildcard drags it in.
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  ${esp32_no_ble.build_src_filter}
lib_deps =
  ${heltec_rcc6_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; =============================================================================
; DIAG FLAG SET -- shared by every *_diag env below.
;
; This is "the part that makes the sniffer work". Defined ONCE here rather than
; per-env, so a diag build cannot drift from its prod sibling by more than these
; two flags.
;
; OFFBAND_MESHLOG_UART0 -- writes MeshLog lines straight into the UART0 TX FIFO:
;   no driver, no FreeRTOS, no USB stack. These builds set ARDUINO_USB_CDC_ON_BOOT=1,
;   so `Serial` IS the USB CDC and every log line goes to USB and nowhere else.
;   When USB is the thing that died -- and on this board it does, see #818 -- the
;   log dies with it and an external sniffer on U0TXD sees only ROM output. This
;   keeps the board observable exactly when the normal channel is gone (#763).
;
; OFFBAND_FORCE_CAPLOG -- pins runtime logging ON in loadPrefs(), before anything
;   else runs (#631). Without it the boot path is mute on exactly the boot being
;   investigated: every MESH_DEBUG_PRINTLN is gated on g_meshLogEnabled, which
;   stays false until prefs load. `caplog stop` cannot undo it in this build.
;
; NOT included: OFFBAND_BOOT_BEACON. It compiles, but simple_repeater never
; defines OFFBAND_BEACON_DEFINE_CTOR nor includes BootBeacon.h, so it has no call
; sites there and would emit nothing -- instrumentation that looks live while
; doing nothing is worse than none. It IS wired in examples/companion_radio, so
; the companion diag envs below could carry it; left off until it is verified on
; RISC-V (see the C6 traps section in docs/radiocore/rcc6-bringup-handoff.md).
; =============================================================================
[rcc6_diag]
build_flags =
  -D OFFBAND_MESHLOG_UART0
  -D OFFBAND_FORCE_CAPLOG

; -----------------------------------------------------------------------------
; COMPANION -- BLE. Also the base the observer extends, which is why it exists
; even though USB companion came first during bring-up.
;
; C6 BLE is well-trodden: xiao_c6, m5stack_unit_c6l, lilygo_tlora_c6 and the
; Photon C6 all ship a BLE companion. Follows m5stack_unit_c6l's shape --
; ${esp32_ble.lib_deps}, and NO ${esp32_no_ble.build_src_filter}.
; -----------------------------------------------------------------------------
[env:heltec_rcc6_companion_radio_ble]
extends = heltec_rcc6_with_display
build_flags =
  ${heltec_rcc6_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${heltec_rcc6_with_display.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  ; ESPNOWRadio does not compile on C6 -- see the note on the USB companion.
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${esp32_ble.lib_deps}
  ${heltec_rcc6_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; -----------------------------------------------------------------------------
; OBSERVER -- FIRST ESP32-C6 OBSERVER IN THIS TREE.
;
; Every other observer env (heltec_v3, heltec_v4, heltec_v4_tft, xiao_s3_wio)
; is ESP32 or ESP32-S3. No C6 board has carried this role before, so treat a
; green build as necessary-not-sufficient: MQTT uplink and the observer's heap
; headroom want hardware confirmation on this part before it goes to testers.
;
; The observer path itself carries no architecture guards -- it extends the BLE
; companion and adds helpers/wifi_observer + helpers/config + helpers/diagnostics
; -- so there is no known blocker, just no precedent.
;
; Contact/channel counts are the deliberately-trimmed observer set (#701), not
; the companion's 350/40: the observer holds broker state and an offline queue.
; -----------------------------------------------------------------------------
[env:heltec_rcc6_companion_observer_wifi]
extends = env:heltec_rcc6_companion_radio_ble
monitor_rts = 0
monitor_dtr = 0
build_flags =
  ${env:heltec_rcc6_companion_radio_ble.build_flags}
  -Wno-builtin-macro-redefined
  -D OFFBAND_OBSERVER
  -D OFFBAND_OBSERVER_BLE_COMPANION
  -D WITH_MQTT_UPLINK
  -D MAX_CONTACTS=5
  -D MAX_ANON_CONTACTS=3
  -D MAX_GROUP_CHANNELS=5
  -D OFFBAND_MAX_BROKERS=6
  -D OFFLINE_QUEUE_SIZE=16
build_src_filter =
  ${env:heltec_rcc6_companion_radio_ble.build_src_filter}
  +<helpers/wifi_observer/*.cpp>
  +<helpers/config/*.cpp>
  +<helpers/diagnostics/*.cpp>

; =============================================================================
; DIAG TWINS. Each is its prod sibling + ${rcc6_diag.build_flags}, nothing else.
;
; These are for beta testers on this board specifically: when an RCC6 stops
; talking over USB, the tester still has a UART0 story to send back. That is a
; deliberate departure from .github/release-envs.txt's standing line that diag
; envs are "diagnostic instruments, not products" -- owner-directed for the RCC6
; beta. Revisit when the board is no longer beta.
; =============================================================================
[env:heltec_rcc6_companion_radio_usb_diag]
extends = env:heltec_rcc6_companion_radio_usb
build_flags =
  ${env:heltec_rcc6_companion_radio_usb.build_flags}
  ${rcc6_diag.build_flags}

[env:heltec_rcc6_companion_radio_ble_diag]
extends = env:heltec_rcc6_companion_radio_ble
build_flags =
  ${env:heltec_rcc6_companion_radio_ble.build_flags}
  ${rcc6_diag.build_flags}

[env:heltec_rcc6_companion_observer_wifi_diag]
extends = env:heltec_rcc6_companion_observer_wifi
build_flags =
  ${env:heltec_rcc6_companion_observer_wifi.build_flags}
  ${rcc6_diag.build_flags}
