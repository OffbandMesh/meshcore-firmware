; #1440 (Epic A #1425, Feature #1313): the on-device GUI companion. A GUI env
; and the existing TFT companion env are separate images by design.
; GPIO35 is the TFT kit's second button (AUX; USR is GPIO0), so the GUI envs
; drop the TX LED every other V4 env drives on that pin (D3 #1325 finding 1).
; The kit's piezo buzzer is on GPIO6 (owner's board, #1445).
; It shares the BLE companion's settings but not its UI: ui-gui replaces
; ui-new, and GuiPanel (LVGL over SPI DMA) replaces ST7789LCDDisplay (#1441).
[env:heltec_v4_tft_companion_radio_ble_gui]
extends = heltec_v4_tft
build_flags =
  ${heltec_v4_tft.build_flags}
  -I examples/companion_radio/ui-gui
  -I src/helpers/gui
  -D LV_CONF_INCLUDE_SIMPLE
  -D DISPLAY_CLASS=GuiPanel
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN shown on the GUI
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -UP_LORA_TX_LED
  -D PIN_USER_BTN_2=35
  -D PIN_BUZZER=6
  -D OFFBAND_GUI=1
  ; CHSC6x touch on the second I2C bus, no interrupt line (D3 #1325)
  -D PIN_TOUCH_SDA=47
  -D PIN_TOUCH_SCL=48
  -D PIN_TOUCH_RST=44
build_src_filter = ${heltec_v4_tft.build_src_filter}
  +<helpers/gui/*.cpp>
  +<helpers/gui/hw/*.cpp>
  +<helpers/gui/fonts/*.c>
  +<helpers/gui/*.c>          ; generated images (the logo, G6)
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-gui/*.cpp>
lib_deps =
  ${esp32_ble.lib_deps}
  ${heltec_v4_tft.lib_deps}
  densaugeo/base64 @ ~1.4.0
  lvgl/lvgl @ 8.3.11
  end2endzone/NonBlockingRTTTL@^1.3.0

