[Heltec_lora32_v4]
extends = esp32_base
board = heltec_v4
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v4
  -D HELTEC_LORA_V4
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7  ; // VFEM_Ctrl -LDO power enable
  -D P_LORA_GC1109_PA_EN=2    ; // CSD - GC1109 chip enable (HIGH=on)
  -D P_LORA_GC1109_PA_TX_EN=46 ;// CPS - GC1109 PA mode (HIGH=full PA, LOW=bypass)
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D LORA_TX_POWER=10 ;If it is configured as 10 here, the final output will be 22 dbm.
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX
  -D SX126X_DIO2_AS_RF_SWITCH=true ; GC1109 CTX is controlled by SX1262 DIO2
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1      ; In some cases, commenting this out will improve RX
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=1
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  -D ADC_MULTIPLIER=5.42                     ; Vbat/Vadc divider ratio; matches HeltecV4Board::getBattMilliVolts cal factor
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this (hysteresis high)
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this (hysteresis low, ~AMS1117 dropout)
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[heltec_v4_oled]
extends = Heltec_lora32_v4
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_OLED
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_src_filter= ${Heltec_lora32_v4.build_src_filter}
lib_deps = ${Heltec_lora32_v4.lib_deps}

[heltec_v4_tft]
extends = Heltec_lora32_v4
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_TFT
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
build_src_filter= ${Heltec_lora32_v4.build_src_filter}
lib_deps = 
  ${Heltec_lora32_v4.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:heltec_v4_repeater]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"WSMJ898 Liberty Twp Base"'
  -D ADVERT_LAT=39.4231166
  -D ADVERT_LON=-84.4495595
  -D ADMIN_PASSWORD='"${node_secrets.admin_password}"'
  -D MAX_NEIGHBOURS=50
  ; US 910.525 MeshCore community standard preset (USA/Canada Recommended)
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
  ; D9 / issue #63: boot-rollback safety tunables. Validation window = uptime
  ; after which the current boot is committed (NVS counter reset + bootloader
  ; PENDING_VERIFY confirmed). 60s covers WiFi connect, MQTT auth, and first
  ; mesh activity cycle. Override here per env if needed.
  -D ROLLBACK_VALIDATION_MS=60000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; ----------------------------------------------------------------------------
; heltec_v4_repeater_telemetry - Repeater env with WiFi+MQTT telemetry module.
; Extends heltec_v4_repeater. Adds duty-cycled WiFi publish of battery,
; uptime, queue, noise, and neighbor stats to an MQTT broker. Home Assistant
; Discovery format for auto-entity creation.
; Secrets (WiFi creds, MQTT broker host/user/pass) come from platformio.local.ini.
; Target: ~5 mA average added current at 15-minute publish interval.
; Tracks: Strycher/LoRa#42. Built on STOCK meshcore-dev/MeshCore main (NOT iotthinks).
; ----------------------------------------------------------------------------
[env:heltec_v4_repeater_telemetry]
extends = env:heltec_v4_repeater
build_flags =
  ${env:heltec_v4_repeater.build_flags}
  -D ENABLE_WIFI_TELEMETRY=1
  -D WIFI_TELEMETRY_NODE_ID='"wsmj898-ltb"'
  -D WIFI_TELEMETRY_FRIENDLY_NAME='"WSMJ898 Liberty Twp Base"'
  -D WIFI_TELEMETRY_MQTT_PREFIX='"meshcore"'
  -D WIFI_TELEMETRY_WIFI_SSID='"${wifi_secrets.ssid}"'
  -D WIFI_TELEMETRY_WIFI_PASS='"${wifi_secrets.password}"'
  -D WIFI_TELEMETRY_MQTT_HOST='"${mqtt_secrets.host}"'
  -D WIFI_TELEMETRY_MQTT_PORT=${mqtt_secrets.port}
  -D WIFI_TELEMETRY_MQTT_USER='"${mqtt_secrets.user}"'
  -D WIFI_TELEMETRY_MQTT_PASS='"${mqtt_secrets.password}"'
build_src_filter = ${env:heltec_v4_repeater.build_src_filter}
  +<helpers/wifi_telemetry/*.cpp>
lib_deps =
  ${env:heltec_v4_repeater.lib_deps}
  knolleary/PubSubClient @ ^2.8

; ----------------------------------------------------------------------------
; heltec_v4_repeater_telemetry_stp - lab test variant for ST-P.
; Inherits everything from heltec_v4_repeater_telemetry and overrides ONLY the
; identity fields so ST-P does not collide with the live patio Repeater on the
; mesh or in Home Assistant MQTT topics.
;
; Identity overrides:
;   - ADVERT_NAME              -> "ST-P Lab"      (mesh advertisement)
;   - ADVERT_LAT/LON           -> 0.0, 0.0        (no location announced)
;   - WIFI_TELEMETRY_NODE_ID   -> "stp-lab"       (MQTT topic root)
;   - WIFI_TELEMETRY_FRIENDLY_NAME -> "ST-P Lab"  (Home Assistant display)
;   - LORA_FREQ                -> 916.5          (isolated from 910.525 patio)
;
; Identity NOT overridden (intentionally same as patio):
;   - ADMIN_PASSWORD: shares the production admin password from
;     platformio.local.ini. Lab device only exists on USB; blast radius
;     of password sharing is minimal. Documented decision 2026-05-14.
;   - LORA_BW=62.5, LORA_SF=7: same modulation as patio, only the carrier
;     frequency changes.
;   - All sensor / wifi / mqtt broker settings.
;
; Tracks: Strycher/LoRa#61 (D7, lab integration test for OTA epic #53).
; Mechanical flash safety: governed by Epic A (#44, scripts/pio-flash wrapper).
; ----------------------------------------------------------------------------
[env:heltec_v4_repeater_telemetry_stp]
extends = env:heltec_v4_repeater_telemetry
build_flags =
  ${env:heltec_v4_repeater_telemetry.build_flags}
  ; Identity overrides (gcc takes last -D for duplicate macros; no warning
  ; for non-builtin macros so no -U dance needed).
  -D ADVERT_NAME='"ST-P Lab"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D LORA_FREQ=916.5
  -D WIFI_TELEMETRY_NODE_ID='"stp-lab"'
  -D WIFI_TELEMETRY_FRIENDLY_NAME='"ST-P Lab"'
build_src_filter = ${env:heltec_v4_repeater_telemetry.build_src_filter}
lib_deps = ${env:heltec_v4_repeater_telemetry.lib_deps}

