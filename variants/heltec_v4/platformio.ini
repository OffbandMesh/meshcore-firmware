[Heltec_lora32_v4]
extends = esp32_base
board = heltec_v4
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_v4
  -D HELTEC_LORA_V4
  -D USE_SX1262
  -D ESP32_CPU_FREQ=80
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_TX_LED=35
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=8
  -D P_LORA_RESET=12
  -D P_LORA_BUSY=13
  -D P_LORA_SCLK=9
  -D P_LORA_MISO=11
  -D P_LORA_MOSI=10
  -D P_LORA_PA_POWER=7  ; // VFEM_Ctrl -LDO power enable
  -D P_LORA_GC1109_PA_EN=2    ; // CSD - GC1109 chip enable (HIGH=on)
  -D P_LORA_GC1109_PA_TX_EN=46 ;// CPS - GC1109 PA mode (HIGH=full PA, LOW=bypass)
  -D P_LORA_KCT8103L_PA_CSD=2
  -D P_LORA_KCT8103L_PA_CTX=5
  -D PIN_USER_BTN=0
  -D PIN_VEXT_EN=36
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D LORA_TX_POWER=10 ;If it is configured as 10 here, the final output will be 22 dbm.
  -D MAX_LORA_TX_POWER=22 ; Max SX1262 output
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX
  -D SX126X_DIO2_AS_RF_SWITCH=true ; GC1109 CTX is controlled by SX1262 DIO2
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1      ; In some cases, commenting this out will improve RX
  -D PIN_GPS_RX=38
  -D PIN_GPS_TX=39
  -D PIN_GPS_RESET=42
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D PIN_GPS_EN=34
  -D PIN_GPS_EN_ACTIVE=LOW
  -D ENV_INCLUDE_GPS=1
  ; #149: GPS baud is auto-detected at boot -- EnvironmentSensorManager::initBasicGPS
  ; probes 115200 then 9600 and validates by NMEA checksum, so one image reads either
  ; the M100 Mini @115200 or a standard L76K @9600 with no rebuild. No GPS_BAUD_RATE
  ; hardcode needed here; a board only defines it to make a non-standard rate the
  ; first probe try.
  -D PIN_ADC_CTRL=37
  -D PIN_VBAT_READ=1
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  -D ADC_MULTIPLIER=5.42                     ; Vbat/Vadc divider ratio; matches HeltecV4Board::getBattMilliVolts cal factor
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this (hysteresis high)
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this (hysteresis low, ~AMS1117 dropout)
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_v4>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[heltec_v4_oled]
extends = Heltec_lora32_v4
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_OLED
  -D PIN_BOARD_SDA=17
  -D PIN_BOARD_SCL=18
  -D PIN_OLED_RESET=21
build_src_filter= ${Heltec_lora32_v4.build_src_filter}
lib_deps = ${Heltec_lora32_v4.lib_deps}

[heltec_v4_tft]
extends = Heltec_lora32_v4
build_flags =
  ${Heltec_lora32_v4.build_flags}
  -D HELTEC_LORA_V4_TFT
  -D PIN_BOARD_SDA=4
  -D PIN_BOARD_SCL=3
  -D DISPLAY_SCALE_X=2.5
  -D DISPLAY_SCALE_Y=3.75
  -D PIN_TFT_RST=18
  -D PIN_TFT_VDD_CTL=-1
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_LEDA_CTL_ACTIVE=HIGH
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
build_src_filter= ${Heltec_lora32_v4.build_src_filter}
lib_deps = 
  ${Heltec_lora32_v4.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0

[env:heltec_v4_repeater]
extends = heltec_v4_oled
build_flags =
  ${heltec_v4_oled.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  ; #1378: this env is released, so it carries the stock generic identity.
  -D ADVERT_NAME='"Heltec Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  ; Radio preset comes from the root default (#1481): the US 910.525 MeshCore
  ; community standard, 910.525 / 62.5 / SF 7 / CR 5. This env used to re-state
  ; it; the override was dropped because a redundant copy does not follow a later
  ; change to the root preset and would silently pin these envs to the old value.
  ; D9 / issue #63: boot-rollback safety tunables. Validation window = uptime
  ; after which the current boot is committed (NVS counter reset + bootloader
  ; PENDING_VERIFY confirmed). 60s covers WiFi connect, MQTT auth, and first
  ; mesh activity cycle. Override here per env if needed.
  -D ROLLBACK_VALIDATION_MS=60000
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${heltec_v4_oled.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${heltec_v4_oled.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

; ----------------------------------------------------------------------------
; heltec_v4_repeater_telemetry - Repeater env with WiFi+MQTT telemetry module.
; Extends heltec_v4_repeater. Adds duty-cycled WiFi publish of battery,
; uptime, queue, noise, and neighbor stats to an MQTT broker. Home Assistant
; Discovery format for auto-entity creation.
; Secrets (WiFi creds, MQTT broker host/user/pass) come from platformio.local.ini.
; Target: ~5 mA average added current at 15-minute publish interval.
; Tracks: Strycher/LoRa#42. Built on STOCK meshcore-dev/MeshCore main (NOT iotthinks).
; ----------------------------------------------------------------------------
[env:heltec_v4_repeater_telemetry]
extends = env:heltec_v4_repeater
build_flags =
  ${env:heltec_v4_repeater.build_flags}
  ; #1410: generic identity. A device's own name, location and node id go in
  ; its env in the per-host C:\Dev\.offband\platformio.local.ini, never here.
  -D ADMIN_PASSWORD='"${node_secrets.admin_password}"'
  -D ENABLE_WIFI_TELEMETRY=1
  -D WIFI_TELEMETRY_NODE_ID='"heltec-v4-repeater"'
  -D WIFI_TELEMETRY_FRIENDLY_NAME='"Heltec Repeater"'
  -D WIFI_TELEMETRY_MQTT_PREFIX='"meshcore"'
  -D WIFI_TELEMETRY_WIFI_SSID='"${wifi_secrets.ssid}"'
  -D WIFI_TELEMETRY_WIFI_PASS='"${wifi_secrets.password}"'
  -D WIFI_TELEMETRY_MQTT_HOST='"${mqtt_secrets.host}"'
  -D WIFI_TELEMETRY_MQTT_PORT=${mqtt_secrets.port}
  -D WIFI_TELEMETRY_MQTT_USER='"${mqtt_secrets.user}"'
  -D WIFI_TELEMETRY_MQTT_PASS='"${mqtt_secrets.password}"'
  ; #561: caplog live syslog forward target -- same Pi as MQTT/cmdrelay (rsyslog
  ; on UDP 514). Host from secrets, never a hardcoded LAN IP. Since #566 this
  ; only seeds the syslog.host pref; it does not compile anything in.
  -D WIFI_SYSLOG_HOST='"${mqtt_secrets.host}"'
  ; #1060: compiles caplog forward in: the `caplog forward` command, its
  ; `caplog status` fields and the sender. Needs ENABLE_WIFI_TELEMETRY above.
  -D OFFBAND_CAPLOG_FORWARD=1
  ; Per issue #86: shared secret for remote-OTA-trigger via MQTT command
  ; topic. Must be defined; user sets [ota_secrets] trigger_secret in
  ; platformio.local.ini. Build will fail if the section is missing.
  ; Defense-in-depth - layered on top of MQTT broker auth and topic ACL.
  -D OTA_TRIGGER_SECRET='"${ota_secrets.trigger_secret}"'
  ; Per issue #188 / H3: URL of the HTTP cmdrelay server. Used when
  ; CMD_TRANSPORT_HTTP=1 is set. Originally opt-in (H3 #195) and
  ; promoted to default by H6 (#198) once H4 (#196) bench validation
  ; completed. User sets [cmdrelay] url in platformio.local.ini. Format:
  ; http://<host>:<port> (no trailing slash). The device appends
  ; "/devices/<node_id>/cmds" and "/devices/<node_id>/responses" paths.
  -D CMDRELAY_URL='"${cmdrelay.url}"'
  ; H6 (LoRa#198): CMD_TRANSPORT_HTTP=1 is now the default for telemetry
  ; envs. Devices in this env (and inheriting envs, e.g. the _stp variant)
  ; use the HTTP cmd-relay path instead of the MQTT cmd channel. The MQTT
  ; cmd channel code path is still compiled for compatibility during the
  ; H6->H7 transition; H7 (#199) will remove the legacy path once soak
  ; confirms no fallback needed.
  ;
  ; To temporarily revert a specific env to MQTT cmd transport (e.g. for
  ; A/B comparison or rollback testing), comment out this line in that
  ; env's build_flags block, or undefine via -U CMD_TRANSPORT_HTTP in the
  ; child env.
  -D CMD_TRANSPORT_HTTP=1
  ; #536: opt the repeater into the shared multi-broker pool + #175 scheduler
  ; engine (engine ONLY -- not the observer pipeline). Telemetry routing through
  ; it is #537; this env compiles + links the engine to prove reuse.
  -D OFFBAND_MQTT_POOL=1
  ; #536: the pool's JWT auth (MqttAuth) needs JwtHelper, gated by WITH_MQTT_UPLINK.
  -D WITH_MQTT_UPLINK=1
  ; #539: raise the concurrent-live-wss cap off the HV3 default of 1 to the
  ; repeater's measured safe ceiling (#308: ~4 held wss on HV4/S3, ~30 KB each;
  ; the 80 KB OFFBAND_TLS_HEAP_FLOOR_BYTES backstop independently caps ~4-5). The
  ; #175 engine rotates any enabled wss beyond this through the budget; tcp
  ; brokers are exempt (always-on). Value to be confirmed/tuned by the HW verify.
  -D OFFBAND_MAX_LIVE_TLS=4
  ; #1902: the CoreScope /neighbors report, published through the pool above.
  -D OFFBAND_NEIGHBORS_REPORT=1
build_src_filter = ${env:heltec_v4_repeater.build_src_filter}
  +<helpers/wifi_telemetry/*.cpp>
  ; #536: merged broker-pool engine files only. The observer PIPELINE
  ; (WifiObserver/ObserverCli/ObserverPipeline) stays excluded.
  +<helpers/wifi_observer/MqttBrokerPool.cpp>
  +<helpers/wifi_observer/MqttBroker.cpp>
  +<helpers/wifi_observer/MqttAuth.cpp>
  +<helpers/wifi_observer/MqttPayload.cpp>
  +<helpers/wifi_observer/ConfigSchema.cpp>
  +<helpers/wifi_observer/JwtHelper.cpp>
  ; #538 (Option A): broker-config CLI. dispatchObserverCli's wifi/display/web
  ; verbs are guarded behind OFFBAND_OBSERVER, so the repeater gets broker verbs
  ; only and does NOT pull WifiConfigProvider/DisplayConfigProvider (which need
  ; the observer's wifiBootstrap). ConfigDispatch.cpp backs the typed broker
  ; config providers' static registration.
  +<helpers/wifi_observer/ObserverCli.cpp>
  +<helpers/config/ConfigDispatch.cpp>
  ; #1906: the CoreScope /neighbors report body, which the pool's publishNeighbors builds.
  +<helpers/wifi_observer/NeighborsReport.cpp>
  ; #1907: mqtt.neighbors[.interval] and the nbr: status line.
  +<helpers/wifi_observer/NeighborsCli.cpp>
lib_deps =
  ${env:heltec_v4_repeater.lib_deps}
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.0

