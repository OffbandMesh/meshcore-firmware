; Queen City Con 0x4 badge (#1172): ProMicro nRF52840 + Ai-Thinker Ra-01SH (SX1262),
; 128x64 OLED, CardKB-compatible keyboard, buzzer, LED line, optional GPS.
; Radio wiring is variants/promicro's; this variant reuses PromicroBoard by subclass.
; Design: docs/architecture/2026-09-12-qcc-0x4-badge-design.md
[QCC_Badge]
extends = nrf52_base
board = promicro_nrf52840
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags = ${nrf52_base.build_flags}
  -I variants/qcc_badge
  -D QCC_BADGE
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_BOARD_SCL=7
  -D PIN_BOARD_SDA=8
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=6
  -D PIN_GPS_RX=3
  -D PIN_GPS_TX=4
  -D PIN_GPS_EN=5          ; PIN_QCC_GPS_POWER, P0.24 -> Q1 (HIGH = GPS powered)
  ; #1366: the heartbeat lives on the MODULE's LED (P0.15), not the badge's. It was on
  ; P0.08, which meant the one user-visible notification LED was consumed by a liveness
  ; blink while the module's own LED did nothing. On nRF52 the heartbeat is driven by
  ; NRF52Board::heartbeatTick() straight from this flag, so moving it is this line --
  ; no shared code, and no other board affected. P0.08 is now free for the LED scheduler
  ; (#1367) to own: traffic over message-waiting, never solid-on.
  -D PIN_STATUS_LED=22     ; PIN_QCC_MODULE_LED, P0.15 on the ProMicro (heartbeat)
  ; #1367: the LED beside the display, which the heartbeat move freed. Traffic over
  ; message-waiting over dark, never solid-on. The dispatcher reports decoded packets
  ; through the LedActivity seam; both flags are set only here, so the other sixty
  ; variants neither compile the seam nor call it.
  -D PIN_QCC_ACTIVITY_LED=0  ; PIN_QCC_MSG_LED, P0.08 -> Q2 -> MSG_LED
  -D OFFBAND_LED_ACTIVITY=1
  -D PIN_BUZZER=1          ; PIN_QCC_BUZZER, P0.06 -> Q3 -> MUTE switch -> BZ1
  -D ENV_INCLUDE_GPS=1
  ; #1236: a first boot starts with the GPS on. The badges have one, and it's the
  ; badge's best chance of a real clock (owner, 2026-09-15). Settings -> GPS turns it off.
  -D DEFAULT_GPS_ENABLED=1
  ; #1245: the display waits a minute, not the fleet's fifteen seconds. The owner, on
  ; the bench: the screen timeout is too short by default. Settings -> Screen off steps
  ; it through 15s, 30s, 1m, 2m and 5m. Only this board's default moves.
  -D DEFAULT_UI_SCREEN_SECS=60
  ; #1362: message screens default to medium (badgeui::kTextMedium) while navigation
  ; keeps large. Set here rather than in NodePrefs.h because sixty-one variants compile
  ; these screens and only the badge was asked to change; everywhere else the message
  ; size falls back to the navigation default and nothing moves.
  -D DEFAULT_UI_MSG_TEXT_SIZE=1
  ; #1419: the badge confirms a send with a short tone. Stock Meshtastic does, and the
  ; owner asked for it on 2026-09-12. Fleet-wide the send tone is silent, because no
  ; board plays anything on send today and the badge is the only one that can even fire
  ; the event -- the screen that sends is inside UI_HAS_CARDKB. Set here rather than in
  ; Tunes.h so no other variant's sound changes. It is a default, not a lock: Settings
  ; -> Tones can change or silence it once #1421 lands.
  -D DEFAULT_TONE_SENT=offband::kTuneTick
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  ; --- one low-voltage policy (D2): SafeBoot runs first, then the runtime cutoff ---
  -D SAFEBOOT_PIN_VBAT_READ=17         ; P0.31; SafeBoot can't see PromicroBoard.h (#1176)
  -D SAFEBOOT_ADC_MULTIPLIER=1.68f     ; divider RATIO; must equal qcc::kDividerRatio
  -D SAFEBOOT_ADC_SAMPLE_US=40         ; ~405k source impedance
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3500
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  ; #1667: how long the cell must stay under AUTO_SHUTDOWN_MILLIVOLTS before the board
  ; powers off. The owner's figure, 2026-10-19: "at least 300s consistent below minimum."
  ;
  ; This exists because the cutoff used to fire on ONE raw ADC sample, and took the badge
  ; down with its gauge reading ~80% -- an independent MAX17048 and INA228 on the bench rig
  ; agreed with the gauge to within 6 mV at 4026 mV, so it was a bad read, not a flat cell.
  ; The rule now also requires the SMOOTHED value under the line, which is what makes a
  ; single outlier harmless. See src/helpers/ui/LowBattCutoff.h.
  -D OFFBAND_LOW_BATT_SUSTAIN_MS=300000
  ; #1246: the bar's ends, both this board's own rather than the fleet default 3000-4200.
  ;
  ; EMPTY. The badge has three low-voltage thresholds and they say different things
  ; (SafeBoot.cpp:643-651):
  ;   3700  WAKE  -- at or above this a boot proceeds outright
  ;   3500  SLEEP -- below this a boot is refused; between the two it proceeds only on a
  ;                  clean fresh boot
  ;   3400  AUTO_SHUTDOWN_MILLIVOLTS -- a RUNNING badge stops here
  ; 0% is the SLEEP line, so it means "will not start", the same thing 0% means on a
  ; phone: there is reserve below it and the badge keeps running on it down to 3400. The
  ; shutdown voltage would have been the wrong choice -- it would have drawn 7% on a
  ; badge that cannot be turned back on. The fleet's 3000 was worse again: a third of a
  ; bar on a badge already off. QccBadgeBoard.cpp holds this to DEFAULT_SAFE_BOOT_SLEEP_MV.
  ;
  ; FULL. Where a charged cell settles once the charger lets go, about 4.15-4.18. 4200 is
  ; a charger's peak, which is why the bar never showed 100%. The low end of that band is
  ; deliberate: the complaint was that 100% was unreachable, and the charge between 4.15
  ; and 4.18 is a low single-digit percentage of the cell.
  -D BATT_MIN_MILLIVOLTS=3500
  -D BATT_MAX_MILLIVOLTS=4150
  -D OFFBAND_EVENT_SPLASH   ; splash A (QccSplash.cpp) instead of the Offband lockup
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/sensors>
  +<helpers/ui/TpFont.cpp>
  +<helpers/ui/OLEDDisplayFonts.cpp>
  +<../variants/qcc_badge>
  +<../variants/promicro/PromicroBoard.cpp>
lib_deps = ${nrf52_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library@^2.6.8
  stevemarple/MicroNMEA @ ^2.0.6

; Departure flavor: normal radio defaults (D1). The con flavor, with the con's own radio
; config and the first-boot move back to these defaults, lands in epic 6.
; #1236: a first boot uses the US preset (910.525 MHz, 62.5 kHz, SF7, CR5) until the con
; says otherwise (owner, 2026-09-15: "US frequencies make it communicate out of the box").
[env:QCC_Badge_companion_radio_ble]
extends = QCC_Badge
build_flags = ${QCC_Badge.build_flags}
  -I examples/companion_radio/ui-new
  -I variants/qcc_badge        ; #1364: QccChannels.h, the badge's pre-flashed channels
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  ; #1364: ship holding the conference channels beside Public, on a FRESH badge only.
  ; A configured badge keeps exactly the channels it has -- see QccChannels.h.
  -D OFFBAND_PREFLASH_CHANNELS=1
  ; #1556: GPS Power save. Opt-in per variant, NOT a companion-wide default: ten different
  ; SensorManager classes exist across variants and only EnvironmentSensorManager exposes
  ; gpsHasFix()/gpsSnapshot(), which the duty cycle needs to tell a fix from a timeout.
  ; t1000-e proved that the hard way -- it carries T1000SensorManager and failed to compile.
  ; A board whose manager has the accessors can set this once someone has measured and
  ; tested it there; without it Off and On behave exactly as they always have.
  -D OFFBAND_GPS_POWER_SAVE=1
  ; The arriving-message rule that can sound the un-listed tune at kTuneTrigger. Only
  ; this variant compiles it; the rule itself is in src/helpers/ui/TuneTrigger.h and is
  ; covered by test/test_tune_trigger. The channel defaults to "#queencitycon" in
  ; MyMesh.cpp and is overridable here if the conference channel is ever renamed.
  -D OFFBAND_TUNE_TRIGGER=1
  ; #1597: the advertising pattern on PIN_STATUS_LED (P0.15) -- the pyramid badge's three
  ; bright front LEDs, the sponsor badge's ProMicro module LED. Morse while nothing is
  ; paired; the #275 heartbeat once something is. Both loop-driven, so either stopping means
  ; the loop wedged. One image covers both badge kinds by owner's call, so the sponsor badge
  ; runs the same pattern on a less visible part. LED_BLUE = -1 in variant.h is what frees
  ; the pin from the Arduino core.
  ; #1598: a fresh badge (no stored prefs) names itself QCC + the last 5 hex characters of
  ; its BLE MAC, so the name on the badge is the device in the phone's pairing list. Same
  ; 8-character width as the pubkey-hex default it replaces.
  ;
  ; #1635: OFFBAND_NAME_MAC_VERIFY, the one-off FICR-vs-SoftDevice boot comparison, used
  ; to be here -- in the SHIPPING env, which the _diag env extends. It prints the device's
  ; BLE address, and its own source comment warns that this repo is public, so the release
  ; image was the one printing it. It now sits in [qcc_badge_diag] with the rest of the
  ; diagnostic surface, and scripts/test_qcc_badge_env.py asserts it never comes back.
  -D OFFBAND_NAME_FROM_BLE_MAC='"QCC"'
  -D OFFBAND_BLE_MORSE=1
  -D OFFBAND_BLE_MORSE_TEXT='"I AM NOT WORTHY"'
  ; #275's heartbeat blip, slowed from the 1 Hz default to ~5 s. That default was sized
  ; for the solar car companion: a sealed, screenless node where the blip is the only
  ; liveness signal and power is the binding constraint. On this badge the same pin is
  ; three bright LEDs worn on a person, and there is a display to show a wedged loop, so
  ; the liveness argument is weaker and the nuisance is real. Owner, 2026-10-18:
  ; "obnoxious". 4890 and not 4900 -- it must sit just UNDER a 100 ms wake boundary or the
  ; observed gap depends on jitter (test/test_heartbeat_cadence pins this).
  -D OFFBAND_HEARTBEAT_OFF_MS=4890
  -D BLE_PIN_CODE=123456    ; with a display, MyMesh turns this into a random PIN per session
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D DISPLAY_CLASS=SSD1306Display
  -D UI_HAS_CARDKB=1        ; the badge's CardKB-compatible keyboard, found at boot (#1205)
  ; QCC conference channel (#1363). FIRST-BOOT SEEDS ONLY: MyMesh assigns these to
  ; _prefs, then loadPrefs() overwrites them from the stored prefs, so a badge that
  ; already has a frequency keeps it across a flash. Never an every-boot apply.
  -D LORA_FREQ=919.5
  -D LORA_BW=500
  -D LORA_SF=7
  -D LORA_CR=5
build_src_filter = ${QCC_Badge.build_src_filter}
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/CardKbInput.cpp>
  +<helpers/ui/LedActivity.cpp>   ; #1367: the dispatcher -> UI traffic seam
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps = ${QCC_Badge.lib_deps}
  adafruit/RTClib @ ^2.1.3
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; Diagnostic twin, until beta (owner directive): the fleet's nRF52 diag surface.
; The log mirror transmits on the spare GPIO38 pad (P1.06) through UARTE1, never on
; P0.06/P0.08, which drive the buzzer and LED. Logs also go over the ProMicro's USB.
; GPIO38 because it is the only spare pad connected to the chip. GPIO33, GPIO34 and GPIO39
; go to the ProMicro's inner holes, which have no header pins on the owner's badge (#1210).
[qcc_badge_diag]
build_flags =
  -D OFFBAND_FORCE_CAPLOG
  -D OFFBAND_BOOT_BEACON
  -D OFFBAND_LOG_MIRROR_UART=1
  -D OFFBAND_LOG_MIRROR_TX_PIN=PIN_QCC_SPARE_GPIO38
  -D OFFBAND_LOG_MIRROR_BAUD=115200
  ; #1210: an ID line on each spare pad once a second, for proving the sniffer wiring.
  -D OFFBAND_PAD_BEACON
  -D QCC_BADGE_SELFTEST
  ; #1635: the #1598 FICR-vs-SoftDevice equivalence check. Prints the device's BLE
  ; address, so it belongs with the diagnostic surface and not in the shipping image.
  ; main.cpp gates it on OFFBAND_NAME_FROM_BLE_MAC too, so it is inert on any board that
  ; does not name itself from its MAC.
  -D OFFBAND_NAME_MAC_VERIFY=1

[env:QCC_Badge_companion_radio_ble_diag]
extends = env:QCC_Badge_companion_radio_ble
build_flags =
  ${env:QCC_Badge_companion_radio_ble.build_flags}
  ${qcc_badge_diag.build_flags}

; #1553 (G0): the GPS power measurement harness. Not a shipping env -- it cycles GPS on a
; fixed schedule for ~2.8 h and logs time-to-fix per off duration, to be read against the
; bench rig's current trace. Everything the diag env has, plus the probe.
[env:QCC_Badge_companion_radio_ble_gpsprobe]
extends = env:QCC_Badge_companion_radio_ble
build_flags =
  ${env:QCC_Badge_companion_radio_ble.build_flags}
  ${qcc_badge_diag.build_flags}
  -D OFFBAND_GPS_DUTY_PROBE=1

; #1668: the burndown image. The runtime cutoff is DISABLED outright, so the badge runs
; until it genuinely browns out and the real discharge curve gets measured instead of
; argued about. Owner, 2026-10-19: "disable the cutoff altogether and let's see where it
; really dies on its own", and "I don't care if I kill the battery, I have a spare."
;
; ⚠ NOT A SHIPPING IMAGE. A board flashed with this has no low-voltage protection at the
; runtime layer at all, and will discharge the cell past the point the fleet treats as
; empty. SafeBoot still refuses a RE-boot below its 3500 mV sleep line, so the badge will
; not boot-loop at the bottom -- it stays down until charged.
;
; Everything else is the diag env, so the per-check [batt] line -- raw, smoothed,
; threshold, external-power state, and how long the low condition has held -- reaches the
; log mirror and lands in the rig capture beside wroom-sniffer-2's own [gauge] and [ina]
; lines. Two independent views of one cell, timestamped against each other.
[env:QCC_Badge_companion_radio_ble_burndown]
extends = env:QCC_Badge_companion_radio_ble_diag
build_flags =
  ${env:QCC_Badge_companion_radio_ble_diag.build_flags}
  -D OFFBAND_LOW_BATT_SUSTAIN_MS=0
