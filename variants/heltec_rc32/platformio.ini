[Heltec_RC32]
extends = esp32_base
board = heltec-rc32
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_rc32
  -I src/helpers/ui
  -D HELTEC_RC32
  -D USE_SX1262
  -D ESP32_CPU_FREQ=160
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=10
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=1
  -D P_LORA_SCLK=11
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=12
  -D LORA_TX_POWER=22
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=18
  ; Vendor-confirmed (RadioCore_Library src/boards/heltec_rc32.h):
  ;   SENSOR_POWER_CTRL_PIN 46 / SENSOR_POWER_ON HIGH / 100 ms warm-up.
  ; WARNING: GPIO46 is an ESP32-S3 STRAPPING PIN. This assignment is the
  ; vendor's own, so it stays -- but it must never be repurposed, and it
  ; remains a suspect for reset-time anomalies (#702).
  -D SENSOR_POWER_CTRL_PIN=46
  -D SENSOR_POWER_ON=HIGH
  ; #704: SENSOR_RST_PIN=2 REMOVED. Not in the vendor header, read by nothing
  ; in src/ or examples/, and GPIO2 is the vendor's relay-control / CH01-VO01-
  ; CO01 ADC pin -- so the define was both dead and in conflict.
  ; P_LORA_TX_LED=47 retained: not declared by the vendor, but it IS consumed
  ; (helpers/ESP32Board.h) and a module-internal TX LED is plausible.
  ; UNVERIFIED against hardware -- confirm before relying on it.
  -D P_LORA_TX_LED=47
  ; #704: PIN_BUZZER=48 REMOVED. The RC32 has no buzzer -- absent from all 65
  ; vendor defines. It was the source of the runtime
  ; "ledc_get_duty: LEDC is not initialized" errors.
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=38
  -D PIN_TFT_CS=39
  -D PIN_TFT_DC=16
  -D PIN_TFT_RST=4
  -D PIN_TFT_EN=6
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=5
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D SPI_FREQUENCY=8000000
  ; ---------------------------------------------------------------------------
  ; #704 / #702: GPS DISABLED ON THIS BOARD -- DO NOT RE-ENABLE WITHOUT READING
  ; ---------------------------------------------------------------------------
  ; The RadioCore RC32 has NO GPS. Heltec's own board definition
  ; (HelTecAutomation/RadioCore_Library, src/boards/heltec_rc32.h) declares no
  ; GPS/GNSS pins at all -- the pin map below is upstream MeshCore's, not the
  ; vendor's.
  ;
  ; PIN_GPS_EN was 45. **GPIO45 is the ESP32-S3 VDD_SPI voltage-selection
  ; strapping pin**: HIGH at reset selects 1.8 V, LOW/floating selects 3.3 V.
  ; This module carries 3.3 V in-package PSRAM (esptool: "Embedded PSRAM 8MB
  ; (AP_3v3)"), so VDD_SPI must be 3.3 V.
  ;
  ; MicroNMEALocationProvider::begin() drives the enable pin HIGH with NO
  ; presence check -- it cannot know whether a receiver exists. So on a board
  ; with no GPS the VDD_SPI strap was being held at the 1.8 V setting, and any
  ; reset taken in that state left the chip unable to fetch code from flash:
  ; frozen, dark, absent from USB, until a later reset happened to catch the
  ; pin low. Confirmed on hardware -- boots reliably with GPS compiled out.
  ;
  ; GPIO46 (SENSOR_POWER_CTRL_PIN) is ALSO a strapping pin. If GPS or any other
  ; peripheral is ever added here, check the pin against the ESP32-S3 strapping
  ; list (GPIO0, GPIO3, GPIO45, GPIO46) FIRST.
  ;
  ; Same defect class as #211 (RAK3401: GPS probe floated WB_IO2 = the radio
  ; power-enable when no GPS was fitted).
  ;
  ; Pin defines retained, commented, so the upstream mapping is not lost.
  ;   -D PIN_GPS_TX=44
  ;   -D PIN_GPS_RX=43
  ;   -D PIN_GPS_EN=45          <-- VDD_SPI STRAP. Never drive on this board.
  ;   -D PIN_GPS_EN_ACTIVE=HIGH
  ;   -D PIN_GPS_RESET=40
  ;   -D PIN_GPS_RESET_ACTIVE=LOW
  ;   -D PIN_GPS_PPS=41
  ;   -D GPS_BAUD_RATE=9600
  -D ENV_INCLUDE_GPS=0
  -D PIN_ADC_CTRL=15
  -D PIN_VBAT_READ=7
  -D ADC_CTRL_ENABLED=HIGH
  -D ADC_MULTIPLIER=4.9
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_rc32>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[Heltec_RC32_with_display]
extends = Heltec_RC32
build_flags =
  ${Heltec_RC32.build_flags}
  -D HELTEC_RC32_WITH_DISPLAY
  -D DISPLAY_CLASS=NV3001BDisplay
build_src_filter = ${Heltec_RC32.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${Heltec_RC32.lib_deps}

[env:heltec_rc32_without_display_repeater]
extends = Heltec_RC32
build_flags =
  ${Heltec_RC32.build_flags}
  -D ADVERT_NAME='"Heltec RC32 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Heltec_RC32.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_RC32.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0

[env:heltec_rc32_without_display_repeater_bridge_espnow]
extends = Heltec_RC32
build_flags =
  ${Heltec_RC32.build_flags}
  -D ADVERT_NAME='"ESPNow Bridge"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D WITH_ESPNOW_BRIDGE=1
build_src_filter = ${Heltec_RC32.build_src_filter}
  +<helpers/bridges/ESPNowBridge.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${Heltec_RC32.lib_deps}
  ${esp32_ota.lib_deps}

