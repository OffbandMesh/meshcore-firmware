[Heltec_RC32]
extends = esp32_base
board = heltec-rc32
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/heltec_rc32
  -I src/helpers/ui
  -D HELTEC_RC32
  -D USE_SX1262
  -D ESP32_CPU_FREQ=160
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D P_LORA_DIO_1=14
  -D P_LORA_NSS=10
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=1
  -D P_LORA_SCLK=11
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=12
  -D LORA_TX_POWER=22
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=18
  -D SENSOR_POWER_CTRL_PIN=46
  -D SENSOR_POWER_ON=HIGH
  -D SENSOR_RST_PIN=2
  -D P_LORA_TX_LED=47
  -D PIN_BUZZER=48
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=38
  -D PIN_TFT_CS=39
  -D PIN_TFT_DC=16
  -D PIN_TFT_RST=4
  -D PIN_TFT_EN=6
  -D PIN_TFT_EN_ACTIVE=LOW
  -D PIN_TFT_BL=5
  -D PIN_TFT_BL_ACTIVE=HIGH
  -D SPI_FREQUENCY=8000000
  ; #704: DISPLAY_ROTATION=0 -- LANDSCAPE, owner-confirmed on hardware.
  ; Do NOT copy Heltec's number across libraries. They pass 3 to Arduino_NV3001B
  ; (Meshtastic TFTDisplay.cpp, PR #10876; same in their RadioCore_Library
  ; example README), but NV3001BDisplay's rotation enum is NOT Arduino_GFX's.
  ; nv3001bMADCTL() maps:
  ;   0 -> MY|MV = 0xA0  landscape          <-- owner's required orientation
  ;   1 -> MY|MX = 0xC0  portrait, 180
  ;   2 -> RGB   = 0x00  portrait
  ;   3 -> MX|MV = 0x60  landscape, 180 of 0
  ; MV (row/column exchange) is what makes 0 and 3 landscape. Verified on the
  ; bench across all four values: 3 and 1 and 2 were each rejected by the owner
  ; before 0 was confirmed correct.
  ;
  ; The panel glass is physically 128x220 portrait -- that is the GLASS, not the
  ; required UI orientation, which is landscape. Do not "fix" this back to 3.
  ;
  ; SEPARATE, still unfixed: NV3001B_LOGICAL_HEIGHT is 64 (an OLED-sized canvas)
  ; scaled onto a 220px panel, which distorts layout independently of rotation.
  ; See #705.
  -D DISPLAY_ROTATION=0
  ; NV3001B_SPI_HOST is deliberately left at its HSPI default. Heltec's own
  ; comment in TFTDisplay.cpp: "Keep TFT off the LoRa FSPI host; Arduino_GFX
  ; reconfigures the selected SPI bus." LoRa owns FSPI here (target.cpp), and
  ; the S3 has only two general-purpose hosts. The resulting
  ; "spiAttachMISO(): HSPI Does not have default pins" line is EXPECTED -- this
  ; panel is write-only and Heltec pass GFX_NOT_DEFINED for MISO too.
  ; Do NOT "fix" this to FSPI; it would reconfigure the radio's bus.
  ; ---------------------------------------------------------------------------
  ; #704 / #702: GPS COMPILED OUT ON THIS VARIANT -- read before re-enabling
  ; ---------------------------------------------------------------------------
  ; The RC32 board family DOES support GPS. Heltec's own Meshtastic variant
  ; (Quency-D/firmware, branch heltec-rc32, Meshtastic PR #10876,
  ; variants/esp32s3/heltec_rc32/variant.h) declares:
  ;   HAS_GPS 1, GPS_RX_PIN 44, GPS_TX_PIN 43,
  ;   PIN_GPS_EN 45 (GPS_EN_ACTIVE HIGH), PIN_GPS_RESET 40, PIN_GPS_PPS 41
  ; So the pin map below is HELTEC'S, not an upstream invention. Do not treat
  ; these pins as fictitious.
  ;
  ; WHY IT IS OFF HERE: PIN_GPS_EN is **GPIO45, the ESP32-S3 VDD_SPI
  ; voltage-selection strapping pin** -- HIGH at reset selects 1.8 V, LOW/
  ; floating selects 3.3 V. This module carries 3.3 V in-package PSRAM
  ; (esptool: "Embedded PSRAM 8MB (AP_3v3)").
  ;
  ; Meshtastic PROBES for a receiver before using GPS. MeshCore's
  ; MicroNMEALocationProvider::begin() asserts the enable pin UNCONDITIONALLY,
  ; with no presence check (MicroNMEALocationProvider.h:88-91). On a unit with
  ; no receiver fitted -- which is what a bare core module + display is -- that
  ; holds the VDD_SPI strap at the 1.8 V setting, and a reset taken in that
  ; state cannot fetch code from flash: frozen, dark, absent from USB.
  ; Owner-confirmed: the repeater boots reliably on a single short RST with GPS
  ; compiled out, and froze before.
  ;
  ; THE GENERAL FIX is to presence-gate the enable in MicroNMEALocationProvider
  ; so a missing receiver never drives the pin. That is shared code with
  ; fleet-wide blast radius and is tracked separately. Until it lands, GPS stays
  ; off on this variant. Re-enable ONLY after that gating exists, or on a unit
  ; that genuinely has a receiver fitted.
  ;
  ; Same defect class as #211 (RAK3401: the GPS probe floated WB_IO2, the radio
  ; power-enable, with no GPS fitted).
  ;
  ; STRAPPING PINS on ESP32-S3 are GPIO0, GPIO3, GPIO45, GPIO46. This variant
  ; touches GPIO0 (PIN_USER_BTN), GPIO45 (GPS enable, now unused) and GPIO46
  ; (SENSOR_POWER_CTRL_PIN, Heltec-declared, driven HIGH). Check any new
  ; peripheral against that list FIRST.
  ;
  ; Heltec's pin map retained, commented, so it is not lost:
  ;   -D PIN_GPS_TX=44
  ;   -D PIN_GPS_RX=43
  ;   -D PIN_GPS_EN=45          <-- VDD_SPI STRAP
  ;   -D PIN_GPS_EN_ACTIVE=HIGH
  ;   -D PIN_GPS_RESET=40
  ;   -D PIN_GPS_RESET_ACTIVE=LOW
  ;   -D PIN_GPS_PPS=41
  ;   -D GPS_BAUD_RATE=9600
  -D ENV_INCLUDE_GPS=0
  -D PIN_ADC_CTRL=15
  -D PIN_VBAT_READ=7
  -D ADC_CTRL_ENABLED=HIGH
  -D ADC_MULTIPLIER=4.9
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D SX126X_REGISTER_PATCH=1       ; Patch register 0x8B5 for improved RX
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/heltec_rc32>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[Heltec_RC32_with_display]
extends = Heltec_RC32
build_flags =
  ${Heltec_RC32.build_flags}
  -D HELTEC_RC32_WITH_DISPLAY
  -D DISPLAY_CLASS=NV3001BDisplay
  ; #749: colour splash. Opt-in, and scoped to this section on purpose -- it pulls
  ; in a 16.8 KB RGB565 asset, which has no business in the ~115 mono-OLED envs.
  ; Those keep the 1-bit XBM lockup; DisplayDriver::drawRGB565 defaults to a no-op.
  -D OFFBAND_COLOUR_SPLASH
build_src_filter = ${Heltec_RC32.build_src_filter}
  +<helpers/ui/NV3001BDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${Heltec_RC32.lib_deps}

