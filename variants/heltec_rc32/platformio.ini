; ---------------------------------------------------------------------------
; #740 -- DIAGNOSTIC ENV for the #702 RST no-boot investigation.
; NOT for release, deliberately NOT in the CI matrix or release-envs.txt.
;
; Identical to heltec_rc32_companion_radio_usb except for the instrumentation
; block below. Kept as a separate env so the shipping env is never perturbed by
; diagnostic flags.
; ---------------------------------------------------------------------------
[env:heltec_rc32_companion_radio_usb_diag]
extends = Heltec_RC32_with_display
build_flags =
  ${Heltec_RC32_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D UI_HAS_ROTARY_INPUT
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D ENABLE_USB_INTERFACE
  ; --- #740 instrumentation ------------------------------------------------
  ; Raw-UART0 phase beacon: see src/helpers/BootBeacon.h.
  -D OFFBAND_BOOT_BEACON
  ; GPIO43 (U0TXD) is the external sniffer wire. EnvironmentSensorManager::
  ; initBasicGPS() calls Serial1.setPins(44, 43), which reassigns GPIO43 to
  ; UART1 partway through setup() and blinds the sniffer for the rest of the
  ; boot. GPS off keeps UART0 ours for the whole boot.
  ; Independently correct on this board regardless: PIN_GPS_EN is GPIO45, the
  ; ESP32-S3 VDD_SPI strapping pin, and GPIO45 is not broken out on the RC32
  ; 20-pin header at all -- nothing can be connected to it (#704).
  ; Removal of the inherited =1 is done via build_unflags below -- `-U NAME` in
  ; build_flags is mangled by PlatformIO's parser ("macro names must be
  ; identifiers"); build_unflags is the supported mechanism.
  -D ENV_INCLUDE_GPS=0
  ; Landscape, owner-confirmed on hardware (#704).
  -D DISPLAY_ROTATION=0
  ; This env is flashed with --erase (full merged image at 0x0), which wipes
  ; NVS -- so the radio config is re-seeded from these build defaults on first
  ; boot. heltec_rc32 sets no LORA_FREQ, so the base default is 869.618 MHz: an
  ; EU SRD frequency, outside the US 902-928 ISM band. It already bit this board
  ; once (2026-08-14). Seed the US preset so an erased board cannot come up
  ; out-of-band. Canonical source: variants/heltec_v4/platformio.ini:106-109.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
build_unflags =
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${Heltec_RC32_with_display.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
  ${esp32_no_ble.build_src_filter}
lib_deps =
  ${Heltec_RC32_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

; ---------------------------------------------------------------------------
; #740 / #702 -- ONE-VARIABLE TEST env.
; Identical to heltec_rc32_companion_radio_usb_diag except CrashLog is compiled
; out via the project's own documented opt-out.
;
; WHY: with the beacon in place, two consecutive instrumented boots stopped
; inside offband::crashLogStandardInit(board, "companion") -- last line
; "setup:before crashLogStandardInit", no "post", then 5+ minutes of silence
; with the sniffer still heartbeating. That function is four statements, one of
; which is crashLogBegin(), which reads and dumps the RTC_NOINIT ring retained
; from the previous reset. RTC_NOINIT survives an RST (CHIP_PU) and a fast
; replug, and drains on a slow one -- which is the shape of the #702 symptom set.
;
; If this env boots to a live screen and survives RST, CrashLog init is the
; cause and OFFBAND_CRASHLOG_DISABLED is an immediate Beta 1 workaround.
; If it does NOT, CrashLog is exonerated and the hang is in board.begin()'s
; tail or the early display path.
; ---------------------------------------------------------------------------
[env:heltec_rc32_companion_radio_usb_diag_nocrashlog]
extends = env:heltec_rc32_companion_radio_usb_diag
build_flags =
  ${env:heltec_rc32_companion_radio_usb_diag.build_flags}
  -D OFFBAND_CRASHLOG_DISABLED

; ---------------------------------------------------------------------------
; #763 -- BLE companion with the MeshLog UART0 mirror.
;
; Purpose: give the `_ble` role a log channel that is NOT the thing under test.
; On a _ble build Serial is USB-CDC, which dies with the chip and power-cycles
; the board on attach (#702) -- so every log ever captured that way came from a
; boot that succeeded. UART0 (GPIO43, header pin 12) goes to the external
; sniffer, survives the chip failing, and works on battery with no host at all.
;
; This is what makes #699 (BLE boots but never adverts) diagnosable.
;
; ENV_INCLUDE_GPS=0 is REQUIRED, not incidental: initBasicGPS() calls
; Serial1.setPins(44, 43), which reassigns GPIO43 -- the sniffer wire -- partway
; through setup(). With GPS on, the mirror goes silent mid-boot (#702).
; ---------------------------------------------------------------------------
[env:heltec_rc32_companion_radio_ble_diag]
extends = Heltec_RC32_with_display
build_flags =
  ${Heltec_RC32_with_display.build_flags}
  -I examples/companion_radio/ui-new
  -D UI_HAS_ROTARY_INPUT
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D AUTO_SHUTDOWN_MILLIVOLTS=3400
  -D OFFLINE_QUEUE_SIZE=256
  ; --- #763 / #740 instrumentation ---
  -D OFFBAND_MESHLOG_UART0
  -D OFFBAND_BOOT_BEACON
  ; Battery discharge trace for the Heltec beta Q01 runtime question. Rides the
  ; UART0 mirror above, so it reports from a board on battery with no host.
  ; Note the curve terminates at AUTO_SHUTDOWN_MILLIVOLTS (3400) by design, not
  ; at cell cutoff -- that shutdown point IS the answer to "how long does it run".
  -D OFFBAND_POWER_TELEMETRY
  -D ENV_INCLUDE_GPS=0
  -D DISPLAY_ROTATION=0
  ; Seed the US preset so a wiped config cannot come up on the base default
  ; 869.618 MHz (EU SRD, outside the US band). Canonical: variants/heltec_v4.
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
build_unflags =
  -D ENV_INCLUDE_GPS=1
build_src_filter = ${Heltec_RC32_with_display.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_RC32_with_display.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
  ${esp32_ble.lib_deps}
