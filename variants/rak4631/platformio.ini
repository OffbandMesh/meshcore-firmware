[rak4631]
extends = nrf52_base
board = rak4631
board_check = true
extra_scripts = ${nrf52_base.extra_scripts}
  post:variants/rak4631/fix_bsec_lib.py
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/rak4631
  -D RAK_4631
  -D RAK_BOARD
  -D NRF52_POWER_MANAGEMENT
  -D PIN_BOARD_SCL=14
  -D PIN_BOARD_SDA=13
  -D PIN_GPS_TX=PIN_SERIAL1_RX
  -D PIN_GPS_RX=PIN_SERIAL1_TX
  -D PIN_GPS_EN=-1
  -D PIN_OLED_RESET=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D ENV_INCLUDE_RAK12035=1
  ; --- SafeBoot pre-init power guard (Meshtastic PR #10391) ---
  ; RAK4631's variant.h defines ADC_MULTIPLIER as a composite constant
  ; (3 * 1.73 * 1.187 * 1000 = 6166) used with /4096 in board code -- not
  ; compatible with SafeBoot's simple-ratio formula. Override with the
  ; algebraically-derived simple ratio (1.73 * 1.187 = 2.054) + the
  ; matching 3.0V AREF. Requires F6c bench validation before considered
  ; ground-truth. See F13 / Strycher/LoRa#146 for the override mechanism.
  -D SAFEBOOT_ADC_MULTIPLIER=2.054           ; simple Vbat/Vadc divider ratio (derived from variant.h composite)
  -D SAFEBOOT_AREF_VOLTAGE=3.0               ; matches variant.h composite formula's implicit AREF
  ; LPCOMP wake for solar auto-recovery (F15 / Strycher/LoRa#148).
  ; AIN3 = P0.05 = PIN_VBAT_READ. Matches existing variant.h PWRMGT_LPCOMP_AIN=3.
  ; Threshold 5/8 VDD matches variant.h PWRMGT_LPCOMP_REFSEL=4.
  -D BATTERY_LPCOMP_INPUT=NRF_LPCOMP_INPUT_3
  -D BATTERY_LPCOMP_THRESHOLD=NRF_LPCOMP_REF_SUPPLY_5_8
  -D DEFAULT_SAFE_BOOT_WAKE_MV=3700          ; LiIon: continue boot above this
  -D DEFAULT_SAFE_BOOT_SLEEP_MV=3400         ; LiIon: sleep below this
  -D DEFAULT_SAFE_BOOT_RECHECK_SECS=120      ; initial sleep interval
  -D DEFAULT_SAFE_BOOT_MAX_RECHECK_SECS=600  ; backoff cap
  -UENV_INCLUDE_BME680
  -D ENV_INCLUDE_BME680_BSEC=1
build_src_filter = ${nrf52_base.build_src_filter}
  +<../variants/rak4631>
  +<helpers/sensors>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  sparkfun/SparkFun u-blox GNSS Arduino Library@^2.2.27
  boschsensortec/BSEC Software Library @ ^1.8.1492

[env:RAK_4631_repeater]
extends = rak4631
build_flags =
  ${rak4631.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"RAK4631 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D PIN_STATUS_LED=LED_BUILTIN  ; #275: green LED1 heartbeat on the headless repeater
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
build_src_filter = ${rak4631.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>

