; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; LoRa#209: per-host secrets file location is governed by the PIO_SECRETS_FILE
; environment variable, so the same secrets file is shared between the main
; meshcore-firmware/ worktree and any .worktrees/<branch> worktrees without
; per-worktree file duplication.
;
; Operator setup (once per host):
;   1. Place the canonical secrets file at a stable path outside any
;      meshcore-firmware worktree (e.g. C:\Dev\LoRa\platformio.secrets.ini).
;   2. Set the PIO_SECRETS_FILE env var to that absolute path. See
;      Strycher/LoRa CLAUDE.md "Build Environment" section for shell-specific
;      examples (PowerShell + git-bash).
;
; Legacy: pre-LoRa#209 builds used `platformio.local.ini` co-located with
; this file. The legacy path is no longer auto-loaded. To revert temporarily,
; restore the legacy line below in place of the env-var entry. Long-term,
; delete any stale `platformio.local.ini` from your local checkout to avoid
; confusion.
[platformio]
extra_configs =
	variants/*/platformio.ini
	${sysenv.PIO_SECRETS_FILE}

[arduino_base]
framework = arduino
monitor_speed = 115200
lib_deps =
  SPI
  Wire
  ;jgromes/RadioLib @ ^7.7.1
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
build_flags = -w -DNDEBUG -DRADIOLIB_STATIC_ONLY=1 -DRADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1   ; NOTE: comment these out for more secure firmware
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
build_src_filter =
  +<*.cpp>
  +<helpers/*.cpp>
  +<helpers/diagnostics/*.cpp>   ; #475: CrashLog (moved here in #350) -- compile everywhere; --gc-sections drops it where uncalled
  +<helpers/prefs/*.cpp>         ; #627: legacy-prefs layout detection -- CommonCLI::loadPrefs
                                 ; calls identifyLegacyPrefs() on every role, so it must compile
                                 ; everywhere, not just the native test env. Same --gc-sections
                                 ; rationale as diagnostics above.
  +<helpers/radiolib/*.cpp>
  +<helpers/bridges/BridgeBase.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/OffbandSplash.cpp>  ; #822: the ONE splash, shared by all six roles. Compiled
                                   ; everywhere for the same --gc-sections reason as the entries
                                   ; above -- a per-variant opt-in is exactly how five roles kept
                                   ; MeshCore artwork and one colour panel got branding.

; ----------------- ESP32 ---------------------

[esp32_base]
extends = arduino_base
platform = platformio/espressif32@6.11.0
monitor_filters = esp32_exception_decoder
extra_scripts =
  pre:scripts/inject_offband_version.py
  merge-bin.py
build_flags = ${arduino_base.build_flags}
  -D ESP32_PLATFORM
;  -D ESP32_CPU_FREQ=80          ; change it to your need
build_src_filter = ${arduino_base.build_src_filter}

[esp32_ota]
lib_deps =
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  file://arch/esp32/AsyncElegantOTA

; #199: single source of truth for the ESP32 BLE stack dependency. Any ESP32 env
; that compiles helpers/esp32/SerialBLEInterface.cpp must pull this in via
; ${esp32_ble.lib_deps}. Declaring it per-variant is what left four SHIPPED
; companion_radio_ble envs unable to build at all (fatal error: NimBLEDevice.h:
; No such file) and let the pinned version drift between boards.
; NOTE: nRF52 BLE envs do NOT use this -- they use the Nordic SoftDevice stack.
[esp32_ble]
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.0.0

; #199: the counterpart to [esp32_ble], for ESP32 envs that do NOT use BLE.
;
; Every companion env pulls the whole helpers/esp32 directory in with a greedy
; wildcard (+<helpers/esp32/*.cpp>), and SerialBLEInterface.h includes
; <NimBLEDevice.h> unconditionally -- there is no #ifdef guard. So a USB / WiFi /
; serial env compiles the BLE interface it never uses, and then fails to build for
; want of a Bluetooth stack it should not need in the first place.
;
; The fix is to drop the file, NOT to hand those envs NimBLE: declaring the dep
; would make the error disappear while linking a full BLE stack into non-BLE
; firmware. This is the pattern already established by #89 for
; Xiao_S3_WIO_companion_radio_usb.
;
; MUST be referenced LAST in an env's build_src_filter -- src filter entries apply
; in order, so the exclusion has to come after the +<helpers/esp32/*.cpp> that
; pulled the file in.
[esp32_no_ble]
build_src_filter =
  -<helpers/esp32/SerialBLEInterface.cpp>

; esp32c6 uses arduino framework 3.x
; WARNING: experimental. May not work as stable as other platforms.
[esp32c6_base]
extends = esp32_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip

; ----------------- NRF52 ---------------------

[nrf52_base]
extends = arduino_base
platform = nordicnrf52
platform_packages =
  ; use internal fork that includes patch to ble stack to prevent firmware lockup during rapid connect/disconnect
  ; https://github.com/meshcore-dev/MeshCore/pull/1177
  ; https://github.com/meshcore-dev/MeshCore/pull/1295
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301
extra_scripts =
  pre:scripts/inject_offband_version.py
  create-uf2.py
build_flags = ${arduino_base.build_flags}
  -D NRF52_PLATFORM
  -D LFS_NO_ASSERT=1
  -D EXTRAFS=1
  -D USE_CC310_HW_CRYPTO=1
lib_deps =
  ${arduino_base.lib_deps}
  https://github.com/oltaco/CustomLFS#0.2.3
; ----------------- RP2040 ---------------------

[rp2040_base]
extends = arduino_base
upload_protocol = picotool
board_build.core = earlephilhower
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#4e22a0d ; framework-arduinopico @ 1.50600.0+sha.6a1d13e9
extra_scripts = pre:scripts/inject_offband_version.py
build_flags = ${arduino_base.build_flags}
  -D RP2040_PLATFORM

; ----------------- STM32 ----------------------

[stm32_base]
extends = arduino_base
platform = platformio/ststm32@19.1.0
platform_packages = platformio/framework-arduinoststm32@https://github.com/stm32duino/Arduino_Core_STM32/archive/2.10.1.zip
extra_scripts =
  pre:scripts/inject_offband_version.py
  post:arch/stm32/build_hex.py
build_flags = ${arduino_base.build_flags}
  -D STM32_PLATFORM
  -I src/helpers/stm32
  -I $PROJECT_PACKAGES_DIR/framework-arduinoststm32/libraries/SubGhz/src
build_src_filter = ${arduino_base.build_src_filter}
  +<helpers/stm32>
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
  SubGhz

[sensor_base]
build_flags =
  -D ENV_INCLUDE_GPS=1
  -D ENV_INCLUDE_AHTX0=1
  -D ENV_INCLUDE_BME280=1
  -D ENV_INCLUDE_BMP280=1
  -D ENV_INCLUDE_SHTC3=1
  -D ENV_INCLUDE_SHT4X=1
  -D ENV_INCLUDE_LPS22HB=1
  -D ENV_INCLUDE_INA3221=1
  -D ENV_INCLUDE_INA219=1
  -D ENV_INCLUDE_INA226=1
  -D ENV_INCLUDE_INA260=1
  -D ENV_INCLUDE_MLX90614=1
  -D ENV_INCLUDE_VL53L0X=1
  -D ENV_INCLUDE_BME680=1
  -D ENV_INCLUDE_BMP085=1
lib_deps =
  adafruit/Adafruit INA3221 Library @ ^1.0.1
  adafruit/Adafruit INA219 @ ^1.2.3
  robtillaart/INA226 @ ^0.6.4
  adafruit/Adafruit INA260 Library @ ^1.5.3
  adafruit/Adafruit AHTX0 @ ^2.0.5
  adafruit/Adafruit BME280 Library @ ^2.3.0
  adafruit/Adafruit BMP280 Library @ ^2.6.8
  adafruit/Adafruit SHTC3 Library @ ^1.0.1
  sensirion/Sensirion I2C SHT4x @ ^1.1.2
  arduino-libraries/Arduino_LPS22HB @ ^1.0.2
  adafruit/Adafruit MLX90614 Library @ ^2.1.5
  adafruit/Adafruit_VL53L0X @ ^1.2.4
  stevemarple/MicroNMEA @ ^2.0.6
