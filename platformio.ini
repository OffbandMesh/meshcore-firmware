; ----------------- TESTING ---------------------

[env:native]
platform = native
test_framework = googletest
build_flags = -std=c++17
  ; #822: every real build injects OFFBAND_VERSION (inject_offband_version.py);
  ; without it the branding art compiles out and the splash draws nothing.
  -D OFFBAND_VERSION=\"test\"
  -I src
  -I test/mocks
test_build_src = yes
; test_wifi_clear needs WifiConfigProvider.cpp linked, whose static
; ProviderRegistrar would register a provider into the process-global table
; and break test_config_overlap's "fresh process => zero providers"
; precondition. Same isolation reason as test_kiss_modem: own env below.
test_ignore = test_kiss_modem, test_wifi_clear
build_src_filter =
  -<*>
  +<../src/Utils.cpp>
  +<../src/CaptureRing.cpp>
  +<../src/helpers/config/ConfigDispatch.cpp>
  +<../src/helpers/ClockSanity.cpp>
  +<../src/helpers/prefs/PrefsLayout.cpp>   ; #627: legacy-prefs layout detection
  +<../src/Packet.cpp>
  ; Offband: upstream added Packet.cpp to the native env in 1.17.0. In Offband
  ; MESH_DEBUG routes to mesh_log_line()/g_meshLogEnabled (MeshLog.cpp), which
  ; upstream does not need linked here. Without this the whole native suite
  ; fails to link. (#628)
  +<../src/MeshLog.cpp>
  +<../src/helpers/ConfigSerializer.cpp>
  +<../src/helpers/ArduinoSerialInterface.cpp>
  +<../src/helpers/ui/OffbandSplash.cpp>   ; #822: the one shared splash
  +<../src/helpers/ui/NativeUIColorDefs.cpp>  ; #822: UIColor statics -- no driver is linked natively   ; #718: framed-write atomicity is unit-tested
lib_deps =
  google/googletest @ 1.17.0

; #696: wifi clear + STA disconnect-reason. Isolated from [env:native]
; because WifiConfigProvider.cpp self-registers a config provider at static
; init (see test_ignore above).
[env:native_wifi_clear]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  ; WifiObserverConfig.h hard-#errors without one of these (#536); this code
  ; is observer scope, so OFFBAND_OBSERVER is the honest one to declare.
  -D OFFBAND_OBSERVER
test_build_src = yes
test_filter = test_wifi_clear
build_src_filter =
  -<*>
  +<../src/helpers/config/ConfigDispatch.cpp>
  +<../src/helpers/config/WifiConfigProvider.cpp>
  +<../src/helpers/wifi_observer/WifiBootstrap.cpp>
lib_deps =
  google/googletest @ 1.17.0

[env:native_kiss_modem]
platform = native
test_framework = googletest
build_flags = -std=c++17
  -I test/mocks
  -I src
  -I examples/kiss_modem
test_build_src = yes
test_filter = test_kiss_modem
build_src_filter =
  -<*>
  +<../examples/kiss_modem/KissModem.cpp>
lib_deps =
  google/googletest @ 1.17.0
