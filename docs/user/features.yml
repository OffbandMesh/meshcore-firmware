schema_version: 1
features:
  - id: firmware-install
    title: Choose, install and update firmware
    coverage: documented
    guide: guides/install-update.md
    roles: [companion-observer, companion, repeater]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current release-format and flashing implementation checked; no hardware flash performed and no blanket older-release compatibility claim. The boot-screen lines, hold times and per-board color/monochrome arrangement are read from current source, not from a device photograph.
    evidence:
      - path: scripts/pio-flash.py
        contains: ['ESP32_APP0_OFFSET = 0x10000', '--erase requires the full -merged.bin']
      - path: README.md
        contains: ['first install', 'update', 'device identity + config']
      - path: src/helpers/ui/OffbandSplash.cpp
        contains: ['const bool color = (art != nullptr);', 'on MeshCore %.*s', 'const char* last = info.role_line ? info.role_line : info.build_date;']
      - path: examples/companion_radio/ui-new/UITask.cpp
        contains: ['#define BOOT_SCREEN_MILLIS   3000', 'offband::SplashInfo si( nullptr, FIRMWARE_VERSION, FIRMWARE_BUILD_DATE );']
      - path: examples/simple_repeater/UITask.cpp
        contains: ['#define BOOT_SCREEN_MILLIS   4000', '"< Repeater >"']
      - path: variants/heltec_v4/platformio.ini
        contains: ['-D DISPLAY_CLASS=ST7789LCDDisplay', '-D DISPLAY_CLASS=SSD1306Display']
  - id: observer-wifi
    title: Connect an observer to WiFi
    coverage: documented
    guide: guides/observer-wifi.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability:
      channel: stable
      verified_releases: [offband-v1.4.0]
    verification: Source-checked against current implementation and v1.4.0; no new hardware trial.
    evidence:
      - path: src/helpers/config/WifiConfigProvider.cpp
        contains: ['wifi.pwd is write-only', 'wifi.status = %s ip=%s', 'p.putString(field, value)', 'wifi.enabled = %d (reboot to apply)']
      - path: src/helpers/wifi_observer/WifiBootstrap.cpp
        contains: ['prefs.getBool("enabled", true)', 'WiFi.begin(ssid.c_str(), pwd.c_str())']
      - path: src/helpers/wifi_observer/SystemChannelCli.h
        contains: ['_sys @ <8hex>', 'no shell escapes']
      - path: variants/heltec_v4/platformio.ini
        contains: ['[env:heltec_v4_companion_observer_wifi]', '[env:heltec_v4_tft_companion_observer_wifi]']
      - path: variants/heltec_v3/platformio.ini
        contains: ['[env:Heltec_v3_companion_observer_wifi]']
      - path: variants/xiao_s3_wio/platformio.ini
        contains: ['[env:Xiao_S3_WIO_companion_observer_wifi]']
  - id: observer-mqtt
    title: Publish observer data to a broker
    coverage: documented
    guide: guides/observer-mqtt.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current command handlers and state labels checked; no live broker or hardware trial. Older release behavior must be checked separately.
    evidence:
      - path: src/helpers/wifi_observer/ObserverCli.cpp
        contains: ['waiting-turn', 'held(no-clock)', 'mqtt slot %d: %s', 'password is write-only']
      - path: src/helpers/wifi_observer/WifiObserverConfig.h
        contains: ['#define OFFBAND_MAX_BROKERS 10']
      - path: src/helpers/wifi_observer/MqttBroker.cpp
        contains: ['mqcfg.broker.address.uri = cfg_.url;']
  - id: observer-location
    title: Choose time, GPS and location sharing
    coverage: documented
    guide: guides/observer-location.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current companion location/time paths and compile-time GPS choices checked; app UI and physical GPS receiver availability are not inferred from board name.
    evidence:
      - path: examples/companion_radio/main.cpp
        contains: ['snap.loc_valid = false', 'sensors.node_lat != 0.0 || sensors.node_lon != 0.0']
      - path: src/helpers/wifi_observer/WifiObserver.cpp
        contains: ['SNTP started immediately', 'SNTP stopped (GPS>NTP)']
      - path: examples/companion_radio/MyMesh.cpp
        contains: ['CMD_SET_ADVERT_LATLON && len >= 9', 'CMD_SET_CUSTOM_VAR && len >= 4']
  - id: safeboot
    title: Understand the low-power boot guard
    coverage: documented
    guide: guides/power-and-recovery.md
    roles: [companion-observer, repeater]
    boards: [heltec_v3, heltec_v4]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: ESP32 source and conditional SafeBoot/OTA recovery paths checked; no low-voltage or rollback trial, no universal hardware recovery guarantee.
    evidence:
      - path: src/SafeBoot.cpp
        contains: ['#define DEFAULT_SAFE_BOOT_WAKE_MV 3700', 'SAFE_BOOT_DISABLED', 'below safe threshold']
      - path: src/helpers/ESP32Board.cpp
        contains: ['esp_ota_mark_app_valid_cancel_rollback', 'ROLLBACK_THRESHOLD']
  - id: diagnostic-logs
    title: Collect logs for support
    coverage: documented
    guide: guides/support-logs.md
    roles: [companion-observer, repeater]
    boards: [heltec_v3, heltec_v4]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Capture helper dependencies/redaction and role-specific status surfaces checked; no new device capture and no guarantee that arbitrary logs are secret-free.
    evidence:
      - path: scripts/_cap_serial.py
        contains: ['from log_redact import redact_line', 'default=115200', '--no-redact']
      - path: src/helpers/wifi_observer/ObserverCli.cpp
        contains: ['"caplog status"', 'OFFBAND_CAPLOG_FORWARD']
  - id: observer-neighbors
    title: Report the repeaters an observer hears and their regions
    coverage: planned
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, heltec_v4_r8, heltec_rcc6, xiao_s3_wio]
    availability: {channel: development, verified_releases: []}
    verification: discover.neighbors, discover.scopes, the CoreScope /neighbors report and the mqtt.neighbors settings checked against source, native tests and a golden report fed through CoreScope's ingest rules only; not in any release, no on-air, hardware or live-broker trial. The guide is published when a release carries the feature.
    evidence:
      - path: src/helpers/wifi_observer/NeighborsCli.cpp
        contains: ['discover.neighbors: request queued', 'discover.scopes: querying %d neighbors, one at a time (up to 20 s each)', 'mqtt.neighbors = on, every %u h', 'nbr: on, every %u h, %s%s, last %s']
      - path: src/helpers/wifi_observer/NeighborsReport.h
        contains: ['constexpr size_t kNeighborsReportMax = 10240;']
      - path: src/helpers/wifi_observer/NeighborsSchedule.h
        contains: ['constexpr uint16_t kNeighborsIntervalMinHours = 12;', 'constexpr uint16_t kNeighborsIntervalMaxHours = 336;', 'constexpr uint16_t kNeighborsIntervalDefaultHours = 24;']
      - path: src/helpers/wifi_observer/MqttBrokerPool.cpp
        contains: ['formatTopic(topic, topic_size, "neighbors", ctx);']
      - path: src/helpers/wifi_observer/ObserverNeighbors.h
        contains: ['constexpr uint8_t kAnonReqTypeRegions = 0x01;', 'constexpr uint32_t kRegionQueryTimeoutMs = 20000;']
      - path: src/helpers/wifi_observer/CliPassthrough.cpp
        contains: ['isBareWord(p, "discover.neighbors")', 'isBareWord(p, "discover.scopes")']
