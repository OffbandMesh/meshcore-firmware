schema_version: 1
features:
  - id: firmware-install
    title: Choose, install and update firmware
    coverage: documented
    guide: guides/install-update.md
    roles: [companion-observer, companion, repeater]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current release-format and flashing implementation checked; no hardware flash performed and no blanket older-release compatibility claim. The boot-screen lines, hold times and per-board color/monochrome arrangement are read from current source, not from a device photograph.
    evidence:
      - path: scripts/pio-flash.py
        contains: ['ESP32_APP0_OFFSET = 0x10000', '--erase requires the full -merged.bin']
      - path: README.md
        contains: ['first install', 'update', 'device identity + config']
      - path: src/helpers/ui/OffbandSplash.cpp
        contains: ['const bool color = (art != nullptr);', 'on MeshCore %.*s', 'const char* last = info.role_line ? info.role_line : info.build_date;']
      - path: examples/companion_radio/ui-new/UITask.cpp
        contains: ['#define BOOT_SCREEN_MILLIS   3000', 'offband::SplashInfo si( nullptr, FIRMWARE_VERSION, FIRMWARE_BUILD_DATE );']
      - path: examples/simple_repeater/UITask.cpp
        contains: ['#define BOOT_SCREEN_MILLIS   4000', '"< Repeater >"']
      - path: variants/heltec_v4/platformio.ini
        contains: ['-D DISPLAY_CLASS=ST7789LCDDisplay', '-D DISPLAY_CLASS=SSD1306Display']
  - id: observer-wifi
    title: Connect an observer to WiFi
    coverage: documented
    guide: guides/observer-wifi.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability:
      channel: stable
      verified_releases: [offband-v1.4.0]
    verification: Source-checked against current implementation and v1.4.0; no new hardware trial.
    evidence:
      - path: src/helpers/config/WifiConfigProvider.cpp
        contains: ['wifi.pwd is write-only', 'wifi.status = %s ip=%s', 'p.putString(field, value)', 'wifi.enabled = %d (reboot to apply)']
      - path: src/helpers/wifi_observer/WifiBootstrap.cpp
        contains: ['prefs.getBool("enabled", true)', 'WiFi.begin(ssid.c_str(), pwd.c_str())']
      - path: src/helpers/wifi_observer/SystemChannelCli.h
        contains: ['_sys @ <8hex>', 'no shell escapes']
      - path: variants/heltec_v4/platformio.ini
        contains: ['[env:heltec_v4_companion_observer_wifi]', '[env:heltec_v4_tft_companion_observer_wifi]']
      - path: variants/heltec_v3/platformio.ini
        contains: ['[env:Heltec_v3_companion_observer_wifi]']
      - path: variants/xiao_s3_wio/platformio.ini
        contains: ['[env:Xiao_S3_WIO_companion_observer_wifi]']
  - id: observer-mqtt
    title: Publish observer data to a broker
    coverage: documented
    guide: guides/observer-mqtt.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current command handlers and state labels checked; no live broker or hardware trial. Older release behavior must be checked separately.
    evidence:
      - path: src/helpers/wifi_observer/ObserverCli.cpp
        contains: ['waiting-turn', 'held(no-clock)', 'mqtt slot %d: %s', 'password is write-only']
      - path: src/helpers/wifi_observer/WifiObserverConfig.h
        contains: ['#define OFFBAND_MAX_BROKERS 10']
      - path: src/helpers/wifi_observer/MqttBroker.cpp
        contains: ['mqcfg.broker.address.uri = cfg_.url;']
  - id: observer-location
    title: Choose time, GPS and location sharing
    coverage: documented
    guide: guides/observer-location.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, xiao_s3_wio]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Current companion location/time paths and compile-time GPS choices checked; app UI and physical GPS receiver availability are not inferred from board name.
    evidence:
      - path: examples/companion_radio/main.cpp
        contains: ['snap.loc_valid = false', 'sensors.node_lat != 0.0 || sensors.node_lon != 0.0']
      - path: src/helpers/wifi_observer/WifiObserver.cpp
        contains: ['SNTP started immediately', 'SNTP stopped (GPS>NTP)']
      - path: examples/companion_radio/MyMesh.cpp
        contains: ['CMD_SET_ADVERT_LATLON && len >= 9', 'CMD_SET_CUSTOM_VAR && len >= 4']
  - id: safeboot
    title: Understand the low-power boot guard
    coverage: documented
    guide: guides/power-and-recovery.md
    roles: [companion-observer, repeater]
    boards: [heltec_v3, heltec_v4]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: ESP32 source and conditional SafeBoot/OTA recovery paths checked; no low-voltage or rollback trial, no universal hardware recovery guarantee.
    evidence:
      - path: src/SafeBoot.cpp
        contains: ['#define DEFAULT_SAFE_BOOT_WAKE_MV 3700', 'SAFE_BOOT_DISABLED', 'below safe threshold']
      - path: src/helpers/ESP32Board.cpp
        contains: ['esp_ota_mark_app_valid_cancel_rollback', 'ROLLBACK_THRESHOLD']
      - path: src/helpers/SafeBootWake.h
        contains: ['constexpr uint16_t kSafeBootMinPlausibleMv = 1000;']
      - path: src/SafeBoot.cpp
        contains: ['below 1000 so taken as no reading -- continuing boot']
  - id: diagnostic-logs
    title: Collect logs for support
    coverage: documented
    guide: guides/support-logs.md
    roles: [companion-observer, repeater]
    boards: [heltec_v3, heltec_v4]
    availability: {channel: beta, verified_releases: [offband-v1.6.0-beta1]}
    verification: Capture helper dependencies/redaction and role-specific status surfaces checked; no new device capture and no guarantee that arbitrary logs are secret-free.
    evidence:
      - path: scripts/_cap_serial.py
        contains: ['from log_redact import redact_line', 'default=115200', '--no-redact']
      - path: src/helpers/wifi_observer/ObserverCli.cpp
        contains: ['"caplog status"', 'OFFBAND_CAPLOG_FORWARD']
  - id: observer-neighbors
    title: Report the repeaters an observer hears and their regions
    coverage: documented
    guide: guides/observer-neighbors.md
    roles: [companion-observer]
    boards: [heltec_v3, heltec_v4, heltec_v4_r8, heltec_rcc6, xiao_s3_wio]
    availability: {channel: development, verified_releases: []}
    verification: discover.neighbors, discover.scopes, the CoreScope /neighbors report and the mqtt.neighbors settings checked against source, native tests and a golden report fed through CoreScope's ingest rules only; not in any release, no on-air, hardware or live-broker trial.
    evidence:
      - path: src/helpers/wifi_observer/NeighborsCli.cpp
        contains: ['discover.neighbors: request queued', 'discover.scopes: querying %d neighbors, one at a time (up to 20 s each)', 'mqtt.neighbors = on, every %u h', 'nbr: on, every %u h, %s%s, last %s']
      - path: src/helpers/wifi_observer/NeighborsReport.h
        contains: ['constexpr size_t kNeighborsReportMax = 10240;']
      - path: src/helpers/wifi_observer/NeighborsSchedule.h
        contains: ['constexpr uint16_t kNeighborsIntervalMinHours = 12;', 'constexpr uint16_t kNeighborsIntervalMaxHours = 336;', 'constexpr uint16_t kNeighborsIntervalDefaultHours = 24;']
      - path: src/helpers/wifi_observer/MqttBrokerPool.cpp
        contains: ['formatTopic(topic, topic_size, "neighbors", ctx);']
      - path: src/helpers/wifi_observer/ObserverNeighbors.h
        contains: ['constexpr uint8_t kAnonReqTypeRegions = 0x01;', 'constexpr uint32_t kRegionQueryTimeoutMs = 20000;']
      - path: src/helpers/wifi_observer/CliPassthrough.cpp
        contains: ['isBareWord(p, "discover.neighbors")', 'isBareWord(p, "discover.scopes")']
  - id: qcc-badge
    title: Use your QCC badge
    coverage: documented
    guide: guides/qcc-badge.md
    roles: [companion]
    boards: [qcc_badge]
    availability: {channel: development, verified_releases: []}
    verification: Badge screens, settings, defaults and client-settable surfaces checked against development source, including the Bluetooth PIN with and without a display. No badge without a screen has been paired against this text. The low-battery refusal, SOS and button wake were bench-tested on QCC badges at raised test thresholds, not on a low cell; keyboardless list navigation has no recorded hardware result. Screen rotation set from the client was hardware-tested on a QCC badge, flipped repeatedly between 0 and 180 degrees and applied every time, with the display always-on/auto/dark modes exercised in the same session.
    evidence:
      - path: variants/qcc_badge/platformio.ini
        contains: ['-D LORA_FREQ=919.5', '-D LORA_BW=500', '-D LORA_SF=7', '-D LORA_CR=5', '-D LORA_TX_POWER=22']
      - path: variants/qcc_badge/QccChannels.h
        contains: ['"#queencitycon"', '"#okimesh"', '"#test"', '"#echo"', '"#offband"', '"#qcchhv"', '"#qcchams"']
      - path: src/helpers/NodeNameFromMac.h
        contains: ['kQccNamePrefix = "QCC-"']
      - path: src/helpers/ui/Tunes.h
        contains: ['{"Chime",', '{"Kerplop",', '{"Knock",']
      - path: src/helpers/GpsPowerMode.h
        contains: ['kGpsFirstAttemptTimeoutMs = 180000']
      - path: examples/companion_radio/ui-new/BadgeScreens.cpp
        contains: ['" BT pin %06lu"', '" phone connected"', '"stale"']
      - path: examples/companion_radio/ui-new/UITask.cpp
        contains: ['"Shutting Down!"']
      - path: src/SafeBoot.cpp
        contains: ['static const char kSos[] = "SOS";']
      - path: examples/companion_radio/MyMesh.cpp
        contains: ['if (has_display && BLE_PIN_CODE == 123456) {', '_active_ble_pin = BLE_PIN_CODE; // otherwise static pin']
  - id: tdeck-pro
    title: Use your LilyGo T-Deck Pro
    coverage: planned
    roles: [companion]
    boards: [lilygo_tdeck_pro]
    availability: {channel: development, verified_releases: []}
    verification: Bring-up only. One diagnostic Bluetooth companion image for the T-Deck Pro V1.1 e-paper, drawing the standard home screen on the e-paper panel. Pins checked against LilyGo's V1.1 schematic and pin header; the env builds in CI with source tests of its pins, shared SPI bus and diag flags. No hardware result is recorded yet; the guide is published when a release carries a non-diagnostic T-Deck Pro image. Its draft is docs/initiatives/2004-tdeck-pro/2005-bringup/GUIDE-DRAFT.md.
    evidence:
      - path: variants/lilygo_tdeck_pro/platformio.ini
        contains: ['[env:LilyGo_TDeck_Pro_companion_radio_ble_diag]', '-D EINK_DISPLAY_MODEL=GxEPD2_310_GDEQ031T10', '-D P_LORA_EN=46']
      - path: variants/lilygo_tdeck_pro/target.cpp
        contains: ['return radio.std_init(&SPI1);']
  - id: t1000e
    title: Use your SenseCAP T1000-E
    coverage: documented
    guide: guides/t1000e.md
    roles: [companion]
    boards: [t1000-e]
    availability: {channel: development, verified_releases: []}
    verification: Sounds, per-channel and per-event tunes and the message-waiting LED are in regular use on a T1000-E over several weeks, per-channel tunes included; the send tone rode in that same use rather than being isolated as its own check. The device-wide notification scope and button defaults are checked against development source and native/source tests only. GPS power save has no T1000-E result at all -- its attempt-and-back-off cycle was captured on a QCC badge, which runs the same rules. SafeBoot start-up on a charged battery was bench-tested on a T1000-E (about 4.17 V read and boot continued on every start).
    evidence:
      - path: variants/t1000-e/platformio.ini
        contains: ['-D OFFBAND_UI_ORIG_TUNE_ENGINE', '-D OFFBAND_SENT_TONE_ON_CLIENT_SEND', '-D DEFAULT_TONE_SENT=offband::kTuneTick', '-D OFFBAND_GPS_POWER_SAVE=1', '-D OFFBAND_HEARTBEAT_MSG_ON_MS=490', '-D SAFEBOOT_VBAT_ENABLE_PIN=PIN_3V3_EN']
      - path: src/helpers/ui/Tunes.h
        contains: ['#define DEFAULT_TONE_CONTACT  offband::kTuneChime', '#define DEFAULT_TONE_CHANNEL  offband::kTuneKerplop', '#define DEFAULT_TONE_ACK      offband::kTuneTick']
      - path: examples/companion_radio/ui-orig/UITask.cpp
        contains: ['buzzer.play("scopeAll:d=32,o=6,b=180:c,e,g");', 'buzzer.play("scopeSelf:d=16,o=6,b=180:e");', 'buzzer.play("scopeNone:d=32,o=6,b=180:g,e,c");']
      - path: examples/companion_radio/MyMesh.cpp
        contains: ['_prefs.button_actions[OFFBAND_UI_SEQ_DOUBLE] = OFFBAND_UI_ACTION_ADVERT;', '_prefs.button_actions[OFFBAND_UI_SEQ_TRIPLE] = OFFBAND_UI_ACTION_CYCLE_SCOPE;', '_prefs.button_actions[OFFBAND_UI_SEQ_QUAD]   = OFFBAND_UI_ACTION_GPS_TOGGLE;', 'if (_ui && attempt == 0 && txt_type == TXT_TYPE_PLAIN) _ui->notify(UIEventType::sent);']
      - path: src/helpers/NRF52Board.cpp
        contains: ['#define OFFBAND_HEARTBEAT_ON_MS 90', '#define OFFBAND_HEARTBEAT_OFF_MS 890']
      - path: src/helpers/GpsPowerMode.h
        contains: ['constexpr uint32_t kGpsIntervalMs = 3600000;', 'constexpr uint32_t kGpsMinPsIntervalS = 300;']
  - id: repeater-neighbors
    title: Report the regions of a repeater and its neighbors to CoreScope
    coverage: documented
    guide: guides/repeater-neighbors.md
    roles: [repeater]
    boards: [heltec_v4]
    availability: {channel: development, verified_releases: []}
    verification: discover.scopes on the repeater, its scope query to the repeaters it hears directly, its CoreScope /neighbors report and the mqtt.neighbors settings checked against source, native tests and source-wiring checks only; not in any release, no on-air, hardware or live-broker trial.
    evidence:
      - path: examples/simple_repeater/MyMesh.cpp
        contains: ['int MyMesh::exportFloodScopes(char* dest)', 'OK - querying %d neighbors, then publishing', 'OK - querying neighbors: %d of %d done', 'OK - publishing own scopes', 'OK - own scopes queued; waiting for clock and a broker', 'Err - no memory for the query']
      - path: src/helpers/wifi_observer/RegionsPeer.h
        contains: ['constexpr int kRegionsPeerIdx = -2;']
      - path: variants/heltec_v4/platformio.ini
        contains: ['-D OFFBAND_NEIGHBORS_REPORT=1', '+<helpers/wifi_observer/NeighborsCli.cpp>']
