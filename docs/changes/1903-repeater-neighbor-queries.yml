schema_version: 1
issue: 1903
impact: updated
guides:
  - docs/user/guides/repeater-neighbors.md
reason: >-
  The WiFi-telemetry repeater's /neighbors report (#1902) now also lists the
  regions of each repeater it hears directly, which it asks for one at a time,
  and discover.scopes on the repeater queries them before publishing, reports
  progress while a query runs, and publishes its own regions straight away when
  it has heard no neighbors. The repeater-neighbors guide describes the query,
  its three new replies and the worst-case duration, and drops its note that
  neighbors' regions are not in the report yet; it and its catalog entry
  (repeater-neighbors in docs/user/features.yml) are retitled to match.
  Periodic publishing is still off unless turned on; settings, defaults and
  every other repeater command and reply are unchanged, and admin logins and
  forwarding are unaffected while a query runs.
