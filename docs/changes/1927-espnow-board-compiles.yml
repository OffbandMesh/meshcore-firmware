schema_version: 1
issue: 1927
impact: none
reason: >-
  The four ESP-NOW targets are not documented or supported hardware. They appear
  in no entry of docs/user/features.yml, in no release asset, and they had not
  compiled since 2026-02-13, so they produced no firmware for anyone to be
  running. Restoring a build does not make them a supported device, and this
  change makes no claim that it does. On boards that do have a radio the
  generated code is unchanged - the disassembly of ESP32Board.cpp.o matches
  baseline instruction for instruction - so no shipped image changes behavior.
  The new timer-only light sleep, used where there is no radio IRQ to wake on,
  exists only on those previously broken targets, and no command, setting,
  default, persisted value or on-screen wording changes anywhere.
