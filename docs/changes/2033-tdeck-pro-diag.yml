schema_version: 1
issue: 2033
impact: none
reason: >-
  Adds the first LilyGo T-Deck Pro image, LilyGo_TDeck_Pro_companion_radio_ble_diag,
  for the V1.1 e-paper unit: the standard companion home screen on the e-paper
  panel, the radio sharing the panel's SPI bus, and the fleet diag surface. It is a
  bring-up diagnostic image, not in any release, so no published guide changes.
  It is written up as an unpublished draft guide,
  docs/initiatives/2004-tdeck-pro/2005-bringup/GUIDE-DRAFT.md, and catalogued as
  the planned feature tdeck-pro; the guide is published when a release carries a
  non-diagnostic T-Deck Pro image.
