reason: Adds the CoreScope /neighbors report to the companion observer, the settings mqtt.neighbors and mqtt.neighbors.interval, an nbr line in mqtt status, and a second line in the discover.scopes reply, which are user-visible, but only in unreleased development builds; no published guide can describe them yet, because the manual's catalog accepts a guide only for behavior a release carries. The feature stays cataloged as planned in docs/user/features.yml with source evidence, and its guide draft is kept with the plan (docs/initiatives/regional-operation/observer-neighbors/GUIDE-DRAFT.md); it is published, and this record replaced by an updated one, when a release carries the feature. Periodic publishing is off unless turned on; existing settings, defaults and other replies are unchanged.
