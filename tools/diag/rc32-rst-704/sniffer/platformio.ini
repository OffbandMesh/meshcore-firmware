; #704 diagnostic: RC32 UART0 sniffer on an Adafruit Feather ESP32-S3.
; nopsram board chosen deliberately -- it is safe on BOTH Feather S3 variants
; (4MB/2MB-PSRAM and 8MB/no-PSRAM share a pinout; not enabling PSRAM cannot
; break a board that has it, while enabling it CAN break one that does not).
[env:feather_sniffer]
platform = platformio/espressif32@6.11.0
board = adafruit_feather_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1            ; Serial -> USB-Serial-JTAG (HWCDC), the interface that actually enumerates (303A:1001)
  -D ARDUINO_USB_CDC_ON_BOOT=1
