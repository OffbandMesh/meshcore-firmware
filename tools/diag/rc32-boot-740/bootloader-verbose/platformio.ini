; #740 -- builds a VERBOSE second-stage bootloader for rc32-bench-1.
;
; This project exists only to emit bootloader.bin. The application it builds is
; a stub and is never flashed -- the real Offband app comes from the main tree.
;
; WHY A SEPARATE PROJECT: arduino-esp32 ships the bootloader PREBUILT
; (tools/sdk/esp32s3/bin/bootloader_qio_80m.elf) with
; CONFIG_BOOTLOADER_LOG_LEVEL_NONE. PlatformIO will not rebuild it under
; `framework = arduino`, so the only way to change its log level is to build one
; under `framework = espidf` and substitute it into the merged image.
;
; VERSION PINNING IS LOAD-BEARING. platform espressif32@6.13.0 pairs
; framework-arduinoespressif32 3.20017 (arduino-esp32 2.0.17) with
; framework-espidf 3.40407 (ESP-IDF 4.4.7) -- the SAME IDF the stock bootloader
; was built from. Do not float this version. A 5.x bootloader under a 4.4.7 app
; is a version mismatch that can produce a boot failure indistinguishable from
; the bug under investigation (#702).
;
; NOTE: board is a generic S3 devkit, not heltec-rc32, because the RC32 board
; JSON lives in the main repo's boards/ dir and is not visible from here. This
; is safe: the produced bootloader depends on target + flash mode + frequency +
; size, all of which are pinned explicitly below to match boards/heltec-rc32.json
; (mcu esp32s3, flash_mode qio, f_flash 80000000L, flash_size 16MB). It does NOT
; depend on PSRAM mode -- the stock bootloader is shared across qio_qspi and
; qio_opi, keyed on flash mode + frequency alone.

[env:rc32_bootloader_verbose]
platform = espressif32@6.13.0
; PINNING THE PLATFORM IS NOT ENOUGH. espressif32@6.13.0 pairs
; framework-arduinoespressif32 3.20017 (arduino-esp32 2.0.17, built on ESP-IDF
; 4.4.7) with framework-espidf 3.50503 (ESP-IDF *5.5.3*) -- the platform's two
; frameworks are themselves on different IDF majors. Taking the default would
; build a 5.5.3 bootloader for a 4.4.7 application: precisely the version
; mismatch this artifact exists to avoid. Override the package explicitly.
platform_packages =
  platformio/framework-espidf@3.40407.240606
  ; The IDF also pins its compiler. IDF 4.4.7 requires crosstool-NG
  ; esp-2021r2-patch5 / GCC 8.4.0 and hard-fails
  ; (tools/cmake/crosstool_version_check.cmake) against the modern unified
  ; toolchain-xtensa-esp-elf 14.2.0 that espressif32@6.13.0 selects by default.
  ; That check exists for good reason -- do NOT silence it with IDF_MAINTAINER=1
  ; and build 4.4.7 sources with GCC 14. Pin the matching compiler instead; it
  ; is already on the host because the arduino builds use it.
  ; BLOCKED -- see BLOCKED.md. The pin below installs the right compiler but
  ; the espressif32@6.13.0 espidf builder hardcodes toolchain-xtensa-esp-elf
  ; and uses it anyway, so crosstool_version_check still fails.
  ; platformio/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5
framework = espidf
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
