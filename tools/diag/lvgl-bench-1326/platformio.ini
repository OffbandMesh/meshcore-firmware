; #1326 D4: LVGL render/flush timing on the Heltec V4 TFT at 80/160/240 MHz.
; Standalone bench project -- not part of the firmware build matrix.
; Build: pio run -d tools/diag/lvgl-bench-1326
;
; The panel path matches Offband's ST7789LCDDisplay: Adafruit_ST7789 on HSPI,
; 40 MHz SPI, rotation 3 (320x240), pins from [heltec_v4_tft].

[platformio]
boards_dir = ../../../boards

[env:lvgl_bench_v4]
platform = platformio/espressif32@6.11.0
framework = arduino
board = heltec_v4
monitor_speed = 115200
build_flags =
  -D LV_CONF_INCLUDE_SIMPLE
  -I include
  -I ../../../variants/heltec_v4   ; pins_arduino.h only -- the variant's .cpp files stay out
  -D PIN_VEXT_EN=36
  -D PIN_TFT_LEDA_CTL=21
  -D PIN_TFT_RST=18
  -D PIN_TFT_CS=15
  -D PIN_TFT_DC=16
  -D PIN_TFT_SCL=17
  -D PIN_TFT_SDA=33
  -D TFT_ROTATION=3
  -D TFT_SPI_HZ=40000000
  -D BUF_LINES=24
lib_deps =
  lvgl/lvgl @ 8.3.11
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
